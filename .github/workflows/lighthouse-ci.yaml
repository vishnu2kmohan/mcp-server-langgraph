# Lighthouse CI Workflow
# Runs Lighthouse audits on pull requests to catch performance regressions
#
# Enforces performance budgets for Core Web Vitals and accessibility

name: Lighthouse CI

on:
  pull_request:
    paths:
      - 'src/mcp_server_langgraph/studio/frontend/**'
      - '.github/workflows/lighthouse-ci.yaml'
  push:
    branches:
      - main
    paths:
      - 'src/mcp_server_langgraph/studio/frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_DIR: src/mcp_server_langgraph/studio/frontend

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: Install Dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build Frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: ${{ env.FRONTEND_DIR }}/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          budgetPath: ${{ env.FRONTEND_DIR }}/lighthouse-budget.json

      - name: Upload Lighthouse Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: |
            .lighthouseci/
          retention-days: 14

      - name: Comment PR with Lighthouse Results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read manifest if exists
            const manifestPath = '.lighthouseci/manifest.json';
            if (!fs.existsSync(manifestPath)) {
              console.log('No Lighthouse manifest found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const results = manifest[0];

            if (!results || !results.summary) {
              console.log('No Lighthouse results found');
              return;
            }

            const { performance, accessibility, 'best-practices': bestPractices, seo, pwa } = results.summary;

            const getEmoji = (score) => {
              if (score >= 0.9) return '🟢';
              if (score >= 0.7) return '🟡';
              return '🔴';
            };

            const formatScore = (score) => Math.round(score * 100);

            const body = `## 🔦 Lighthouse Report

            | Category | Score |
            |----------|-------|
            | ${getEmoji(performance)} Performance | ${formatScore(performance)} |
            | ${getEmoji(accessibility)} Accessibility | ${formatScore(accessibility)} |
            | ${getEmoji(bestPractices)} Best Practices | ${formatScore(bestPractices)} |
            | ${getEmoji(seo)} SEO | ${formatScore(seo)} |
            | ${getEmoji(pwa)} PWA | ${formatScore(pwa)} |

            [📊 View Full Report](${results.htmlReportUrl})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
