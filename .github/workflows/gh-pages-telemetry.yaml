name: GitHub Pages Telemetry

# ==============================================================================
# GitHub Pages Telemetry - Self-Hosted Project Metrics
# ==============================================================================
#
# Purpose:
#   Publishes comprehensive project telemetry to GitHub Pages including:
#   - HTML coverage reports (browsable code coverage)
#   - Test duration trends (performance tracking)
#   - Self-hosted badges (coverage, build status)
#   - Project dashboard (aggregated metrics view)
#
# Triggers:
#   - After CI workflow completes on main (via workflow_run)
#   - After Quality Tests workflow completes (for benchmarks)
#   - Weekly schedule for trend updates
#   - Manual dispatch for ad-hoc updates
#
# OPTIMIZATION (2025-12-01): Changed from push trigger to workflow_run trigger
# to consume coverage artifacts from CI workflow instead of running tests again.
# This saves ~5-10 minutes per CI run by eliminating duplicate test execution.
#
# Published to: https://vishnu2kmohan.github.io/mcp-server-langgraph/
#
# Structure:
#   gh-pages/
#   ├── index.html           # Dashboard landing page
#   ├── coverage/            # HTML coverage reports
#   ├── badges/              # Self-hosted SVG badges
#   ├── trends/              # Test duration trends
#   └── dev/bench/           # Benchmark history (existing)
#
# ==============================================================================

on:
  # Trigger after CI workflow completes on main branch
  workflow_run:
    workflows: ["CI/CD Pipeline (Optimized)"]
    types: [completed]
    branches: [main]

  schedule:
    # Update weekly on Monday at 6 AM UTC
    - cron: '0 6 * * 1'

  workflow_dispatch:
    inputs:
      force_update:
        description: 'Force update all telemetry'
        type: boolean
        default: false

concurrency:
  group: gh-pages-telemetry
  cancel-in-progress: false  # Don't cancel ongoing deployments

permissions:
  contents: write  # Required for gh-pages push
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # ============================================================================
  # Collect Coverage from CI Workflow
  # ============================================================================
  # OPTIMIZATION (2025-12-01): Instead of running tests again, download coverage
  # artifacts from the CI workflow. This eliminates ~5-10 minutes of duplicate work.
  collect-coverage:
    name: Collect Coverage from CI
    runs-on: ubuntu-latest
    # Timeout: 10 min for workflow_run (artifact download), 20 min for manual/schedule (runs tests)
    timeout-minutes: 20

    # Only run if CI workflow succeeded, or if scheduled/manual trigger
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    outputs:
      coverage_percent: ${{ steps.coverage.outputs.percent }}
      tests_passed: ${{ steps.coverage.outputs.passed }}
      tests_failed: ${{ steps.coverage.outputs.failed }}
      tests_skipped: ${{ steps.coverage.outputs.skipped }}
      tests_xfailed: ${{ steps.coverage.outputs.xfailed }}
      tests_total: ${{ steps.coverage.outputs.total }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download coverage HTML from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v6
        with:
          name: coverage-html
          path: coverage-html/
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download coverage JSON from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v6
        with:
          name: coverage-json
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Download test durations from CI
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v6
        with:
          name: test-durations-py3.12
          path: .
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # For scheduled/manual runs, generate fresh coverage
      - name: Setup Python (for scheduled/manual runs)
        if: github.event_name != 'workflow_run'
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          extras: 'dev'

      - name: Run tests with coverage (scheduled/manual only)
        if: github.event_name != 'workflow_run'
        run: |
          OTEL_SDK_DISABLED=true uv run --frozen pytest \
            -n auto \
            -m "(unit or api or property or validation) and not llm" \
            --cov=src/mcp_server_langgraph \
            --cov-report=html:coverage-html \
            --cov-report=json:coverage.json \
            --cov-report=term \
            --durations=50 \
            --tb=short \
            2>&1 | tee test-durations.txt

      - name: Extract coverage metrics
        id: coverage
        run: |
          # Extract coverage percentage from JSON
          if [ -f coverage.json ]; then
            COVERAGE=$(python3 -c "import json; data=json.load(open('coverage.json')); print(f\"{data['totals']['percent_covered']:.1f}\")")
          else
            COVERAGE="0.0"
            echo "⚠️ No coverage.json found, using default"
          fi
          echo "percent=$COVERAGE" >> $GITHUB_OUTPUT

          # Extract test counts from durations file
          # Pytest output format: "4505 passed, 3 failed, 12 skipped, 2 xfailed in 156.32s"
          # Note: grep returns empty (not 0) when no match, so use ${VAR:-0} pattern
          if [ -f test-durations.txt ]; then
            PASSED=$(grep -oP '\d+(?= passed)' test-durations.txt | tail -1)
            PASSED="${PASSED:-0}"
            FAILED=$(grep -oP '\d+(?= failed)' test-durations.txt | tail -1)
            FAILED="${FAILED:-0}"
            SKIPPED=$(grep -oP '\d+(?= skipped)' test-durations.txt | tail -1)
            SKIPPED="${SKIPPED:-0}"
            XFAILED=$(grep -oP '\d+(?= xfailed)' test-durations.txt | tail -1)
            XFAILED="${XFAILED:-0}"
          else
            PASSED="0"
            FAILED="0"
            SKIPPED="0"
            XFAILED="0"
            echo "⚠️ No test-durations.txt found, using defaults"
          fi
          TOTAL=$((PASSED + FAILED + SKIPPED + XFAILED))
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT
          echo "xfailed=$XFAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          echo "📊 Coverage: $COVERAGE%"
          echo "✅ Passed: $PASSED"
          echo "❌ Failed: $FAILED"
          echo "⏭️ Skipped: $SKIPPED"
          echo "⚠️ XFailed: $XFAILED"
          echo "📋 Total: $TOTAL"

      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@v5
        with:
          name: coverage-html
          path: coverage-html/
          retention-days: 30
          if-no-files-found: warn

      - name: Upload test output artifact
        uses: actions/upload-artifact@v5
        with:
          name: test-output
          path: test-durations.txt
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # Generate Test Duration Trends
  # ============================================================================
  generate-trends:
    name: Generate Test Duration Trends
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: collect-coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout gh-pages for existing data
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download test output
        uses: actions/download-artifact@v6
        with:
          name: test-output
          path: .
        continue-on-error: true

      - name: Generate trend data
        run: |
          mkdir -p trends

          # Create or update trends JSON
          python << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          # Load existing trends
          trends_file = Path("gh-pages-data/trends/test-durations.json")
          if trends_file.exists():
              with open(trends_file) as f:
                  trends = json.load(f)
          else:
              trends = {"runs": [], "metadata": {"created": datetime.now().isoformat()}}

          # Parse test durations from output
          durations = []
          try:
              with open("test-durations.txt") as f:
                  content = f.read()
                  # Extract slowest durations section
                  if "slowest durations" in content.lower():
                      lines = content.split("\n")
                      for line in lines:
                          if "s call" in line or "s setup" in line:
                              parts = line.strip().split()
                              if parts and parts[0].replace(".", "").replace("s", "").isdigit():
                                  duration = float(parts[0].rstrip("s"))
                                  test_name = " ".join(parts[1:])
                                  durations.append({"name": test_name[:100], "duration": duration})
          except Exception as e:
              print(f"Warning: Could not parse durations: {e}")

          # Add new run data
          new_run = {
              "timestamp": datetime.now().isoformat(),
              "commit": os.environ.get("GITHUB_SHA", "unknown")[:8],
              "branch": os.environ.get("GITHUB_REF_NAME", "unknown"),
              "coverage": float(os.environ.get("COVERAGE_PERCENT") or "0"),
              "tests_passed": int(os.environ.get("TESTS_PASSED") or "0"),
              "tests_failed": int(os.environ.get("TESTS_FAILED") or "0"),
              "slowest_tests": durations[:20]  # Keep top 20 slowest
          }
          trends["runs"].append(new_run)

          # Keep last 100 runs
          trends["runs"] = trends["runs"][-100:]
          trends["metadata"]["updated"] = datetime.now().isoformat()

          # Save trends
          Path("trends").mkdir(exist_ok=True)
          with open("trends/test-durations.json", "w") as f:
              json.dump(trends, f, indent=2)

          print(f"✅ Added run data: {new_run['timestamp']}")
          print(f"📊 Total runs tracked: {len(trends['runs'])}")
          EOF
        env:
          COVERAGE_PERCENT: ${{ needs.collect-coverage.outputs.coverage_percent }}
          TESTS_PASSED: ${{ needs.collect-coverage.outputs.tests_passed }}
          TESTS_FAILED: ${{ needs.collect-coverage.outputs.tests_failed }}

      - name: Upload trends artifact
        uses: actions/upload-artifact@v5
        with:
          name: trends-data
          path: trends/
          retention-days: 30

  # ============================================================================
  # Collect Frontend Memory Metrics
  # ============================================================================
  collect-frontend-memory:
    name: Collect Frontend Memory Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Run on schedule or manual dispatch (not on workflow_run to avoid duplicate work)
    if: github.event_name == 'schedule' || github.event.inputs.force_update == 'true'

    outputs:
      peak_heap_mb: ${{ steps.memory.outputs.peak_heap_mb }}
      final_heap_mb: ${{ steps.memory.outputs.final_heap_mb }}
      delta_mb: ${{ steps.memory.outputs.delta_mb }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/mcp_server_langgraph/studio/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/mcp_server_langgraph/studio/frontend
        run: npm ci

      - name: Run frontend tests with memory tracking
        id: memory
        working-directory: src/mcp_server_langgraph/studio/frontend
        run: |
          # Run a subset of tests with memory tracking enabled
          npm test -- --run src/test/ 2>&1 | tee test-output.txt || true

          # Extract memory trend data from output
          if grep -q "::memory-trend-start::" test-output.txt; then
            # Extract JSON between markers
            sed -n '/::memory-trend-start::/,/::memory-trend-end::/p' test-output.txt | \
              grep -v '::memory-trend' > memory-trend.json

            # Parse summary values
            PEAK_HEAP=$(jq -r '.summary.peakHeapUsedMB' memory-trend.json)
            FINAL_HEAP=$(jq -r '.summary.finalHeapUsedMB' memory-trend.json)
            DELTA=$(jq -r '.summary.totalDeltaMB' memory-trend.json)

            echo "peak_heap_mb=$PEAK_HEAP" >> $GITHUB_OUTPUT
            echo "final_heap_mb=$FINAL_HEAP" >> $GITHUB_OUTPUT
            echo "delta_mb=$DELTA" >> $GITHUB_OUTPUT

            echo "📊 Memory Metrics:"
            echo "  Peak Heap: ${PEAK_HEAP}MB"
            echo "  Final Heap: ${FINAL_HEAP}MB"
            echo "  Delta: ${DELTA}MB"
          else
            echo "⚠️ No memory trend data found in output"
            echo "peak_heap_mb=0" >> $GITHUB_OUTPUT
            echo "final_heap_mb=0" >> $GITHUB_OUTPUT
            echo "delta_mb=0" >> $GITHUB_OUTPUT
          fi
        env:
          CI: 'true'
          VITEST_MEMORY_TREND: 'true'

      - name: Check memory thresholds
        if: steps.memory.outputs.peak_heap_mb != '0'
        run: |
          PEAK_HEAP="${{ steps.memory.outputs.peak_heap_mb }}"
          DELTA="${{ steps.memory.outputs.delta_mb }}"

          # Memory threshold configuration
          WARN_THRESHOLD_MB=150   # Warning at 150MB peak heap
          ERROR_THRESHOLD_MB=250  # Error at 250MB peak heap
          DELTA_WARN_MB=50        # Warning if memory grew by 50MB+ since suite start

          echo "📊 Memory Threshold Analysis"
          echo "  Peak Heap: ${PEAK_HEAP}MB"
          echo "  Delta: ${DELTA}MB"
          echo ""

          # Check peak heap thresholds
          if (( $(echo "$PEAK_HEAP >= $ERROR_THRESHOLD_MB" | bc -l) )); then
            echo "::error title=Memory Threshold Exceeded::Peak heap usage (${PEAK_HEAP}MB) exceeds error threshold (${ERROR_THRESHOLD_MB}MB). Consider investigating memory leaks."
            echo "MEMORY_STATUS=error" >> $GITHUB_ENV
          elif (( $(echo "$PEAK_HEAP >= $WARN_THRESHOLD_MB" | bc -l) )); then
            echo "::warning title=High Memory Usage::Peak heap usage (${PEAK_HEAP}MB) exceeds warning threshold (${WARN_THRESHOLD_MB}MB). Monitor for memory growth."
            echo "MEMORY_STATUS=warning" >> $GITHUB_ENV
          else
            echo "✅ Peak heap (${PEAK_HEAP}MB) is within acceptable limits"
            echo "MEMORY_STATUS=ok" >> $GITHUB_ENV
          fi

          # Check memory growth (delta)
          # Remove potential negative sign for comparison
          DELTA_ABS=$(echo "$DELTA" | tr -d '-')
          if (( $(echo "$DELTA >= $DELTA_WARN_MB" | bc -l) )); then
            echo "::warning title=Significant Memory Growth::Memory grew by ${DELTA}MB during test suite. This may indicate a memory leak."
          elif (( $(echo "$DELTA <= -$DELTA_WARN_MB" | bc -l 2>/dev/null) )); then
            echo "ℹ️ Memory decreased by ${DELTA_ABS}MB (GC working well)"
          else
            echo "✅ Memory growth (${DELTA}MB) is within normal range"
          fi

      - name: Checkout gh-pages for existing data
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: Check memory regression against history
        if: steps.memory.outputs.peak_heap_mb != '0'
        run: |
          echo "🔍 Memory Regression Detection"
          echo ""

          CURRENT_PEAK="${{ steps.memory.outputs.peak_heap_mb }}"

          # Regression detection configuration
          WARN_PERCENT=10   # Warning at 10% increase from last run
          ERROR_PERCENT=20  # Error at 20% increase from last run

          # Check if we have historical data
          if [ -f "gh-pages-data/trends/memory-trends.json" ]; then
            # Get the last run's peak heap
            PREVIOUS_PEAK=$(jq -r '.runs[-1].peakHeapMB // empty' gh-pages-data/trends/memory-trends.json 2>/dev/null || echo "")

            if [ -n "$PREVIOUS_PEAK" ] && [ "$PREVIOUS_PEAK" != "null" ] && [ "$PREVIOUS_PEAK" != "0" ]; then
              # Calculate percent change
              PERCENT_CHANGE=$(echo "scale=2; (($CURRENT_PEAK - $PREVIOUS_PEAK) / $PREVIOUS_PEAK) * 100" | bc -l)

              echo "  Previous run: ${PREVIOUS_PEAK}MB"
              echo "  Current run:  ${CURRENT_PEAK}MB"
              echo "  Change:       ${PERCENT_CHANGE}%"
              echo ""

              # Calculate rolling average (last 5 runs)
              ROLLING_AVG=$(jq -r '[.runs[-5:][].peakHeapMB] | add / length' gh-pages-data/trends/memory-trends.json 2>/dev/null || echo "0")
              echo "  Rolling average (5 runs): ${ROLLING_AVG}MB"

              # Check thresholds
              if (( $(echo "$PERCENT_CHANGE >= $ERROR_PERCENT" | bc -l) )); then
                echo ""
                echo "::error title=Memory Regression Detected::Peak heap increased by ${PERCENT_CHANGE}% (${PREVIOUS_PEAK}MB → ${CURRENT_PEAK}MB). Exceeds ${ERROR_PERCENT}% error threshold. Investigate potential memory leak."
              elif (( $(echo "$PERCENT_CHANGE >= $WARN_PERCENT" | bc -l) )); then
                echo ""
                echo "::warning title=Memory Increase Warning::Peak heap increased by ${PERCENT_CHANGE}% (${PREVIOUS_PEAK}MB → ${CURRENT_PEAK}MB). Exceeds ${WARN_PERCENT}% warning threshold."
              elif (( $(echo "$PERCENT_CHANGE < 0" | bc -l) )); then
                echo ""
                echo "✅ Memory improved by ${PERCENT_CHANGE#-}% (${PREVIOUS_PEAK}MB → ${CURRENT_PEAK}MB)"
              else
                echo ""
                echo "✅ Memory stable (${PERCENT_CHANGE}% change, within thresholds)"
              fi

              # Also check against rolling average
              if [ "$ROLLING_AVG" != "0" ]; then
                AVG_CHANGE=$(echo "scale=2; (($CURRENT_PEAK - $ROLLING_AVG) / $ROLLING_AVG) * 100" | bc -l)
                if (( $(echo "$AVG_CHANGE >= 25" | bc -l) )); then
                  echo "::warning title=Above Rolling Average::Current run (${CURRENT_PEAK}MB) is ${AVG_CHANGE}% above 5-run average (${ROLLING_AVG}MB)"
                fi
              fi
            else
              echo "  ℹ️ Previous run data not available or zero, skipping regression check"
            fi
          else
            echo "  ℹ️ No historical memory data found. This run will establish the baseline."
          fi

      - name: Generate memory trends JSON
        run: |
          mkdir -p trends

          # Create or update memory trends JSON
          python << 'EOF'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          # Load existing trends from gh-pages if available
          trends_file = Path("gh-pages-data/trends/memory-trends.json")
          if trends_file.exists():
              with open(trends_file) as f:
                  trends = json.load(f)
          else:
              trends = {"runs": [], "metadata": {"created": datetime.now().isoformat()}}

          # Add new run data
          new_run = {
              "timestamp": datetime.now().isoformat(),
              "commit": os.environ.get("GITHUB_SHA", "unknown")[:8],
              "branch": os.environ.get("GITHUB_REF_NAME", "unknown"),
              "peakHeapMB": float(os.environ.get("PEAK_HEAP_MB") or "0"),
              "finalHeapMB": float(os.environ.get("FINAL_HEAP_MB") or "0"),
              "deltaMB": float(os.environ.get("DELTA_MB") or "0"),
              "testSuite": "frontend"
          }
          trends["runs"].append(new_run)

          # Keep last 100 runs
          trends["runs"] = trends["runs"][-100:]
          trends["metadata"]["updated"] = datetime.now().isoformat()

          # Save trends
          Path("trends").mkdir(exist_ok=True)
          with open("trends/memory-trends.json", "w") as f:
              json.dump(trends, f, indent=2)

          print(f"✅ Added memory run data: {new_run['timestamp']}")
          print(f"📊 Total memory runs tracked: {len(trends['runs'])}")
          EOF
        env:
          PEAK_HEAP_MB: ${{ steps.memory.outputs.peak_heap_mb }}
          FINAL_HEAP_MB: ${{ steps.memory.outputs.final_heap_mb }}
          DELTA_MB: ${{ steps.memory.outputs.delta_mb }}

      - name: Upload memory trends artifact
        uses: actions/upload-artifact@v5
        with:
          name: memory-trends-data
          path: trends/
          retention-days: 30

  # ============================================================================
  # Generate Badges
  # ============================================================================
  generate-badges:
    name: Generate Self-Hosted Badges
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: collect-coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Checkout gh-pages for existing data
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          extras: 'release-tools'

      - name: Generate badges
        run: |
          mkdir -p badges

          # Coverage badge
          COVERAGE="${{ needs.collect-coverage.outputs.coverage_percent }}"
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR="brightgreen"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR="yellow"
          else
            COLOR="red"
          fi

          uv run --frozen python -m pybadges \
            --left-text="coverage" \
            --right-text="${COVERAGE}%" \
            --right-color="$COLOR" \
            > badges/coverage.svg

          # Tests badge - comprehensive breakdown: passed | failed | skipped | xfailed
          # Set defaults to handle empty outputs gracefully
          PASSED="${{ needs.collect-coverage.outputs.tests_passed }}"
          PASSED="${PASSED:-0}"
          FAILED="${{ needs.collect-coverage.outputs.tests_failed }}"
          FAILED="${FAILED:-0}"
          SKIPPED="${{ needs.collect-coverage.outputs.tests_skipped }}"
          SKIPPED="${SKIPPED:-0}"
          XFAILED="${{ needs.collect-coverage.outputs.tests_xfailed }}"
          XFAILED="${XFAILED:-0}"
          TOTAL="${{ needs.collect-coverage.outputs.tests_total }}"
          TOTAL="${TOTAL:-0}"

          # Build badge text: "4505 passed" or "4500 passed | 5 failed" etc.
          BADGE_TEXT="$PASSED passed"
          if [ "$FAILED" != "0" ]; then
            BADGE_TEXT="$BADGE_TEXT | $FAILED failed"
          fi
          if [ "$SKIPPED" != "0" ]; then
            BADGE_TEXT="$BADGE_TEXT | $SKIPPED skipped"
          fi
          if [ "$XFAILED" != "0" ]; then
            BADGE_TEXT="$BADGE_TEXT | $XFAILED xfailed"
          fi

          # Color: green if no failures, red if failures
          if [ "$FAILED" = "0" ]; then
            TESTS_COLOR="brightgreen"
          else
            TESTS_COLOR="red"
          fi

          uv run --frozen python -m pybadges \
            --left-text="tests" \
            --right-text="$BADGE_TEXT" \
            --right-color="$TESTS_COLOR" \
            > badges/tests.svg

          # Build status badge
          uv run --frozen python -m pybadges \
            --left-text="build" \
            --right-text="passing" \
            --right-color="brightgreen" \
            > badges/build.svg

          # Python version badge
          uv run --frozen python -m pybadges \
            --left-text="python" \
            --right-text="3.11 | 3.12 | 3.13" \
            --right-color="blue" \
            > badges/python.svg

          # Memory badge - reads from existing trends or shows N/A
          # Try to get latest memory data from gh-pages
          MEMORY_TEXT="N/A"
          MEMORY_COLOR="lightgrey"
          if [ -f "gh-pages-data/trends/memory-trends.json" ]; then
            PEAK_HEAP=$(jq -r '.runs[-1].peakHeapMB // empty' gh-pages-data/trends/memory-trends.json 2>/dev/null || echo "")
            if [ -n "$PEAK_HEAP" ] && [ "$PEAK_HEAP" != "null" ]; then
              MEMORY_TEXT="${PEAK_HEAP}MB"
              # Color based on memory usage: green < 100MB, yellow < 200MB, red >= 200MB
              if (( $(echo "$PEAK_HEAP < 100" | bc -l) )); then
                MEMORY_COLOR="brightgreen"
              elif (( $(echo "$PEAK_HEAP < 200" | bc -l) )); then
                MEMORY_COLOR="yellow"
              else
                MEMORY_COLOR="red"
              fi
            fi
          fi

          uv run --frozen python -m pybadges \
            --left-text="memory" \
            --right-text="$MEMORY_TEXT" \
            --right-color="$MEMORY_COLOR" \
            > badges/memory.svg

          echo "✅ Generated badges:"
          ls -la badges/

      - name: Upload badges artifact
        uses: actions/upload-artifact@v5
        with:
          name: badges
          path: badges/
          retention-days: 30

  # ============================================================================
  # Generate Dashboard
  # ============================================================================
  generate-dashboard:
    name: Generate Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [collect-coverage, generate-badges]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate dashboard HTML
        run: |
          mkdir -p dashboard

          # Set variables with defaults to handle empty outputs gracefully
          COVERAGE="${{ needs.collect-coverage.outputs.coverage_percent }}"
          COVERAGE="${COVERAGE:-0}"
          PASSED="${{ needs.collect-coverage.outputs.tests_passed }}"
          PASSED="${PASSED:-0}"
          FAILED="${{ needs.collect-coverage.outputs.tests_failed }}"
          FAILED="${FAILED:-0}"
          SKIPPED="${{ needs.collect-coverage.outputs.tests_skipped }}"
          SKIPPED="${SKIPPED:-0}"
          XFAILED="${{ needs.collect-coverage.outputs.tests_xfailed }}"
          XFAILED="${XFAILED:-0}"
          TOTAL="${{ needs.collect-coverage.outputs.tests_total }}"
          TOTAL="${TOTAL:-0}"
          COMMIT="${GITHUB_SHA:0:8}"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")

          echo "📊 Dashboard values: Coverage=$COVERAGE%, Passed=$PASSED, Failed=$FAILED, Skipped=$SKIPPED, XFailed=$XFAILED, Total=$TOTAL"

          cat > dashboard/index.html << 'DASHBOARD_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>MCP Server LangGraph - Project Telemetry</title>
              <style>
                  :root {
                      --bg-primary: #0d1117;
                      --bg-secondary: #161b22;
                      --bg-tertiary: #21262d;
                      --text-primary: #c9d1d9;
                      --text-secondary: #8b949e;
                      --accent-green: #3fb950;
                      --accent-yellow: #d29922;
                      --accent-red: #f85149;
                      --accent-blue: #58a6ff;
                      --border-color: #30363d;
                  }
                  * { box-sizing: border-box; margin: 0; padding: 0; }
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                      background: var(--bg-primary);
                      color: var(--text-primary);
                      line-height: 1.6;
                      padding: 2rem;
                  }
                  .container { max-width: 1200px; margin: 0 auto; }
                  header {
                      text-align: center;
                      margin-bottom: 2rem;
                      padding-bottom: 1rem;
                      border-bottom: 1px solid var(--border-color);
                  }
                  h1 { font-size: 2rem; margin-bottom: 0.5rem; }
                  .subtitle { color: var(--text-secondary); }
                  .badges {
                      display: flex;
                      justify-content: center;
                      gap: 0.5rem;
                      margin: 1rem 0;
                      flex-wrap: wrap;
                  }
                  .badges img { height: 20px; }
                  .grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
                      gap: 1.5rem;
                      margin: 2rem 0;
                  }
                  .card {
                      background: var(--bg-secondary);
                      border: 1px solid var(--border-color);
                      border-radius: 8px;
                      padding: 1.5rem;
                  }
                  .card h2 {
                      font-size: 1rem;
                      color: var(--text-secondary);
                      margin-bottom: 1rem;
                      text-transform: uppercase;
                      letter-spacing: 0.05em;
                  }
                  .metric {
                      font-size: 2.5rem;
                      font-weight: 600;
                      margin-bottom: 0.5rem;
                  }
                  .metric.green { color: var(--accent-green); }
                  .metric.yellow { color: var(--accent-yellow); }
                  .metric.red { color: var(--accent-red); }
                  .metric.blue { color: var(--accent-blue); }
                  .metric-label { color: var(--text-secondary); font-size: 0.9rem; }
                  .test-breakdown {
                      display: flex;
                      flex-wrap: wrap;
                      gap: 0.5rem;
                      margin-top: 0.75rem;
                      font-size: 0.85rem;
                  }
                  .test-breakdown span {
                      padding: 0.25rem 0.5rem;
                      background: var(--bg-tertiary);
                      border-radius: 4px;
                  }
                  .test-breakdown .passed { color: var(--accent-green); }
                  .test-breakdown .failed { color: var(--accent-red); }
                  .test-breakdown .skipped { color: var(--accent-yellow); }
                  .test-breakdown .xfailed { color: var(--text-secondary); }
                  .links {
                      display: flex;
                      flex-direction: column;
                      gap: 0.75rem;
                  }
                  .links a {
                      color: var(--accent-blue);
                      text-decoration: none;
                      padding: 0.75rem 1rem;
                      background: var(--bg-tertiary);
                      border-radius: 6px;
                      display: flex;
                      align-items: center;
                      gap: 0.5rem;
                      transition: background 0.2s;
                  }
                  .links a:hover { background: var(--border-color); }
                  footer {
                      text-align: center;
                      margin-top: 2rem;
                      padding-top: 1rem;
                      border-top: 1px solid var(--border-color);
                      color: var(--text-secondary);
                      font-size: 0.85rem;
                  }
                  .update-info { margin-top: 0.5rem; }
              </style>
          </head>
          <body>
              <div class="container">
                  <header>
                      <h1>🚀 MCP Server LangGraph</h1>
                      <p class="subtitle">Project Telemetry Dashboard</p>
                      <div class="badges">
                          <img src="badges/build.svg" alt="Build Status">
                          <img src="badges/coverage.svg" alt="Coverage">
                          <img src="badges/tests.svg" alt="Tests">
                          <img src="badges/memory.svg" alt="Memory Usage">
                          <img src="badges/python.svg" alt="Python Versions">
                      </div>
                  </header>

                  <div class="grid">
                      <div class="card">
                          <h2>📊 Code Coverage</h2>
                          <div class="metric COVERAGE_COLOR">COVERAGE_VALUE%</div>
                          <div class="metric-label">of codebase covered by tests</div>
                      </div>

                      <div class="card">
                          <h2>✅ Test Results</h2>
                          <div class="metric TESTS_COLOR">TOTAL_VALUE</div>
                          <div class="metric-label">total tests</div>
                          <div class="test-breakdown">
                              <span class="passed">✅ PASSED_VALUE passed</span>
                              <span class="failed">❌ FAILED_VALUE failed</span>
                              <span class="skipped">⏭️ SKIPPED_VALUE skipped</span>
                              <span class="xfailed">⚠️ XFAILED_VALUE xfailed</span>
                          </div>
                      </div>

                      <div class="card">
                          <h2>🧠 Frontend Memory</h2>
                          <div class="metric blue" id="memory-metric">--</div>
                          <div class="metric-label">peak heap (MB)</div>
                          <div class="test-breakdown">
                              <span id="memory-final">Final: --MB</span>
                              <span id="memory-delta">Delta: --MB</span>
                          </div>
                          <div id="memory-regression" class="test-breakdown" style="margin-top: 0.5rem;">
                              <span id="regression-status" style="padding: 0.25rem 0.5rem; border-radius: 4px; font-weight: 500;">Loading...</span>
                          </div>
                          <script>
                              fetch('trends/memory-trends.json')
                                  .then(r => r.json())
                                  .then(data => {
                                      if (data.runs && data.runs.length > 0) {
                                          const latest = data.runs[data.runs.length - 1];
                                          document.getElementById('memory-metric').textContent = latest.peakHeapMB.toFixed(1);
                                          document.getElementById('memory-final').textContent = 'Final: ' + latest.finalHeapMB.toFixed(1) + 'MB';
                                          const deltaSign = latest.deltaMB >= 0 ? '+' : '';
                                          document.getElementById('memory-delta').textContent = 'Delta: ' + deltaSign + latest.deltaMB.toFixed(1) + 'MB';
                                          document.getElementById('memory-delta').style.color = latest.deltaMB > 50 ? 'var(--accent-red)' : latest.deltaMB > 20 ? 'var(--accent-yellow)' : 'var(--accent-green)';

                                          // Regression detection
                                          const regressionEl = document.getElementById('regression-status');
                                          if (data.runs.length >= 2) {
                                              const previous = data.runs[data.runs.length - 2];
                                              const percentChange = ((latest.peakHeapMB - previous.peakHeapMB) / previous.peakHeapMB) * 100;
                                              const changeText = (percentChange >= 0 ? '+' : '') + percentChange.toFixed(1) + '% vs last';

                                              if (percentChange >= 20) {
                                                  regressionEl.textContent = '⚠️ Regression: ' + changeText;
                                                  regressionEl.style.background = 'rgba(248, 81, 73, 0.2)';
                                                  regressionEl.style.color = 'var(--accent-red)';
                                              } else if (percentChange >= 10) {
                                                  regressionEl.textContent = '⚡ Warning: ' + changeText;
                                                  regressionEl.style.background = 'rgba(210, 153, 34, 0.2)';
                                                  regressionEl.style.color = 'var(--accent-yellow)';
                                              } else if (percentChange < 0) {
                                                  regressionEl.textContent = '📉 Improved: ' + changeText;
                                                  regressionEl.style.background = 'rgba(63, 185, 80, 0.2)';
                                                  regressionEl.style.color = 'var(--accent-green)';
                                              } else {
                                                  regressionEl.textContent = '✅ Stable: ' + changeText;
                                                  regressionEl.style.background = 'rgba(63, 185, 80, 0.2)';
                                                  regressionEl.style.color = 'var(--accent-green)';
                                              }
                                          } else {
                                              regressionEl.textContent = '📊 Baseline (first run)';
                                              regressionEl.style.background = 'rgba(88, 166, 255, 0.2)';
                                              regressionEl.style.color = 'var(--accent-blue)';
                                          }
                                      }
                                  })
                                  .catch(() => {
                                      document.getElementById('regression-status').textContent = 'No data';
                                      document.getElementById('regression-status').style.color = 'var(--text-secondary)';
                                  });
                          </script>
                      </div>

                      <div class="card" style="grid-column: span 2;">
                          <h2>📈 Memory Trend (Last 20 Runs)</h2>
                          <div id="memory-chart-container" style="height: 200px; position: relative;">
                              <svg id="memory-chart" width="100%" height="100%" viewBox="0 0 600 180" preserveAspectRatio="xMidYMid meet">
                                  <text x="300" y="90" text-anchor="middle" fill="var(--text-secondary)" font-size="14">Loading memory trend data...</text>
                              </svg>
                          </div>
                          <div id="chart-legend" class="test-breakdown" style="margin-top: 0.5rem; justify-content: center;">
                              <span style="color: var(--accent-blue);">● Peak Heap (MB)</span>
                              <span style="color: var(--accent-green);">● Final Heap (MB)</span>
                          </div>
                          <script>
                              fetch('trends/memory-trends.json')
                                  .then(r => r.json())
                                  .then(data => {
                                      if (!data.runs || data.runs.length === 0) return;

                                      const runs = data.runs.slice(-20);
                                      const svg = document.getElementById('memory-chart');
                                      const width = 600, height = 180;
                                      const margin = { top: 20, right: 40, bottom: 30, left: 50 };
                                      const chartWidth = width - margin.left - margin.right;
                                      const chartHeight = height - margin.top - margin.bottom;

                                      const allValues = runs.flatMap(r => [r.peakHeapMB || 0, r.finalHeapMB || 0]);
                                      const maxVal = Math.max(...allValues, 100);
                                      const minVal = Math.min(...allValues, 0);
                                      const yRange = maxVal - minVal || 1;

                                      const scaleX = (i) => margin.left + (i / (runs.length - 1 || 1)) * chartWidth;
                                      const scaleY = (v) => margin.top + chartHeight - ((v - minVal) / yRange) * chartHeight;

                                      let svgContent = '';

                                      // Grid lines
                                      for (let i = 0; i <= 4; i++) {
                                          const y = margin.top + (i / 4) * chartHeight;
                                          const val = maxVal - (i / 4) * yRange;
                                          svgContent += '<line x1="' + margin.left + '" y1="' + y + '" x2="' + (width - margin.right) + '" y2="' + y + '" stroke="var(--border-color)" stroke-dasharray="2,2"/>';
                                          svgContent += '<text x="' + (margin.left - 5) + '" y="' + (y + 4) + '" text-anchor="end" fill="var(--text-secondary)" font-size="10">' + val.toFixed(0) + '</text>';
                                      }

                                      // Peak heap line (blue)
                                      let peakPath = 'M';
                                      runs.forEach((r, i) => {
                                          const x = scaleX(i);
                                          const y = scaleY(r.peakHeapMB || 0);
                                          peakPath += (i === 0 ? '' : 'L') + x + ',' + y;
                                      });
                                      svgContent += '<path d="' + peakPath + '" fill="none" stroke="var(--accent-blue)" stroke-width="2"/>';

                                      // Final heap line (green)
                                      let finalPath = 'M';
                                      runs.forEach((r, i) => {
                                          const x = scaleX(i);
                                          const y = scaleY(r.finalHeapMB || 0);
                                          finalPath += (i === 0 ? '' : 'L') + x + ',' + y;
                                      });
                                      svgContent += '<path d="' + finalPath + '" fill="none" stroke="var(--accent-green)" stroke-width="2"/>';

                                      // Data points with tooltips
                                      runs.forEach((r, i) => {
                                          const x = scaleX(i);
                                          const commit = r.commit || '?';
                                          svgContent += '<circle cx="' + x + '" cy="' + scaleY(r.peakHeapMB || 0) + '" r="4" fill="var(--accent-blue)"><title>' + commit + ': ' + (r.peakHeapMB || 0).toFixed(1) + 'MB peak</title></circle>';
                                          svgContent += '<circle cx="' + x + '" cy="' + scaleY(r.finalHeapMB || 0) + '" r="3" fill="var(--accent-green)"><title>' + commit + ': ' + (r.finalHeapMB || 0).toFixed(1) + 'MB final</title></circle>';
                                      });

                                      // X-axis labels (first and last commit)
                                      if (runs.length > 0) {
                                          svgContent += '<text x="' + margin.left + '" y="' + (height - 5) + '" text-anchor="start" fill="var(--text-secondary)" font-size="10">' + (runs[0].commit || '') + '</text>';
                                          svgContent += '<text x="' + (width - margin.right) + '" y="' + (height - 5) + '" text-anchor="end" fill="var(--text-secondary)" font-size="10">' + (runs[runs.length - 1].commit || '') + '</text>';
                                      }

                                      svg.innerHTML = svgContent;
                                  })
                                  .catch(() => {
                                      document.getElementById('memory-chart').innerHTML = '<text x="300" y="90" text-anchor="middle" fill="var(--text-secondary)" font-size="14">No memory trend data available</text>';
                                  });
                          </script>
                      </div>

                      <div class="card">
                          <h2>📈 Reports & Trends</h2>
                          <div class="links">
                              <a href="coverage/">📁 Coverage Report (HTML)</a>
                              <a href="dev/bench/">⚡ Benchmark Dashboard</a>
                              <a href="trends/test-durations.json">📊 Test Duration Trends (JSON)</a>
                              <a href="trends/memory-trends.json">🧠 Memory Trends (JSON)</a>
                          </div>
                      </div>

                      <div class="card">
                          <h2>🔒 Security & Compliance</h2>
                          <div class="links">
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/actions/workflows/security-scan.yaml">🛡️ Security Scan Results</a>
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/actions/workflows/gcp-compliance-scan.yaml">✅ Compliance Reports</a>
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/security/dependabot">📦 Dependabot Alerts</a>
                          </div>
                      </div>

                      <div class="card">
                          <h2>🧪 Quality Tests</h2>
                          <div class="links">
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/actions/workflows/quality-tests.yaml">🧬 Mutation Tests (Weekly)</a>
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/actions/workflows/quality-tests.yaml">🔬 Property Tests</a>
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/actions/workflows/quality-tests.yaml">📋 Contract Tests</a>
                          </div>
                      </div>

                      <div class="card">
                          <h2>🔗 Quick Links</h2>
                          <div class="links">
                              <a href="https://mcp-server-langgraph.mintlify.app/">📚 Documentation</a>
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph">📦 GitHub Repository</a>
                              <a href="https://github.com/vishnu2kmohan/mcp-server-langgraph/actions">🔄 CI/CD Workflows</a>
                              <a href="coverage/">📈 Coverage Report (Detailed)</a>
                          </div>
                      </div>
                  </div>

                  <footer>
                      <p>Generated automatically by GitHub Actions</p>
                      <p class="update-info">Last updated: UPDATE_DATE | Commit: COMMIT_SHA</p>
                  </footer>
              </div>
          </body>
          </html>
          DASHBOARD_EOF

          # Replace placeholders
          if (( $(echo "$COVERAGE >= 80" | bc -l) )); then
            COLOR_CLASS="green"
          elif (( $(echo "$COVERAGE >= 60" | bc -l) )); then
            COLOR_CLASS="yellow"
          else
            COLOR_CLASS="red"
          fi

          if [ "$FAILED" = "0" ]; then
            TESTS_COLOR="green"
          else
            TESTS_COLOR="red"
          fi

          # IMPORTANT: Replace XFAILED_VALUE before FAILED_VALUE to avoid substring match
          # (FAILED_VALUE is a substring of XFAILED_VALUE)
          sed -i "s/XFAILED_VALUE/$XFAILED/g" dashboard/index.html
          sed -i "s/COVERAGE_VALUE/$COVERAGE/g" dashboard/index.html
          sed -i "s/COVERAGE_COLOR/$COLOR_CLASS/g" dashboard/index.html
          sed -i "s/PASSED_VALUE/$PASSED/g" dashboard/index.html
          sed -i "s/FAILED_VALUE/$FAILED/g" dashboard/index.html
          sed -i "s/SKIPPED_VALUE/$SKIPPED/g" dashboard/index.html
          sed -i "s/TOTAL_VALUE/$TOTAL/g" dashboard/index.html
          sed -i "s/TESTS_COLOR/$TESTS_COLOR/g" dashboard/index.html
          sed -i "s/UPDATE_DATE/$DATE/g" dashboard/index.html
          sed -i "s/COMMIT_SHA/$COMMIT/g" dashboard/index.html

          echo "✅ Generated dashboard"

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v5
        with:
          name: dashboard
          path: dashboard/
          retention-days: 30

  # ============================================================================
  # Generate Dashboard Metrics (DORA, Dependencies, Flakiness)
  # ============================================================================
  generate-metrics:
    name: Generate Dashboard Metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [generate-trends]  # Uses trends data for flakiness analysis

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full git history for DORA metrics

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download trends for flakiness analysis
        uses: actions/download-artifact@v6
        with:
          name: trends-data
          path: trends/
        continue-on-error: true

      - name: Generate all metrics
        run: |
          # Create metrics directory
          mkdir -p metrics

          # Run metrics generation script
          python scripts/ci/generate_dashboard_metrics.py \
            --output-dir metrics \
            --git-history-days 30

          echo "📊 Generated metrics:"
          ls -la metrics/
          cat metrics/all-metrics.json | head -50

      - name: Upload metrics artifact
        uses: actions/upload-artifact@v5
        with:
          name: dashboard-metrics
          path: metrics/
          retention-days: 30

  # ============================================================================
  # Generate Weekly Reports (AsyncMock, Memory Safety, Test Stats)
  # Consolidated from weekly-reports.yaml
  # ============================================================================
  generate-reports:
    name: Generate Weekly Reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only run on schedule or manual dispatch with force_update
    # Not on workflow_run (CI completion) - these are weekly scans
    if: github.event_name == 'schedule' || github.event.inputs.force_update == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for accurate stats

      - name: Set up Python and dependencies
        uses: ./.github/actions/setup-python-deps
        with:
          python-version: '3.12'
          extras: 'dev monitoring release-tools'

      - name: Create reports directory
        run: mkdir -p reports

      - name: Generate reports
        run: make generate-reports

      - name: Copy reports to artifact directory
        run: |
          if [ -d docs-internal/reports ]; then
            cp -r docs-internal/reports/* reports/
            echo "📊 Reports copied:"
            ls -la reports/
          else
            echo "⚠️ No reports generated"
          fi

      - name: Upload reports artifact
        uses: actions/upload-artifact@v5
        with:
          name: weekly-reports
          path: reports/
          retention-days: 30

  # ============================================================================
  # Deploy to GitHub Pages
  # ============================================================================
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [collect-coverage, generate-trends, generate-badges, generate-dashboard, generate-metrics]
    # Deploy when:
    # - Triggered by CI workflow completion (workflow_run) with success
    # - Scheduled run (weekly telemetry collection)
    # - Manual dispatch with force_update
    # Note: 'push' removed - workflow no longer has push trigger (changed to workflow_run in 8ef05b8)
    if: |
      github.event_name == 'schedule' ||
      github.event.inputs.force_update == 'true' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Assemble gh-pages content
        run: |
          # Keep existing benchmark data
          echo "📁 Preserving existing benchmark data..."

          # Copy new content
          echo "📁 Copying coverage report..."
          rm -rf gh-pages/coverage
          cp -r artifacts/coverage-html gh-pages/coverage

          echo "📁 Copying badges..."
          rm -rf gh-pages/badges
          cp -r artifacts/badges gh-pages/badges

          echo "📁 Copying trends..."
          mkdir -p gh-pages/trends
          cp -r artifacts/trends-data/* gh-pages/trends/

          echo "📁 Copying memory trends (if available)..."
          if [ -d artifacts/memory-trends-data ]; then
            cp -r artifacts/memory-trends-data/* gh-pages/trends/
            echo "  ✅ Memory trends copied"
          else
            echo "  ⚠️ No memory trends artifact (only generated on schedule)"
            # Bootstrap empty memory-trends.json if it doesn't exist
            if [ ! -f gh-pages/trends/memory-trends.json ]; then
              echo '{"runs":[],"metadata":{"created":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'","updated":"'"$(date -u +%Y-%m-%dT%H:%M:%SZ)"'"}}' > gh-pages/trends/memory-trends.json
              echo "  📝 Created initial memory-trends.json"
            fi
          fi

          echo "📁 Copying dashboard..."
          cp artifacts/dashboard/index.html gh-pages/index.html

          echo "📁 Copying metrics (DORA, Dependencies, Flakiness)..."
          mkdir -p gh-pages/metrics
          if [ -d artifacts/dashboard-metrics ]; then
            cp -r artifacts/dashboard-metrics/* gh-pages/metrics/
            echo "  ✅ Metrics copied"
          else
            echo "  ⚠️ No metrics artifacts found"
          fi

          echo "📁 Copying weekly reports (if available)..."
          mkdir -p gh-pages/reports
          if [ -d artifacts/weekly-reports ]; then
            cp -r artifacts/weekly-reports/* gh-pages/reports/
            echo "  ✅ Weekly reports copied (AsyncMock, Memory Safety, Test Stats)"
          else
            echo "  ⚠️ No weekly reports artifact (only generated on schedule)"
          fi

          echo "📁 Creating .last-updated timestamp..."
          date -u +%Y-%m-%dT%H:%M:%SZ > gh-pages/.last-updated

          echo "✅ Content assembled"
          ls -la gh-pages/

      - name: Deploy to GitHub Pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --staged --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "📊 Update telemetry dashboard

          Coverage: ${{ needs.collect-coverage.outputs.coverage_percent }}%
          Tests: ${{ needs.collect-coverage.outputs.tests_passed }} passed, ${{ needs.collect-coverage.outputs.tests_failed }} failed

          🤖 Generated by GitHub Actions"
            git push
            echo "✅ Deployed to GitHub Pages"
          fi

  # ============================================================================
  # Summary
  # ============================================================================
  summary:
    name: Telemetry Summary
    runs-on: ubuntu-latest
    needs: [collect-coverage, deploy]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## 📊 Telemetry Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Coverage | ${{ needs.collect-coverage.outputs.coverage_percent }}% |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Passed | ${{ needs.collect-coverage.outputs.tests_passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Failed | ${{ needs.collect-coverage.outputs.tests_failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View the telemetry dashboard: https://vishnu2kmohan.github.io/mcp-server-langgraph/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Reports" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- [Coverage Report](https://vishnu2kmohan.github.io/mcp-server-langgraph/coverage/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Benchmark Dashboard](https://vishnu2kmohan.github.io/mcp-server-langgraph/dev/bench/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Self-Hosted Badges](https://vishnu2kmohan.github.io/mcp-server-langgraph/badges/)" >> $GITHUB_STEP_SUMMARY
          echo "- [Memory Trends](https://vishnu2kmohan.github.io/mcp-server-langgraph/trends/memory-trends.json)" >> $GITHUB_STEP_SUMMARY
