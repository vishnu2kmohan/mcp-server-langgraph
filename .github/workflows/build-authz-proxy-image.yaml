name: Build Authz Proxy Image

# ==============================================================================
# Authz Proxy Image Build Workflow
# ==============================================================================
#
# This workflow builds and pushes the OpenFGA Playground auth proxy image.
# This service protects OpenFGA Playground with:
# - Keycloak JWT validation
# - OpenFGA authorization checks (user must have 'admin' on 'authz:playground')
# - Request proxying to OpenFGA Playground
#
# Triggers:
# - Push to main (when Dockerfile.authz-proxy or authz_proxy code changes)
# - Manual dispatch (for ad-hoc builds)
# - Weekly schedule (to get security updates)
#
# The image is pushed to:
# - Preview/Dev: ghcr.io/vishnu2kmohan/mcp-server-langgraph-authz-proxy (GHCR)
# - Production: Promoted from GHCR to cloud-specific registries
#
# Reference: ADR-0068 - Gateway-Level Authentication
# ==============================================================================

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile.authz-proxy'
      - 'src/mcp_server_langgraph/authz_proxy/**'
      - '.github/workflows/build-authz-proxy-image.yaml'

  # Weekly rebuild to pick up base image security updates
  schedule:
    - cron: '0 7 * * 1'  # Every Monday at 7 AM UTC

  workflow_dispatch:
    inputs:
      push_to_production:
        description: 'Also push to production registry'
        type: boolean
        default: false

concurrency:
  group: build-authz-proxy-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'vishnu-sandbox-20250310' }}
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

permissions:
  contents: read
  packages: write  # Required for pushing to GHCR
  security-events: write  # Required for SARIF upload to GitHub Security tab

jobs:
  build-and-push:
    name: Build Authz Proxy Image
    runs-on: ubuntu-latest
    # Only run in main repository (not forks) to avoid secret availability issues
    if: github.repository == 'vishnu2kmohan/mcp-server-langgraph'
    timeout-minutes: 20

    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate required files exist
        run: |
          if [ ! -f docker/Dockerfile.authz-proxy ]; then
            echo "::error::Dockerfile.authz-proxy not found"
            exit 1
          fi
          echo "✅ Dockerfile.authz-proxy found"

          if [ ! -d src/mcp_server_langgraph/authz_proxy ]; then
            echo "::error::src/mcp_server_langgraph/authz_proxy directory not found"
            exit 1
          fi
          echo "✅ authz_proxy module found"

      # Authenticate to GitHub Container Registry using GITHUB_TOKEN
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: ./.github/actions/setup-docker-buildx

      # Generate image metadata (tags, labels)
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/mcp-server-langgraph-authz-proxy
          tags: |
            type=sha,prefix=
            type=raw,value=latest
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=MCP Authz Proxy
            org.opencontainers.image.description=OpenFGA Playground auth proxy with Keycloak JWT + OpenFGA authorization
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      # Build and push to GHCR
      - name: Build and push Authz Proxy image
        id: build
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: docker/Dockerfile.authz-proxy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/mcp-server-langgraph-authz-proxy:latest
          cache-to: |
            type=inline
          provenance: true
          sbom: true

      - name: Output image info
        run: |
          echo "## Authz Proxy Image Built Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '${{ steps.meta.outputs.tags }}' | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY

  # Verify the built image works
  verify-image:
    name: Verify Image
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Authenticate to GHCR for pulling the image
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/mcp-server-langgraph-authz-proxy:latest"

          echo "Pulling image: $IMAGE"
          docker pull "$IMAGE"

          echo ""
          echo "Starting authz-proxy container..."
          # Start the container with minimal environment (health check only)
          docker run -d --name authz-proxy-test \
            -p 8003:8003 \
            -e KEYCLOAK_SERVER_URL=http://localhost:8080 \
            -e KEYCLOAK_REALM=test \
            -e OPENFGA_API_URL=http://localhost:8080 \
            -e OPENFGA_PRESHARED_KEY=test-key \
            -e OPENFGA_PLAYGROUND_URL=http://localhost:3000 \
            "$IMAGE"

          echo ""
          echo "Waiting for container to start..."
          sleep 5

          echo ""
          echo "Checking health endpoint..."
          # The health endpoint should be accessible even without Keycloak/OpenFGA
          # It may return a degraded status, but should respond
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8003/api/authz-proxy/health || echo "failed")

          if [ "$HEALTH_STATUS" = "200" ] || [ "$HEALTH_STATUS" = "503" ]; then
            echo "✅ Health endpoint responding (status: $HEALTH_STATUS)"
          else
            echo "Health check failed with status: $HEALTH_STATUS"
            echo "Container logs:"
            docker logs authz-proxy-test
            exit 1
          fi

          echo ""
          echo "Stopping container..."
          docker stop authz-proxy-test
          docker rm authz-proxy-test

          echo ""
          echo "✅ Image verification passed"

      - name: Security scan with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: 'ghcr.io/${{ github.repository_owner }}/mcp-server-langgraph-authz-proxy:latest'
          format: 'sarif'
          output: 'trivy-authz-proxy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-authz-proxy-results.sarif'
