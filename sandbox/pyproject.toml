# Sandbox Data Science Environment
# =================================
# Isolated Python environment for code execution in Docker sandbox.
# These packages match the Pyodide browser environment where possible.
#
# Source of truth: src/mcp_server_langgraph/execution/sandbox_packages.py
#
# Usage:
#   uv sync --frozen          # Install dependencies
#   uv pip list               # List installed packages
#
# SECURITY NOTES:
# - Network packages (httpx, requests, aiohttp) only work when network mode is enabled
# - Database dialects require credentials and network access
# - This environment runs untrusted user code - keep dependencies minimal

[project]
name = "mcp-sandbox"
version = "1.0.0"
description = "Sandboxed Python environment for data science code execution"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # =========================================================================
    # Data Science Core
    # =========================================================================
    "numpy>=2.2.0",
    "pandas>=2.3.0",
    "scipy>=1.14.0",

    # =========================================================================
    # Machine Learning
    # =========================================================================
    "scikit-learn>=1.6.0",
    "xgboost>=3.0.0",
    "lightgbm>=4.5.0",

    # =========================================================================
    # Visualization
    # =========================================================================
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "bokeh>=3.6.0",
    "altair>=5.5.0",

    # =========================================================================
    # Math & Science
    # =========================================================================
    "sympy>=1.13.0",
    "networkx>=3.4.0",
    "statsmodels>=0.14.0",

    # =========================================================================
    # Image Processing
    # =========================================================================
    "pillow>=11.0.0",
    "scikit-image>=0.24.0",

    # =========================================================================
    # Scientific Data Formats
    # =========================================================================
    "xarray>=2024.10.0",
    "h5py>=3.12.0",

    # =========================================================================
    # Utilities
    # =========================================================================
    "regex>=2024.11.0",
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.0",
    "lxml>=5.3.0",

    # =========================================================================
    # Network & HTTP (requires network mode enabled)
    # =========================================================================
    "httpx>=0.28.0",
    "requests>=2.32.0",
    "aiohttp>=3.11.0",

    # =========================================================================
    # Database (base SQLAlchemy for SQLite)
    # =========================================================================
    "sqlalchemy>=2.0.36",

    # =========================================================================
    # LLM Utilities
    # =========================================================================
    "tiktoken>=0.8.0",

    # =========================================================================
    # High-Performance Data (Docker Only - not available in Pyodide)
    # =========================================================================
    "polars>=1.18.0",

    # =========================================================================
    # Database Dialects (Docker Only - require native drivers)
    # These provide SQLAlchemy integration for cloud data warehouses
    # =========================================================================
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    # Redshift: Use redshift-connector directly (sqlalchemy-redshift doesn't support SQLAlchemy 2.0)
    "redshift-connector>=2.1.0",
    "sqlalchemy-bigquery>=1.12.0",
    "snowflake-sqlalchemy>=1.7.0",
    "sqlalchemy-cockroachdb>=2.0.2",
    # NOTE: ibm-db-sa removed - requires ibm-db which fails to build on ARM64 (aarch64)
    # The ibm-db package has a setup.py bug (undefined 'arch_' variable) on ARM architectures
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Use system Python in Docker container
python-preference = "system"
