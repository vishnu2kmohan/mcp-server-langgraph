# Docker Compose for Agent Studio - Test Environment
# ============================================================
# Isolated test infrastructure with ephemeral storage and test-specific ports
#
# USAGE:
#   # Start test services
#   docker compose -f docker-compose.test.yml up -d
#
#   # Or use Makefile
#   make test-infra-up
#
#   # Run tests with test infrastructure
#   make test-e2e
#
#   # Stop and clean up
#   docker compose -f docker-compose.test.yml down -v
#
# DIFFERENCES FROM MAIN docker-compose.yml:
#   - Test-specific ports (offset by 1000 to avoid conflicts)
#   - No persistent volumes (ephemeral storage for speed)
#   - Faster healthchecks (shorter intervals)
#   - Reduced resource limits for parallel execution
#   - TESTING=true environment variables
#   - Observability services optional (can be disabled)
#   - No hard-coded container names (allows multiple isolated test stacks)
#
# GATEWAY ROUTES (via Traefik on port 80):
#   /_oauth           - OAuth callback (traefik-forward-auth)
#   /api/*            - API endpoints for frontend [protected]
#   /agent-studio     - Agent Studio API [protected]
#   /studio/*         - Unified Studio Frontend [protected]
#                       - /studio/workflows - Visual Workflow Builder
#                       - /studio/chat      - Interactive Chat
#                       - /studio/sessions  - Session Management
#   /authn            - Keycloak (Authentication) [public]
#   /authz            - OpenFGA API [protected]
#   /playground       - OpenFGA Playground UI [protected]
#   /vectors          - Qdrant API [internal]
#   /dashboard        - Qdrant Web UI [protected]
#   /traces           - Tempo (Tracing) [internal]
#   /logs             - Loki (Logs) [internal]
#   /metrics          - Mimir (Metrics) [internal]
#   /telemetry        - Alloy (Telemetry Collector) [protected]
#   /dashboards       - Grafana (Dashboards) [protected]
#   /gateway          - Traefik Dashboard [protected]
#
# AUTHENTICATION (ADR-0054):
#   Protected routes require Keycloak authentication via traefik-forward-auth.
#   Public routes: /authn/*, health endpoints
#   Internal routes: Observability backends (access via Grafana dashboards)
#
# GRAFANA LGTM STACK:
#   Grafana (Dashboards) + Loki (Logs) + Tempo (Traces) + Mimir (Metrics)
#   Alloy is the unified collector that replaces Prometheus, Promtail, and OTEL Collector
#
# DIRECT PORTS (legacy, for direct access):
#   9432  - PostgreSQL/TimescaleDB (test, offset +4000 from standard 5432)
#   9379  - Redis (test, offset +3000 from standard 6379)
#   9333  - Qdrant (test, offset +3000 from standard 6333)
#   9080  - OpenFGA HTTP API (test, offset +1000 from standard 8080)
#   9081  - OpenFGA gRPC (test, offset +1000 from standard 8081)
#   9082  - Keycloak (test, offset +1002 from standard 8080)
#   9001  - Builder API (test, offset +1000 from dev port 8001)
#   9002  - Playground API (test, offset +1000 from dev port 8002)
#
# IMPORTANT - Container Naming:
#   Container names are NOT hard-coded (no container_name: directives) to allow
#   multiple isolated test stacks to run simultaneously. Docker Compose will use
#   project-scoped names like "{PROJECT_NAME}_postgres-test_1". This prevents:
#   - "container name already in use" conflicts during parallel tests
#   - Network teardown issues when isolated test projects clean up
#
#   To reference containers, use service names (postgres-test, openfga-test, etc.)
#   or docker compose commands:
#     docker compose -f docker-compose.test.yml exec postgres-test psql -U postgres

# Project name ensures consistent container/volume naming regardless of directory
name: agent-studio-test

services:
  # ==============================================================================
  # API GATEWAY (Traefik)
  # ==============================================================================
  # Single entry point for all web services with path-based routing
  # Dashboard available at http://localhost/gateway or http://localhost:8080

  traefik-gateway:
    image: traefik:v3.6.6  # Updated 2026-01-12: Security fix CVE-2025-66490
    # RESILIENCE: Auto-restart on failure for critical gateway infrastructure
    restart: unless-stopped
    #
    # DEPENDENCY DESIGN (Intentional):
    # Traefik has NO explicit depends_on. This is by design because:
    # 1. Traefik uses Docker provider for DYNAMIC service discovery via labels
    # 2. As the gateway, it should start first to accept connections
    # 3. Routes to unhealthy backends return 502/503 (temporary during startup)
    # 4. Backends are automatically added to routing when they become healthy
    # 5. Adding depends_on would delay ALL routes (including /authn needed by forward-auth)
    #
    command:
      # API and Dashboard
      - "--api.dashboard=true"
      - "--api.insecure=true"
      # Docker provider
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=agent-studio-test-network"
      # Entrypoints
      - "--entrypoints.web.address=:80"
      # Prometheus metrics (for Grafana dashboards)
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
      # Health check (required for traefik healthcheck --ping)
      - "--ping=true"
      # Logging (configurable via environment variables for QUIET_LOGS support)
      # TRAEFIK_LOG_LEVEL: DEBUG, INFO, WARN, ERROR (default: INFO)
      # TRAEFIK_ACCESS_LOG: true/false (default: true)
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--log.format=json"
      - "--accesslog=${TRAEFIK_ACCESS_LOG:-true}"
      - "--accesslog.format=json"
    ports:
      - "80:80"      # Main gateway (single entry point)
      - "8080:8080"  # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s  # Increased from 5s to reduce log noise (44% reduction in health checks)
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      agent-studio-test-network:
        aliases:
          - gateway
          # 'traefik-gateway' alias for Alloy Prometheus scrape target
          - traefik-gateway
          # 'localhost' alias enables traefik-forward-auth to resolve OIDC issuer URL
          # (http://localhost/authn/realms/default) to traefik-gateway instead of 127.0.0.1.
          # This is required because extra_hosts: localhost:host-gateway doesn't work reliably
          # (default 127.0.0.1 localhost entry in /etc/hosts takes precedence).
          - localhost
    labels:
      - "traefik.enable=true"
      # Define forward-auth middleware in gateway so it exists at startup
      # (traefik-forward-auth service may not be running yet when other services start)
      - "traefik.http.middlewares.forward-auth.forwardauth.address=http://traefik-forward-auth:4181"
      - "traefik.http.middlewares.forward-auth.forwardauth.trustForwardHeader=true"
      - "traefik.http.middlewares.forward-auth.forwardauth.authResponseHeaders=X-Forwarded-User,X-Auth-User,X-Auth-Email"
      # CSP Headers for Sandpack (codesandbox.io), Pyodide (cdn.jsdelivr.net), and Google Fonts
      # Required for SandpackExecutor, CanvasArtifact Python execution, and Inter/JetBrains Mono fonts
      - "traefik.http.middlewares.sandpack-csp.headers.customresponseheaders.Content-Security-Policy=default-src 'self'; frame-src 'self' https://*.codesandbox.io https://codesandbox.io; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.codesandbox.io https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.codesandbox.io wss://*.codesandbox.io https://cdn.jsdelivr.net; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com;"
      # Route: /gateway/* -> Traefik Dashboard [PROTECTED]
      # Traefik dashboard requires both /api and /dashboard paths internally.
      # We use replacepathregex to rewrite /gateway/api -> /api and /gateway/dashboard -> /dashboard
      # Authentication via forward-auth middleware (ADR-0054)
      - "traefik.http.routers.gateway.rule=PathPrefix(`/gateway`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.routers.gateway.service=api@internal"
      - "traefik.http.routers.gateway.priority=20"
      - "traefik.http.middlewares.gateway-rewrite.replacepathregex.regex=^/gateway/(.*)"
      - "traefik.http.middlewares.gateway-rewrite.replacepathregex.replacement=/$${1}"
      # Middleware chain: forward-auth first, then rewrite
      - "traefik.http.routers.gateway.middlewares=forward-auth@docker,gateway-rewrite"

  # ==============================================================================
  # DATABASE SERVICES
  # ==============================================================================

  postgres-test:
    # TimescaleDB 2.17 on PostgreSQL 16 for time-series metrics and cost tracking
    # Matches CloudSQL version (terraform/environments/gcp-preview/main.tf: postgres_major_version = 16)
    # TimescaleDB extension provides hypertables for efficient time-series storage
    image: timescale/timescaledb:2.17.2-pg16
    # Increase max_connections for pytest-xdist parallel workers (8 workers x ~10 connections each)
    # Default is 100, which causes TooManyConnectionsError during parallel test runs
    # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
    # PostgreSQL 15+ supports jsonlog destination for structured JSON output
    # Reference: https://www.postgresql.org/docs/16/runtime-config-logging.html
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c logging_collector=on
      -c log_destination=jsonlog
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql.json
      -c log_statement=none
      -c log_min_messages=warning
      -c log_min_error_statement=error
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openfga_test
      # Test-specific settings for speed
      POSTGRES_INITDB_ARGS: "-c fsync=off -c synchronous_commit=off -c full_page_writes=off"
      # TimescaleDB preload (required for extension to work)
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "9432:5432"  # Offset port to avoid conflicts with dev environment
    volumes:
      # Mount migration scripts for database initialization
      - ./migrations:/docker-entrypoint-initdb.d/01-migrations:ro
      # Mount test database initialization script
      - ./docker/postgres/init-test-databases.sh:/docker-entrypoint-initdb.d/00-init-databases.sh:ro
      # Persistent data volume
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s  # Increased from 5s to reduce log noise
      timeout: 3s
      retries: 20  # Increased from 10 to allow more time for migrations (200s max)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      agent-studio-test-network:
        aliases:
          - postgres

  # PostgreSQL Exporter for Prometheus metrics
  # Exposes pg_* metrics for the PostgreSQL dashboard
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    # RESILIENCE: Auto-restart on failure for observability infrastructure
    restart: unless-stopped
    # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
    # Reference: https://github.com/prometheus-community/postgres_exporter
    command:
      - "--log.format=json"
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      - DATA_SOURCE_NAME=postgresql://postgres:postgres@postgres-test:5432/postgres?sslmode=disable
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9187/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M
    networks:
      agent-studio-test-network:
        aliases:
          - postgres-exporter

  # ==============================================================================
  # DATABASE MIGRATIONS (Alembic)
  # ==============================================================================
  # Standardized on Alembic for all PostgreSQL schema migrations
  # This runs AFTER postgres-test is healthy and BEFORE agent-studio-test starts
  # Pattern matches openfga-migrate-test for consistency

  alembic-migrate-test:
    # IMAGE STRATEGY (2025-12-11):
    # - CI: Pulls from GHCR (ghcr.io/vishnu2kmohan/agent-studio-alembic:latest)
    #   Built by .github/workflows/build-alembic-image.yaml
    # - Local: Build with `docker compose build alembic-migrate-test`
    #   Tags the image as ghcr.io/vishnu2kmohan/agent-studio-alembic:latest for push
    image: ghcr.io/vishnu2kmohan/agent-studio-alembic:latest
    # LOCAL DEV: Always build locally (GHCR images not published for local dev)
    # CI: Uses pre-built images via separate workflow
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.alembic
      tags:
        - ghcr.io/vishnu2kmohan/agent-studio-alembic:latest
        - ghcr.io/vishnu2kmohan/agent-studio-alembic:local
    # Run Alembic upgrade to apply all migrations to agent_studio_test database
    command: alembic upgrade head
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      # Alembic uses these to construct DATABASE_URL
      - TESTING=true
      - POSTGRES_HOST=postgres-test
      - POSTGRES_PORT=5432
      - POSTGRES_DB=agent_studio_test
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      - LOG_FORMAT=json
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    networks:
      - agent-studio-test-network
    restart: "no"  # Run once and exit

  # ==============================================================================
  # AUTHORIZATION SERVICES
  # ==============================================================================

  openfga-migrate-test:
    image: openfga/openfga:v1.11.2
    command: migrate --datastore-engine=postgres --datastore-uri='postgres://postgres:postgres@postgres-test:5432/openfga_test?sslmode=disable'
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@postgres-test:5432/openfga_test?sslmode=disable
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      - OPENFGA_LOG_FORMAT=json
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    networks:
      - agent-studio-test-network
    restart: "no"  # Run once and exit

  # ==============================================================================
  # OpenFGA OIDC Wait Init Container
  # ==============================================================================
  # Waits for Keycloak OIDC discovery endpoint before OpenFGA starts.
  # This prevents the panic: "failed to initialize authenticator: error fetching OIDC configuration"
  # OpenFGA uses a distroless image without shell, so we need a separate init container.
  # Reference: Test Infrastructure Improvements Plan - OpenFGA OIDC Startup Race Condition
  openfga-oidc-wait:
    # Init container to wait for Keycloak OIDC endpoint before OpenFGA starts
    # Required because OpenFGA uses a distroless image with no shell for healthcheck
    # This Alpine container checks OIDC readiness via Traefik gateway (Docker network)
    image: alpine:3.19
    command:
      - /bin/sh
      - -c
      - |
        # Check via Traefik gateway using Docker network hostname
        # This verifies the full path (traefik-gateway -> keycloak-test) is ready
        # OpenFGA uses http://localhost/authn/... with extra_hosts, but for the wait
        # container we can use the Docker network directly which is more reliable
        OIDC_URL="http://traefik-gateway/authn/realms/default/.well-known/openid-configuration"
        echo "============================================================"
        echo "Waiting for Keycloak OIDC Discovery Endpoint (via Gateway)"
        echo "============================================================"
        echo "URL: $$OIDC_URL"
        echo ""
        MAX_RETRIES=60
        DELAY=2
        attempt=0
        while [ $$attempt -lt $$MAX_RETRIES ]; do
          attempt=$$((attempt + 1))
          response=$$(wget -q -O /dev/null -S "$$OIDC_URL" 2>&1 | grep "HTTP/" | tail -1 | awk '{print $$2}')
          if [ "$$response" = "200" ]; then
            echo "  [$$attempt/$$MAX_RETRIES] OIDC discovery endpoint is ready!"
            echo ""
            echo "OpenFGA can now start safely."
            exit 0
          fi
          echo "  [$$attempt/$$MAX_RETRIES] HTTP $$response, retrying in $${DELAY}s..."
          sleep $$DELAY
        done
        echo ""
        echo "ERROR: OIDC discovery endpoint did not become ready in time"
        exit 1
    depends_on:
      keycloak-test:
        condition: service_healthy
      traefik-gateway:
        condition: service_healthy
    networks:
      - agent-studio-test-network
    restart: "no"

  openfga-test:
    image: openfga/openfga:v1.11.2
    # RESILIENCE: Auto-restart on failure for critical authorization infrastructure
    restart: unless-stopped
    command: run --datastore-engine=postgres --datastore-uri='postgres://postgres:postgres@postgres-test:5432/openfga_test?sslmode=disable'
    depends_on:
      postgres-test:
        condition: service_healthy
      openfga-migrate-test:
        condition: service_completed_successfully
      openfga-oidc-wait:
        condition: service_completed_successfully
      keycloak-test:
        condition: service_healthy
      traefik-gateway:
        condition: service_healthy
    # Map localhost to traefik-gateway so OpenFGA can resolve JWKS URIs from Keycloak discovery
    # Keycloak returns jwks_uri: http://localhost/authn/... which OpenFGA needs to resolve
    extra_hosts:
      - "localhost:host-gateway"
    ports:
      - "9080:8080"  # HTTP API
      - "9081:8081"  # gRPC API
      # Playground port removed - Playground disabled when using OIDC authentication
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://postgres:postgres@postgres-test:5432/openfga_test?sslmode=disable
      - OPENFGA_LOG_FORMAT=json
      - OPENFGA_LOG_LEVEL=warn  # Reduced logging for tests
      - OPENFGA_PLAYGROUND_ENABLED=false  # Disabled - Playground doesn't support OIDC
      # ======================================================================
      # Authentication Strategy: OIDC (Defense-in-Depth Security)
      # ======================================================================
      # OpenFGA validates OIDC tokens from Keycloak
      # Services (authz-proxy, agent-studio) obtain OIDC tokens via client credentials grant
      # This provides defense-in-depth: even with network access, attackers need valid tokens
      # Reference: ADR-0070 - OpenFGA OIDC Authentication Migration
      # IMPORTANT: OpenFGA must use the same issuer URL that Keycloak advertises in tokens
      #   Keycloak issues tokens with iss: http://localhost/authn/realms/default
      #   OpenFGA must expect the same issuer for token validation to succeed
      #   The extra_hosts mapping allows OpenFGA to resolve localhost to host-gateway
      - OPENFGA_AUTHN_METHOD=oidc
      # With KC_HOSTNAME_URL=http://localhost/authn, all tokens have consistent issuer
      # regardless of how Keycloak is accessed (gateway, direct port, Docker network)
      - OPENFGA_AUTHN_OIDC_ISSUER=http://localhost/authn/realms/default
      # Aliases kept for backwards compatibility with tokens issued before KC_HOSTNAME_URL change
      # In steady state, all tokens should have the primary issuer
      - OPENFGA_AUTHN_OIDC_ISSUER_ALIASES=http://localhost:8080/authn/realms/default,http://keycloak-test:8080/authn/realms/default
      - OPENFGA_AUTHN_OIDC_AUDIENCE=agent-studio-openfga-oidc-cient-id-for-e2e-tests
      - TESTING=true
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 10s  # Increased from 5s to reduce log noise
      timeout: 3s
      retries: 20  # Increased to tolerate Keycloak OIDC endpoint delays
      start_period: 30s  # Allow time for OIDC discovery and token validation from Keycloak
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    networks:
      agent-studio-test-network:
        aliases:
          - openfga
    labels:
      - "traefik.enable=true"
      # Route: /authz/* -> openfga:8080 (Authorization API) [OIDC-PROTECTED]
      # API endpoints are at /stores, /health, etc. accessed via /authz/stores, /authz/health
      # Authentication: OIDC tokens from Keycloak (OpenFGA validates JWT signatures)
      # Services must obtain OIDC tokens via OAuth 2.0 client credentials grant
      # Defense-in-depth security: network isolation + OIDC token validation
      - "traefik.http.routers.openfga-api.rule=PathPrefix(`/authz`)"
      - "traefik.http.routers.openfga-api.entrypoints=web"
      - "traefik.http.routers.openfga-api.priority=10"
      - "traefik.http.services.openfga-api.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.openfga-strip.stripprefix.prefixes=/authz"
      - "traefik.http.routers.openfga-api.middlewares=openfga-strip"
      # NOTE: OpenFGA Playground DISABLED (incompatible with OIDC authentication)
      # authz-proxy validates JWT + checks OpenFGA admin permission before proxying to playground

  # ==============================================================================
  # OPENFGA SEEDING (Authorization Model + Relationship Tuples)
  # ==============================================================================
  # This service runs AFTER openfga-test is healthy to seed:
  # 1. Authorization model from config/openfga/model.json
  # 2. Relationship tuples for test users (admin, alice, bob)
  # 3. Permissions for vector_store and WebSocket resources
  #
  # Reference: ADR-0068 - Gateway-Level Authentication

  openfga-seed-test:
    image: ghcr.io/vishnu2kmohan/agent-studio-openfga-seed:latest
    # LOCAL DEV: Always build locally (GHCR images not published for local dev)
    # CI: Uses pre-built images via separate workflow
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.openfga-seed
      tags:
        - ghcr.io/vishnu2kmohan/agent-studio-openfga-seed:latest
        - ghcr.io/vishnu2kmohan/agent-studio-openfga-seed:local
    depends_on:
      keycloak-test:
        condition: service_healthy
      openfga-test:
        condition: service_healthy
      # NOTE: traefik-gateway dependency removed - seed script uses direct Keycloak connection
      # OpenFGA accepts tokens with keycloak-test issuer via OPENFGA_AUTHN_OIDC_ISSUER_ALIASES
      # NOTE: keycloak-init-test dependency NOT needed - the OpenFGA OIDC client is imported
      # with the realm by keycloak-test (--import-realm). keycloak-init-test only configures
      # SSO IdPs and token exchange, which the seed script doesn't need.
    environment:
      - OPENFGA_API_URL=http://openfga-test:8080
      # OIDC Authentication (ADR-0070 - OpenFGA OIDC Migration)
      # Seed script uses client credentials grant to obtain tokens from Keycloak
      # Direct connection to Keycloak - tokens have issuer http://keycloak-test:8080/authn/realms/default
      # OpenFGA accepts this via OPENFGA_AUTHN_OIDC_ISSUER_ALIASES configuration
      - OPENFGA_OIDC_CLIENT_ID=agent-studio-openfga-oidc-cient-id-for-e2e-tests
      - OPENFGA_OIDC_CLIENT_SECRET=agent-studio-openfga-oidc-client-secret-for-e2e-tests
      - KEYCLOAK_SERVER_URL=http://keycloak-test:8080/authn
      - KEYCLOAK_REALM=default
      # Deprecated: Preshared key authentication (kept for rollback compatibility)
      - OPENFGA_PRESHARED_KEY=${OPENFGA_PRESHARED_KEY:-test-openfga-preshared-key}
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      - LOG_FORMAT=json
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    volumes:
      # Mount the local seed script to use the latest version during development
      - ./scripts/docker/seed_openfga.py:/app/seed_openfga.py:ro
      # Mount config directory for model and tuples updates without rebuilding
      - ./config/openfga:/app/config/openfga:ro
    networks:
      - agent-studio-test-network
    restart: "no"  # Run once and exit

  # ==============================================================================
  # AUTHENTICATION SERVICES
  # ==============================================================================

  keycloak-test:
    # RESILIENCE: Auto-restart on failure for critical authentication infrastructure
    restart: unless-stopped
    # Use pre-optimized Keycloak image (no JIT compilation at startup)
    # This matches production behavior and speeds up container startup
    #
    # IMAGE STRATEGY (2025-12-11):
    # - CI: Pulls from GHCR (ghcr.io/vishnu2kmohan/agent-studio-keycloak:latest)
    #   Built by .github/workflows/build-keycloak-image.yaml
    # - Local: Build with `docker compose build keycloak-test`
    #   Tags the image as ghcr.io/vishnu2kmohan/agent-studio-keycloak:latest for push
    #
    # The GHCR image is pushed with tags: latest, 26.4.2, 26.4.2-<sha>
    image: ghcr.io/vishnu2kmohan/agent-studio-keycloak:latest
    # LOCAL DEV: Always build locally (GHCR images not published for local dev)
    # CI: Uses pre-built images via separate workflow
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.keycloak
      tags:
        - ghcr.io/vishnu2kmohan/agent-studio-keycloak:latest
        - ghcr.io/vishnu2kmohan/agent-studio-keycloak:local
    # --optimized skips Quarkus augmentation (done at build time)
    # --import-realm imports the test realm on first start
    # --http-enabled=true must be explicit for production mode (Keycloak 26+)
    command: start --optimized --import-realm --http-enabled=true
    depends_on:
      postgres-test:
        condition: service_healthy
    ports:
      - "9082:8080"    # HTTP API
      - "9900:9000"    # Management/health port
    volumes:
      # Import test realm with pre-configured client and users
      # This eliminates the need for manual setup and prevents E2E test auth failures
      # NOTE: Filename must match realm name for Keycloak 26.x --import-realm
      - ./tests/e2e/default-realm.json:/opt/keycloak/data/import/default-realm.json:ro
      # Agent Studio theme (design system colors and branding)
      # Theme is also baked into the Docker image (docker/Dockerfile.keycloak)
      # This volume mount allows local theme development without rebuilding
      - ./docker/keycloak/themes/agent-studio:/opt/keycloak/themes/agent-studio:ro
    environment:
      # Admin credentials (Keycloak 26+ uses KC_BOOTSTRAP_ADMIN_* instead of KEYCLOAK_ADMIN_*)
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin123

      # Database configuration - uses dedicated keycloak_test database for isolation
      # Note: KC_DB=postgres is baked into the optimized image (docker/Dockerfile.keycloak)
      - KC_DB_URL=jdbc:postgresql://postgres-test:5432/keycloak_test
      - KC_DB_USERNAME=postgres
      - KC_DB_PASSWORD=postgres

      # Runtime settings (not baked into build)
      # HOSTNAME CONFIGURATION: Keycloak 26+ with path-based routing
      # See: https://www.keycloak.org/server/hostname
      #
      # KC_HOSTNAME_URL sets the full base URL including path for issuer claims.
      # This ensures tokens have issuer: http://localhost/authn/realms/default
      # matching what OpenFGA, traefik-forward-auth, and other services expect.
      #
      # Note: KC_HOSTNAME_URL is a v1 option that produces a deprecation warning,
      # but it's required when using path-based routing (KC_HTTP_RELATIVE_PATH=/authn)
      # because hostname v2's KC_HOSTNAME doesn't support paths.
      #
      # KC_PROXY_HEADERS=xforwarded: Required for Keycloak behind reverse proxy (Traefik)
      # Reference: https://www.keycloak.org/server/reverseproxy
      - KC_HOSTNAME_URL=http://localhost/authn
      - KC_HOSTNAME_STRICT=false
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=false

      # Note: KC_HTTP_RELATIVE_PATH=/authn is baked into the optimized image (build-time option)

      # Health and management settings
      # Note: KC_HEALTH_ENABLED=true and KC_METRICS_ENABLED=true are baked into the optimized image
      - KC_MANAGEMENT_ENABLED=true      # Enable management port (9000)
      - KC_LOG_LEVEL=warn               # Reduced logging
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      # Reference: https://www.keycloak.org/server/logging
      - KC_LOG_CONSOLE_OUTPUT=json

      # Test-specific
      - TESTING=true

      # GitHub OAuth App credentials (for SSO IdP testing)
      # Create a GitHub OAuth App at: https://github.com/settings/developers
      # Set callback URL to: http://localhost/authn/realms/default/broker/github/endpoint
      # Pass via environment variables or .env.test.local:
      #   GITHUB_CLIENT_ID=your-github-client-id
      #   GITHUB_CLIENT_SECRET=your-github-client-secret
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}

      # JVM memory settings to prevent OOM (exit code 137)
      # Keycloak 26.x with Quarkus requires significant native memory beyond heap
      # Container limit: 1792M, JVM heap: 768M, Metaspace: 256M, Native: ~768M headroom
      # -XX:+UseG1GC: Lower memory footprint than default
      # -XX:+ExitOnOutOfMemoryError: Fast-fail on OOM instead of hanging
      - JAVA_OPTS_APPEND=-Xms384m -Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    healthcheck:
      # ===========================================================================
      # OIDC-Ready Healthcheck: Two-Phase Validation
      # ===========================================================================
      # Reference: https://www.keycloak.org/observability/health
      #            https://www.keycloak.org/server/containers
      #
      # Phase 1: /health/ready on management port 9000 (JVM + DB ready)
      # Phase 2: OIDC discovery endpoint on HTTP port 8080 (OIDC fully functional)
      #
      # This ensures dependent services (OpenFGA, traefik-forward-auth) get valid
      # OIDC configuration. Without Phase 2, services may start before Keycloak's
      # realm endpoints are available, causing OIDC discovery failures.
      #
      # Bash TCP Socket Pattern (curl/wget not available in Keycloak 26+):
      #   { printf 'request' >&0; grep 'pattern'; } 0<>/dev/tcp/host/port
      #
      # This opens bidirectional socket, sends HTTP request, reads response,
      # and validates it contains expected pattern.
      # ===========================================================================
      test:
        - CMD-SHELL
        - |
          # Phase 1: Check /authn/health/ready on management port 9000
          # NOTE: KC_HTTP_RELATIVE_PATH=/authn applies to ALL endpoints including health
          { printf 'HEAD /authn/health/ready HTTP/1.0\r\nHost: localhost\r\n\r\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000 || exit 1
          # Phase 2: Check OIDC discovery endpoint on HTTP port 8080
          # This validates that the default realm is available and OIDC is functional
          { printf 'GET /authn/realms/default/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&0; grep -q '"issuer"'; } 0<>/dev/tcp/localhost/8080 || exit 1
      interval: 10s  # Codex Fix: interval must be >= timeout
      timeout: 10s  # Increased to allow time for both checks
      retries: 15  # Reduced since interval increased (150s max)
      start_period: 60s  # Per ADR-0053: Keycloak requires at least 60s to initialize
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1792M  # Increased from 1280M to prevent OOM (exit 137)
        reservations:
          cpus: '0.25'
          memory: 768M   # Increased to match JVM -Xmx768m
    networks:
      agent-studio-test-network:
        aliases:
          - keycloak
    labels:
      - "traefik.enable=true"
      # Route: /authn/* -> keycloak:8080 (Authentication)
      # Keycloak handles subpath via KC_HTTP_RELATIVE_PATH
      - "traefik.http.routers.keycloak.rule=PathPrefix(`/authn`)"
      - "traefik.http.routers.keycloak.entrypoints=web"
      - "traefik.http.routers.keycloak.priority=10"
      - "traefik.http.services.keycloak.loadbalancer.server.port=8080"
      # NO strip - Keycloak configured for /authn subpath

  # ==============================================================================
  # KEYCLOAK ADMIN INITIALIZATION
  # ==============================================================================
  # This service runs once after Keycloak is healthy to fix the admin user's
  # required actions. The KEYCLOAK_ADMIN env var creates an admin user with
  # UPDATE_PASSWORD required action, which prevents password grant for Admin API.
  # This service uses kcadm.sh to clear the required actions.

  keycloak-init-test:
    # Reuse keycloak-test image (avoid duplicate builds) to have access to kcadm.sh
    # NOTE: Uses same GHCR image as keycloak-test for consistency
    # NO build: section here - reuses image already built by keycloak-test service
    # This avoids BuildKit "already exists" error when both services try to export
    # to the same image tag during `docker compose up --build`
    image: ghcr.io/vishnu2kmohan/agent-studio-keycloak:latest
    # Never pull - this service reuses the image built by keycloak-test
    pull_policy: never
    # Override entrypoint and command to run the init script
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for Keycloak to be fully ready..."
        # Wait for Keycloak HTTP endpoint to be available
        for i in {1..60}; do
          if /opt/keycloak/bin/kcadm.sh config credentials \
            --server http://keycloak-test:8080/authn \
            --realm master \
            --user admin \
            --password admin123 2>/dev/null; then
            echo "Keycloak Admin CLI connected successfully"
            break
          fi
          echo "Waiting for Keycloak... attempt $$i/60"
          sleep 2
        done

        # Get admin user ID
        ADMIN_ID=$(/opt/keycloak/bin/kcadm.sh get users -r master -q username=admin --fields id 2>/dev/null | grep -o '"id" : "[^"]*"' | head -1 | cut -d'"' -f4)

        if [ -n "$$ADMIN_ID" ]; then
          echo "Found admin user ID: $$ADMIN_ID"
          # Clear required actions for admin user
          /opt/keycloak/bin/kcadm.sh update users/$$ADMIN_ID -r master -s 'requiredActions=[]' 2>/dev/null
          echo "Cleared required actions for admin user"
        else
          echo "Could not find admin user - may already be configured correctly"
        fi

        # Configure SSO Identity Providers with actual credentials (if provided)
        # The realm JSON imports with placeholder values that are replaced at runtime.
        # If no real credentials are provided, the IdP is DISABLED to prevent login errors.

        # Helper function to check if a value is a placeholder
        is_placeholder() {
          case "$$1" in
            placeholder-*|PLACEHOLDER-*|""|unset) return 0 ;;  # true = is placeholder
            *) return 1 ;;  # false = has real value
          esac
        }

        # GitHub IdP
        if [ -n "$$GITHUB_CLIENT_ID" ] && [ -n "$$GITHUB_CLIENT_SECRET" ] && \
           ! is_placeholder "$$GITHUB_CLIENT_ID" && ! is_placeholder "$$GITHUB_CLIENT_SECRET"; then
          echo "Configuring GitHub IdP with actual credentials..."
          /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r default \
            -s "config.clientId=$$GITHUB_CLIENT_ID" \
            -s "config.clientSecret=$$GITHUB_CLIENT_SECRET" \
            -s "enabled=true" 2>/dev/null
          if [ $$? -eq 0 ]; then
            echo "✓ GitHub IdP configured and enabled"
          else
            echo "Warning: Failed to update GitHub IdP - it may not exist in the realm"
          fi
        else
          echo "GitHub IdP has placeholder values or missing credentials - disabling..."
          /opt/keycloak/bin/kcadm.sh update identity-provider/instances/github -r default \
            -s "enabled=false" 2>/dev/null && echo "✓ GitHub IdP disabled" || echo "Warning: Could not disable GitHub IdP"
        fi

        # Google IdP
        if [ -n "$$GOOGLE_CLIENT_ID" ] && [ -n "$$GOOGLE_CLIENT_SECRET" ] && \
           ! is_placeholder "$$GOOGLE_CLIENT_ID" && ! is_placeholder "$$GOOGLE_CLIENT_SECRET"; then
          echo "Configuring Google IdP with actual credentials..."
          /opt/keycloak/bin/kcadm.sh update identity-provider/instances/google -r default \
            -s "config.clientId=$$GOOGLE_CLIENT_ID" \
            -s "config.clientSecret=$$GOOGLE_CLIENT_SECRET" \
            -s "enabled=true" 2>/dev/null
          if [ $$? -eq 0 ]; then
            echo "✓ Google IdP configured and enabled"
          else
            echo "Warning: Failed to update Google IdP - it may not exist in the realm"
          fi
        else
          echo "Google IdP has placeholder values or missing credentials - disabling..."
          /opt/keycloak/bin/kcadm.sh update identity-provider/instances/google -r default \
            -s "enabled=false" 2>/dev/null && echo "✓ Google IdP disabled" || echo "Warning: Could not disable Google IdP"
        fi

        # Microsoft IdP
        if [ -n "$$MICROSOFT_CLIENT_ID" ] && [ -n "$$MICROSOFT_CLIENT_SECRET" ] && \
           ! is_placeholder "$$MICROSOFT_CLIENT_ID" && ! is_placeholder "$$MICROSOFT_CLIENT_SECRET"; then
          echo "Configuring Microsoft IdP with actual credentials..."
          /opt/keycloak/bin/kcadm.sh update identity-provider/instances/microsoft -r default \
            -s "config.clientId=$$MICROSOFT_CLIENT_ID" \
            -s "config.clientSecret=$$MICROSOFT_CLIENT_SECRET" \
            -s "enabled=true" 2>/dev/null
          if [ $$? -eq 0 ]; then
            echo "✓ Microsoft IdP configured and enabled"
          else
            echo "Warning: Failed to update Microsoft IdP - it may not exist in the realm"
          fi
        else
          echo "Microsoft IdP has placeholder values or missing credentials - disabling..."
          /opt/keycloak/bin/kcadm.sh update identity-provider/instances/microsoft -r default \
            -s "enabled=false" 2>/dev/null && echo "✓ Microsoft IdP disabled" || echo "Warning: Could not disable Microsoft IdP"
        fi

        # Configure Token Exchange (RFC 8693) for agent-studio client
        # This enables user impersonation without ROPC (password grant)
        # Reference: ADR-0086 - Security Audit Keycloak/OpenFGA
        echo "Configuring Token Exchange permissions..."

        # Get agent-studio client ID
        AGENT_STUDIO_CLIENT_ID=$(/opt/keycloak/bin/kcadm.sh get clients -r default -q clientId=agent-studio-keycloak-client-id-for-e2e-tests --fields id 2>/dev/null | grep -o '"id" : "[^"]*"' | head -1 | cut -d'"' -f4)

        if [ -n "$$AGENT_STUDIO_CLIENT_ID" ]; then
          echo "Found agent-studio client ID: $$AGENT_STUDIO_CLIENT_ID"

          # Enable token exchange permission on the client
          # The authorizationServicesEnabled=true is already set in the realm JSON
          # Now we need to create the token-exchange permission

          # Create token-exchange scope in the authorization settings
          /opt/keycloak/bin/kcadm.sh create clients/$$AGENT_STUDIO_CLIENT_ID/authz/resource-server/scope \
            -r default \
            -s 'name=token-exchange' \
            -s 'displayName=Token Exchange' 2>/dev/null && echo "✓ Created token-exchange scope" || echo "Token-exchange scope may already exist"

          # Get the service account user for agent-studio
          SERVICE_ACCOUNT_ID=$(/opt/keycloak/bin/kcadm.sh get users -r default -q username=service-account-agent-studio-keycloak-client-id-for-e2e-tests --fields id 2>/dev/null | grep -o '"id" : "[^"]*"' | head -1 | cut -d'"' -f4)

          if [ -n "$$SERVICE_ACCOUNT_ID" ]; then
            echo "Found service account ID: $$SERVICE_ACCOUNT_ID"

            # Grant impersonation role to the service account
            # This allows the client to impersonate other users
            /opt/keycloak/bin/kcadm.sh add-roles -r default \
              --uusername service-account-agent-studio-keycloak-client-id-for-e2e-tests \
              --rolename admin 2>/dev/null && echo "✓ Granted admin role for impersonation" || echo "Admin role may already be assigned"
          else
            echo "Service account not found - will be created on first token request"
          fi

          echo "✓ Token Exchange configured for agent-studio"
        else
          echo "Warning: Could not find agent-studio client - Token Exchange not configured"
        fi

        echo "Keycloak initialization complete"
    env_file:
      - .env.test
      # SSO OAuth credentials (GITHUB_CLIENT_ID, GOOGLE_CLIENT_ID, MICROSOFT_CLIENT_ID, etc.)
      # are loaded from .env.local. DO NOT duplicate in environment: block as compose-level
      # resolution happens before env_file, causing empty fallbacks to override real values.
      - path: .env.local
        required: false
    depends_on:
      keycloak-test:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      - agent-studio-test-network
    restart: "no"  # Run once and exit

  # ==============================================================================
  # GATEWAY AUTHENTICATION (traefik-forward-auth)
  # ==============================================================================
  # Centralized authentication proxy for Traefik ForwardAuth middleware
  # Handles OIDC flow with Keycloak for all protected routes
  # Reference: ADR-0054 - Gateway-Level Authentication

  traefik-forward-auth:
    image: thomseddon/traefik-forward-auth:2
    # RESILIENCE: Auto-restart on failure for critical auth infrastructure
    # The forward-auth service is stateless and can safely restart
    restart: unless-stopped
    depends_on:
      keycloak-test:
        condition: service_healthy
      traefik-gateway:
        condition: service_healthy
    # CI FIX: Ensure 'localhost' resolves to traefik-gateway (172.x.x.x) not ::1 (IPv6 loopback).
    # The traefik-gateway has 'localhost' as a network alias, but Docker's default /etc/hosts
    # entry (127.0.0.1 localhost) can take precedence. This extra_hosts entry ensures localhost
    # resolves to the gateway container via Docker DNS within the agent-studio-test-network.
    # Note: We use 'host-gateway' special hostname which Docker resolves to the host IP, but
    # since we're on the same Docker network, the network alias approach via depends_on is sufficient.
    # The real fix is the restart policy which will retry on connection refused.
    environment:
      # OIDC Provider Configuration (Keycloak)
      # Forward-auth fetches OIDC config from http://localhost/authn/... which is routed
      # through the Traefik gateway to Keycloak. This ensures the OIDC issuer and
      # authorization_endpoint URLs use localhost (browser-accessible) instead of
      # internal Docker hostnames like keycloak-test.
      - DEFAULT_PROVIDER=oidc
      - PROVIDERS_OIDC_ISSUER_URL=http://localhost/authn/realms/default
      - PROVIDERS_OIDC_CLIENT_ID=agent-studio-keycloak-client-id-for-e2e-tests
      - PROVIDERS_OIDC_CLIENT_SECRET=test-client-secret-for-e2e-tests
      # Cookie and Session Configuration
      - SECRET=test-forward-auth-secret-change-in-production
      - COOKIE_DOMAIN=localhost
      - INSECURE_COOKIE=true  # Required for HTTP (no TLS in test)
      - AUTH_HOST=localhost
      - URL_PATH=/_oauth
      # Session lifetime in seconds (default 43200 = 12 hours)
      - LIFETIME=3600
      # Logout Configuration
      # /_oauth/logout redirects to Keycloak logout for complete SSO logout
      # post_logout_redirect_uri=http://localhost allows users to return to /studio after re-login
      - LOGOUT_REDIRECT=http://localhost/authn/realms/default/protocol/openid-connect/logout?post_logout_redirect_uri=http%3A%2F%2Flocalhost&client_id=agent-studio-keycloak-client-id-for-e2e-tests
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      # Test mode
      - TESTING=true
    healthcheck:
      # traefik-forward-auth is a scratch container with no shell utilities
      # Traefik handles availability detection via Docker provider
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      agent-studio-test-network:
        aliases:
          - forward-auth
    labels:
      - "traefik.enable=true"
      # NOTE: forward-auth middleware is defined in traefik-gateway labels (startup ordering fix)
      # This service only needs to expose the /_oauth route for OAuth callbacks
      # OAuth callback route (handles redirect from Keycloak)
      # IMPORTANT: The /_oauth route MUST use the forward-auth middleware, NOT direct service routing.
      # traefik-forward-auth intercepts /_oauth via X-Forwarded-Uri header in middleware mode.
      # Without this, the OAuth callback fails because forward-auth doesn't see the code/state params.
      - "traefik.http.routers.forward-auth.rule=PathPrefix(`/_oauth`)"
      - "traefik.http.routers.forward-auth.entrypoints=web"
      - "traefik.http.routers.forward-auth.priority=100"
      - "traefik.http.routers.forward-auth.middlewares=forward-auth@docker"
      - "traefik.http.services.forward-auth.loadbalancer.server.port=4181"

  # ==============================================================================
  # CACHE & SESSION STORAGE
  # ==============================================================================

  redis-test:
    # Redis 7.2 to match Memorystore (terraform/environments/gcp-preview/main.tf: redis_version = "REDIS_7_2")
    image: redis:7.2-alpine
    # RESILIENCE: Auto-restart on failure for session/cache infrastructure
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "9379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s  # Increased from 5s to reduce log noise
      timeout: 2s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 192M
        reservations:
          cpus: '0.05'
          memory: 64M
    networks:
      agent-studio-test-network:
        aliases:
          - redis

  # Redis Exporter for Prometheus metrics
  # Exposes redis_* metrics for the Redis Sessions dashboard
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    # RESILIENCE: Auto-restart on failure for observability infrastructure
    restart: unless-stopped
    # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
    # Reference: https://github.com/oliver006/redis_exporter
    command:
      - "--log-format=json"
    depends_on:
      redis-test:
        condition: service_healthy
    environment:
      - REDIS_ADDR=redis://redis-test:6379
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9121/metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M
    networks:
      agent-studio-test-network:
        aliases:
          - redis-exporter

  # ==============================================================================
  # VECTOR DATABASE (for Anthropic Best Practices: Just-in-Time Context)
  # ==============================================================================

  qdrant-test:
    # Use unprivileged image for non-root execution (Kubernetes-compatible)
    image: qdrant/qdrant:v1.15.5-unprivileged
    # RESILIENCE: Auto-restart on failure for vector database infrastructure
    restart: unless-stopped
    # Qdrant unprivileged runs as UID 1000
    user: "1000"
    ports:
      - "9333:6333"  # HTTP API
      - "9334:6334"  # gRPC API
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT_ALLOW_RECOVERY_MODE=true
      - QDRANT__LOG_LEVEL=WARN  # Reduced logging
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      # Reference: https://qdrant.tech/documentation/guides/configuration/
      - QDRANT__LOGGER__FORMAT=json
      - TESTING=true
    healthcheck:
      # HTTP healthcheck using bash TCP socket pattern (no wget/curl in Qdrant image)
      # Uses /readyz endpoint to verify service is ready to accept requests
      # Bash TCP pattern: { printf 'request' >&0; grep 'pattern'; } 0<>/dev/tcp/host/port
      # NOTE: Must explicitly use bash (not sh) for /dev/tcp to work
      # Reference: https://qdrant.tech/documentation/concepts/administration/#health-check
      test:
        - CMD-SHELL
        - |
          bash -c '{ printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&0; grep -q "HTTP/1.. 200"; } 0<>/dev/tcp/localhost/6333'
      interval: 10s  # Increased from 5s to reduce log noise
      timeout: 3s
      retries: 15  # Increased from 10 to allow more startup time (150s max)
      start_period: 10s  # Increased from 5s for slower CI runners
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
    networks:
      agent-studio-test-network:
        aliases:
          - qdrant
    labels:
      - "traefik.enable=true"
      # Route: /vectors/* -> qdrant:6333 (Vector Database API)
      # Authentication: Internal API for programmatic access (no forward-auth)
      # TODO: Consider adding Qdrant API key authentication for production
      - "traefik.http.routers.qdrant.rule=PathPrefix(`/vectors`)"
      - "traefik.http.routers.qdrant.entrypoints=web"
      - "traefik.http.routers.qdrant.priority=10"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"
      - "traefik.http.middlewares.qdrant-strip.stripprefix.prefixes=/vectors"
      # NO forward-auth - Internal API accessed by agent-studio
      - "traefik.http.routers.qdrant.middlewares=qdrant-strip"
      # Route: /dashboard/* -> qdrant:6333/dashboard/* (Qdrant Web UI)
      # Qdrant dashboard uses hardcoded absolute paths (/dashboard/*) for assets.
      # Access via http://localhost/dashboard or http://localhost/vectors/dashboard
      # Note: /dashboard (no 's') won't conflict with Grafana's /dashboards (priority 11)
      - "traefik.http.routers.qdrant-dashboard.rule=PathPrefix(`/dashboard`)"
      - "traefik.http.routers.qdrant-dashboard.entrypoints=web"
      - "traefik.http.routers.qdrant-dashboard.priority=10"
      - "traefik.http.routers.qdrant-dashboard.service=qdrant"
      # Authentication via forward-auth middleware (ADR-0054)
      - "traefik.http.routers.qdrant-dashboard.middlewares=forward-auth@docker"

  # ==============================================================================
  # QDRANT INIT (Bootstrap default collections for E2E tests)
  # ==============================================================================

  qdrant-init-test:
    # Use curlimages/curl for lightweight HTTP calls to Qdrant API
    image: curlimages/curl:8.11.0
    restart: "no"
    depends_on:
      qdrant-test:
        condition: service_healthy
    # Create default collection(s) for E2E testing
    # - agent_studio_context: Default collection matching config.qdrant_collection_name
    # - Vector size 768 matches Vertex AI text-embedding-005 model
    command:
      - /bin/sh
      - -c
      - |
        echo "Bootstrapping Qdrant collections..."

        # Wait for Qdrant to be fully ready (healthcheck may pass before API is ready)
        for i in 1 2 3 4 5; do
          if curl -sf http://qdrant:6333/collections > /dev/null 2>&1; then
            echo "Qdrant API is ready"
            break
          fi
          echo "Waiting for Qdrant API... attempt $$i/5"
          sleep 2
        done

        # Create agent_studio_context collection if it doesn't exist
        # Vector size: 768 (Vertex AI text-embedding-005)
        # Distance: Cosine (default for semantic similarity)
        COLLECTION_EXISTS=$$(curl -sf http://qdrant:6333/collections/agent_studio_context 2>/dev/null | grep -c '"status":"ok"' || true)

        if [ "$$COLLECTION_EXISTS" = "0" ]; then
          echo "Creating agent_studio_context collection (768 dimensions, Cosine)..."
          curl -X PUT http://qdrant:6333/collections/agent_studio_context \
            -H "Content-Type: application/json" \
            -d '{
              "vectors": {
                "size": 768,
                "distance": "Cosine"
              }
            }'
          echo ""
          echo "✓ agent_studio_context collection created"
        else
          echo "✓ agent_studio_context collection already exists"
        fi

        # Verify collection is accessible
        echo "Verifying collections..."
        curl -sf http://qdrant:6333/collections | head -c 500
        echo ""
        echo "Qdrant bootstrap complete"
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.01'
          memory: 32M
    networks:
      - agent-studio-test-network

  # ==============================================================================
  # MCP SERVER (for E2E tests)
  # ==============================================================================

  agent-studio-test:
    # RESILIENCE: Auto-restart on failure for MCP server application
    restart: unless-stopped
    # CODEX FINDING FIX (2025-11-21): MCP Server for E2E Tests
    # =========================================================
    # Enables end-to-end testing of MCP protocol and full user journeys
    # Addresses Bucket 4: E2E MCP journeys missing service dependencies
    #
    # IMAGE STRATEGY (2025-12-13):
    # - CI: Pulls from GHCR (ghcr.io/vishnu2kmohan/agent-studio:test-latest)
    #   Built by .github/workflows/ci.yaml docker-build job (test variant)
    # - Local: Build with `docker compose build agent-studio-test`
    #   Uses same Dockerfile + target as CI for local/CI parity
    #   Tags the image as ghcr.io/vishnu2kmohan/agent-studio:test-latest for push
    image: ghcr.io/vishnu2kmohan/agent-studio:test-latest
    # LOCAL DEV: Always build locally (GHCR images not published for local dev)
    # CI: Uses pre-built images via separate workflow
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final-test
      tags:
        - ghcr.io/vishnu2kmohan/agent-studio:test-latest
        - ghcr.io/vishnu2kmohan/agent-studio:test-local
    command: >
      sh -c "
      echo 'Waiting for dependencies to be ready...' &&
      sleep 5 &&
      echo 'Starting MCP server with JSON access logs...' &&
      uvicorn mcp_server_langgraph.mcp.server_streamable:app --host 0.0.0.0 --port 8000 --log-config /app/uvicorn-log-config.yaml
      "
    depends_on:
      postgres-test:
        condition: service_healthy
      alembic-migrate-test:
        condition: service_completed_successfully
      keycloak-test:
        condition: service_healthy
      openfga-seed-test:
        condition: service_completed_successfully  # Wait for tuples to be seeded
      redis-test:
        condition: service_healthy
      qdrant-test:
        condition: service_healthy
      # VECTORS: Ensure default collection exists before API serves requests
      qdrant-init-test:
        condition: service_completed_successfully
      # OBSERVABILITY: Ensure OTLP endpoint is ready for telemetry from first request
      alloy-test:
        condition: service_healthy
    ports:
      - "8000:8000"  # HTTP API
    # 12-Factor: Config from .env.test file (checked into git)
    # Override locally with .env.test.local (gitignored) or shell environment
    env_file:
      - .env.test
      - .env.local
    environment:
      # Docker networking values (must reference container names)
      # These override values from .env.test because they require compose-level resolution
      # Note: Values below take precedence over .env.test per Docker Compose rules
      #
      # TESTING=true: Skip startup validation (matches Dockerfile.test behavior)
      # This prevents startup validation from blocking the server while dependencies
      # are being checked. Docker Compose health checks already ensure dependencies.
      - TESTING=true
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      # Default is already JSON but made explicit for documentation
      - LOG_FORMAT=json
      # -----------------------------------------------------------------------
      # PostgreSQL Databases (all on postgres-test:5432)
      # -----------------------------------------------------------------------
      # DB Allocation:
      #   - agent_studio_test: Main Agent Studio data (sessions, workflows, audit logs)
      #   - compliance_test: Multi-framework compliance (GDPR, HIPAA, SOC2, FedRAMP)
      #   - openfga_test:   OpenFGA authorization (tuples, permissions) - used by openfga-test
      #   - keycloak_test:  Keycloak identity (users, realms, clients) - used by keycloak-test
      - POSTGRES_HOST=postgres-test
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-test:5432/agent_studio_test
      # Compliance database for GDPR/HIPAA/SOC2/FedRAMP data (user profiles, consents, audit)
      - COMPLIANCE_POSTGRES_URL=postgresql://postgres:postgres@postgres-test:5432/compliance_test
      # -----------------------------------------------------------------------
      # Keycloak Authentication (Docker network internal URLs)
      # -----------------------------------------------------------------------
      # Keycloak URL for backend-to-Keycloak communication (Docker network)
      # Backend uses this for token exchange, introspection, admin API calls
      # Must be reachable from inside Docker container
      - KEYCLOAK_SERVER_URL=http://keycloak-test:8080/authn
      # Public URL for browser redirects in OAuth2/PKCE flow (externally accessible)
      # Frontend URL for OAuth2 callback redirects (must be gateway URL, not internal port)
      # This fixes the callback redirect issue where users were redirected to localhost:5173
      # which is inaccessible from the browser (internal Vite port).
      - OPENFGA_API_URL=http://openfga-test:8080
      # Dynamic lookup: Use store name instead of hardcoded IDs
      # The OpenFGA client will look up store_id by name and fetch the latest model_id
      # This ensures CI/CD works without stale hardcoded values
      # OIDC issuer URL for OpenFGA token acquisition (via gateway for correct issuer in tokens)
      # The gateway routes to Keycloak and Keycloak returns tokens with iss: http://localhost/authn/realms/default
      # which matches OpenFGA's OPENFGA_AUTHN_OIDC_ISSUER setting
      # -----------------------------------------------------------------------
      # Redis Databases (all on redis-test:6379)
      # -----------------------------------------------------------------------
      # DB Allocation:
      #   - DB 0: User sessions (AuthMiddleware, 24h TTL)
      #   - DB 1: LangGraph conversation checkpoints (7-day TTL)
      #   - DB 2: L2 distributed cache (CacheService)
      #   - DB 3: API key lookup cache (indexed, 1h TTL)
      # Session storage for authenticated users (db 0)
      - REDIS_SESSION_URL=redis://redis-test:6379/0
      # LangGraph agent conversation state checkpoints (db 1)
      - CHECKPOINT_REDIS_URL=redis://redis-test:6379/1
      # Redis host/port for rate limiting and distributed cache
      - REDIS_HOST=redis-test
      - REDIS_PORT=6379
      # -----------------------------------------------------------------------
      # Vector Database (Qdrant)
      # -----------------------------------------------------------------------
      - QDRANT_URL=http://qdrant-test:6333
      # -----------------------------------------------------------------------
      # OpenTelemetry (Alloy OTLP endpoint)
      # -----------------------------------------------------------------------
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy-test:4318
      - OTEL_SERVICE_NAME=agent-studio-test
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=agent-studio,deployment.environment=test
      # -----------------------------------------------------------------------
      # LGTM Stack URLs (container names for Docker networking)
      # -----------------------------------------------------------------------
      - TEMPO_URL=http://tempo-test:3200
      - LOKI_URL=http://loki-test:3100
      - MIMIR_URL=http://mimir-test:9009
      - GRAFANA_URL=http://grafana-test:3000
      # -----------------------------------------------------------------------
      # GCP Credentials (mounted from host for local development)
      # -----------------------------------------------------------------------
      - GOOGLE_APPLICATION_CREDENTIALS=/app/.config/gcloud/application_default_credentials.json
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_PROJECT_ID=${GOOGLE_CLOUD_PROJECT:-}
      # -----------------------------------------------------------------------
      # Feature Flags: Loaded from .env.test
      # -----------------------------------------------------------------------
      # All feature flags (FF_*) are defined in .env.test for single source of truth.
      # They are automatically loaded via env_file directive above.
      # Only container-specific overrides (hostnames, URLs) are defined here.
    # Map localhost to traefik-gateway so MCP server can resolve OIDC issuer URLs from Keycloak
    # OPENFGA_OIDC_ISSUER=http://localhost/authn/realms/default requires localhost to resolve to gateway
    # Same pattern as openfga-test (line 333-334) for consistent OIDC token acquisition
    extra_hosts:
      - "localhost:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Mount GCP ADC credentials for Vertex AI (local development only)
      - ~/.config/gcloud/application_default_credentials.json:/app/.config/gcloud/application_default_credentials.json:ro
      # Uvicorn JSON logging configuration for LGTM stack integration
      - ./docker/uvicorn-log-config.yaml:/app/uvicorn-log-config.yaml:ro
    healthcheck:
      # Use /health/live to avoid 307 redirect (/health -> /health/ due to sub-app mount)
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s  # Reduced from 5s to minimize log noise
      timeout: 5s
      retries: 30  # Increased to tolerate Keycloak OIDC endpoint delays (150s max)
      start_period: 45s  # Allow time for OIDC token acquisition and dependency connections
    init: true  # Proper process cleanup for Python app
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M
    networks:
      agent-studio-test-network:
        aliases:
          - agent-studio
    labels:
      - "traefik.enable=true"
      # Route: /agent-studio/* -> agent-studio:8000 (Agent Studio API)
      # Authentication: MCP tools validate JWT tokens via auth.verify_token() (no forward-auth)
      - "traefik.http.routers.agent-studio-api.rule=PathPrefix(`/agent-studio`)"
      - "traefik.http.routers.agent-studio-api.entrypoints=web"
      - "traefik.http.routers.agent-studio-api.priority=10"
      - "traefik.http.services.agent-studio-api.loadbalancer.server.port=8000"
      # WebSocket transport settings: disable buffering for real-time connections
      - "traefik.http.services.agent-studio-api.loadbalancer.responseForwarding.flushInterval=-1"
      - "traefik.http.middlewares.agent-studio-strip.stripprefix.prefixes=/agent-studio"
      # NO forward-auth - MCP protocol requires 'token' parameter in tool calls
      - "traefik.http.routers.agent-studio-api.middlewares=agent-studio-strip"
      # Route: /studio/* -> agent-studio:8000/studio/* (Unified Studio Frontend)
      # SPA routing handled by SPAStaticFiles in FastAPI (fallback to index.html)
      # Frontend served from src/mcp_server_langgraph/studio/frontend/dist
      # Authentication: React SPA handles OAuth2 PKCE flow natively (no forward-auth)
      - "traefik.http.routers.studio.rule=PathPrefix(`/studio`)"
      - "traefik.http.routers.studio.entrypoints=web"
      - "traefik.http.routers.studio.priority=10"
      - "traefik.http.routers.studio.service=agent-studio-api"
      # Apply CSP headers for Sandpack (CodeSandbox iframe execution)
      - "traefik.http.routers.studio.middlewares=sandpack-csp@docker"
      # NO forward-auth - SPA implements OAuth2 Authorization Code + PKCE flow
      # NO strip - FastAPI serves /studio/* directly
      # Route: /login -> agent-studio:8000/login (Native Login Page - NO AUTH)
      # Native login page bypasses forward-auth for seamless user experience
      - "traefik.http.routers.login.rule=Path(`/login`)"
      - "traefik.http.routers.login.entrypoints=web"
      - "traefik.http.routers.login.priority=100"
      - "traefik.http.routers.login.service=agent-studio-api"
      # NO forward-auth middleware - login page is publicly accessible
      # Route: /auth/callback -> agent-studio (NO AUTH for OAuth2 callback)
      # OAuth2 Authorization Code + PKCE callback page (receives tokens in URL fragment)
      - "traefik.http.routers.auth-callback.rule=Path(`/auth/callback`)"
      - "traefik.http.routers.auth-callback.entrypoints=web"
      - "traefik.http.routers.auth-callback.priority=100"
      - "traefik.http.routers.auth-callback.service=agent-studio-api"
      # NO forward-auth middleware - callback page is publicly accessible (tokens in fragment)
      # Route: /studio/assets/* -> agent-studio (NO AUTH for static assets)
      # Frontend JS/CSS assets needed for login page (served from /studio/assets)
      - "traefik.http.routers.assets.rule=PathPrefix(`/studio/assets`) || PathPrefix(`/assets`)"
      - "traefik.http.routers.assets.entrypoints=web"
      - "traefik.http.routers.assets.priority=100"
      - "traefik.http.routers.assets.service=agent-studio-api"
      # NO forward-auth middleware - static assets are publicly accessible
      # Route: /sounds/* -> agent-studio (NO AUTH for alert sounds)
      # Alert sound files (critical-alert.wav, etc.) used by useAlertSound hook
      - "traefik.http.routers.sounds.rule=PathPrefix(`/sounds`)"
      - "traefik.http.routers.sounds.entrypoints=web"
      - "traefik.http.routers.sounds.priority=100"
      - "traefik.http.routers.sounds.service=agent-studio-api"
      # NO forward-auth middleware - sound assets are publicly accessible
      # Route: /api/v1/auth/* -> agent-studio (NO AUTH)
      # Native OAuth2 endpoints (login, logout, callback, refresh, introspect, etc.)
      # These endpoints handle Keycloak OAuth2 flows directly without traefik-forward-auth
      - "traefik.http.routers.api-auth.rule=PathPrefix(`/api/v1/auth`)"
      - "traefik.http.routers.api-auth.entrypoints=web"
      - "traefik.http.routers.api-auth.priority=100"
      - "traefik.http.routers.api-auth.service=agent-studio-api"
      # NO forward-auth middleware - OAuth2 endpoints are publicly accessible
      # Route: /api/v1/health/* -> agent-studio (NO AUTH)
      # Health endpoints must be publicly accessible for Kubernetes probes and monitoring
      - "traefik.http.routers.api-health.rule=PathPrefix(`/api/v1/health`)"
      - "traefik.http.routers.api-health.entrypoints=web"
      - "traefik.http.routers.api-health.priority=100"
      - "traefik.http.routers.api-health.service=agent-studio-api"
      # NO forward-auth middleware - health endpoints are publicly accessible
      # Route: /api/v1/identity-providers -> agent-studio (NO AUTH)
      # Identity providers endpoint must be publicly accessible for login page
      # The login page needs to fetch available IdPs BEFORE user authentication
      - "traefik.http.routers.api-idp.rule=PathPrefix(`/api/v1/identity-providers`)"
      - "traefik.http.routers.api-idp.entrypoints=web"
      - "traefik.http.routers.api-idp.priority=100"
      - "traefik.http.routers.api-idp.service=agent-studio-api"
      # NO forward-auth middleware - identity providers endpoint is publicly accessible
      # Route: /api/v1/ws/* -> agent-studio:8000/api/v1/ws/* (WebSocket endpoints)
      # Dedicated WebSocket router with higher priority for real-time connections
      # Frontend hooks connect to /api/v1/ws/notifications, /api/v1/ws/alerts, etc.
      # Authentication: WebSocket auth via token query param (validated by backend)
      - "traefik.http.routers.api-ws.rule=PathPrefix(`/api/v1/ws`)"
      - "traefik.http.routers.api-ws.entrypoints=web"
      - "traefik.http.routers.api-ws.priority=15"
      - "traefik.http.routers.api-ws.service=agent-studio-api"
      # NO forward-auth - WebSocket handles auth via token query param
      # NO strip - FastAPI serves /api/v1/ws/* directly
      # Route: /api/* -> agent-studio:8000/api/* (API endpoints for frontend)
      # This allows the frontend at /studio to call /api/v1/* endpoints directly
      # Authentication: JWT validation via AuthRequestMiddleware (no forward-auth)
      - "traefik.http.routers.api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=10"
      - "traefik.http.routers.api.service=agent-studio-api"
      # NO forward-auth - API endpoints validate JWT tokens from Authorization header
      # NO strip - FastAPI serves /api/* directly
      # Route: / -> redirect to /login (Native Login entry point)
      # Priority 100 ensures this takes precedence; regex .* works because router already matches Path(`/`)
      # Users start at /login, then navigate to /studio after authentication
      - "traefik.http.routers.root.rule=Path(`/`)"
      - "traefik.http.routers.root.entrypoints=web"
      - "traefik.http.routers.root.priority=100"
      - "traefik.http.routers.root.middlewares=root-redirect"
      - "traefik.http.middlewares.root-redirect.redirectregex.regex=.*"
      - "traefik.http.middlewares.root-redirect.redirectregex.replacement=/login"
      - "traefik.http.middlewares.root-redirect.redirectregex.permanent=false"
      - "traefik.http.routers.root.service=agent-studio-api"
      # Route: /ws/* -> agent-studio:8000/ws/* (WebSocket endpoints)
      # WebSocket connections for real-time notifications and updates
      # Authentication: WebSocket auth via token query param or header
      - "traefik.http.routers.ws.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.ws.entrypoints=web"
      - "traefik.http.routers.ws.priority=10"
      - "traefik.http.routers.ws.service=agent-studio-api"
      # NO forward-auth - WebSocket handles auth via token param
      # NO strip - FastAPI serves /ws/* directly
      # Route: /health/* -> agent-studio:8000/health/* (Health endpoints)
      # Kubernetes probes and monitoring tools access /health/live, /health/ready, /health/startup
      - "traefik.http.routers.health.rule=PathPrefix(`/health`)"
      - "traefik.http.routers.health.entrypoints=web"
      - "traefik.http.routers.health.priority=100"
      - "traefik.http.routers.health.service=agent-studio-api"
      # NO forward-auth middleware - health endpoints are publicly accessible

  # ==============================================================================
  # OBSERVABILITY SERVICES (Grafana LGTM Stack)
  # ==============================================================================
  # Unified observability with Grafana Loki, Tempo, Mimir, and Alloy
  #
  # Architecture:
  #   Applications -> Alloy (OTLP receiver) -> Tempo (traces) / Mimir (metrics)
  #   Docker logs -> Alloy (log scraper) -> Loki (logs)
  #   Grafana (unified UI for all telemetry + alerting)
  #
  # Removed (replaced by LGTM stack):
  #   - Jaeger (replaced by Tempo)
  #   - Prometheus (replaced by Alloy + Mimir)
  #   - Alertmanager (replaced by Grafana Unified Alerting)
  #   - Promtail (replaced by Alloy)
  #
  # See: docker/alloy/alloy-config.alloy for unified telemetry collection config

  grafana-test:
    image: grafana/grafana:12.2.0
    # RESILIENCE: Auto-restart on failure for observability infrastructure
    # Helps recover from transient SQLite locking issues during provisioning
    restart: unless-stopped
    depends_on:
      grafana-init:
        condition: service_completed_successfully
      keycloak-test:
        condition: service_healthy  # Required for OAuth2 SSO
      alloy-test:
        condition: service_healthy
      loki-test:
        condition: service_started  # Loki has healthcheck disabled (distroless image)
      tempo-test:
        condition: service_healthy
      mimir-test:
        condition: service_started  # Mimir has healthcheck disabled (distroless)
    ports:
      - "13001:3000"  # Grafana UI (offset by 10000 from prod's 3001)
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Default theme: dark (matches Agent Studio design system)
      - GF_USERS_DEFAULT_THEME=dark
      # JSON-structured logging for LGTM stack integration (Loki/Alloy parsing)
      # Reference: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#log
      - GF_LOG_MODE=console
      - GF_LOG_CONSOLE_FORMAT=json
      # Allow OAuth users to be auto-provisioned (required for SSO)
      - GF_USERS_ALLOW_SIGN_UP=true
      # Subpath configuration for gateway routing
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/dashboards/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Database configuration - prevent "database is locked" errors during concurrent provisioning
      # Reference: https://community.grafana.com/t/database-is-locked/87028
      # Reference: https://github.com/prometheus-community/helm-charts/issues/4542
      - GF_DATABASE_WAL=true
      - GF_DATABASE_CACHE_MODE=shared
      - GF_DATABASE_LOCKING_ATTEMPT_TIMEOUT_SEC=60
      # Disable migration locking - prevents lock contention during startup with provisioning
      # This is safe for single-instance test environments
      - GF_DATABASE_MIGRATION_LOCKING=false
      # Unified alerting configuration
      - GF_ALERTING_ENABLED=true
      - GF_UNIFIED_ALERTING_ENABLED=true
      # Use Mimir as external Alertmanager
      - GF_UNIFIED_ALERTING_ALERTMANAGERS_DISCOVER=false
      - GF_UNIFIED_ALERTING_ALERTMANAGER_URL=http://mimir:9009/alertmanager
      # Enable Prometheus metrics endpoint for LGTM self-monitoring
      - GF_METRICS_ENABLED=true
      # ======================================================================
      # OAuth2/OIDC Configuration (Keycloak SSO - ADR-0068)
      # ======================================================================
      # Native Grafana OAuth2 replaces traefik-forward-auth for dashboard access
      # Users authenticate via Keycloak, roles mapped from JWT claims
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Keycloak
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=grafana
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=test-grafana-secret
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile roles
      # Auth URL uses localhost (browser-accessible) for redirect
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=http://localhost/authn/realms/default/protocol/openid-connect/auth
      # Token/API URLs use internal Docker hostname (server-to-server)
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://keycloak-test:8080/authn/realms/default/protocol/openid-connect/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=http://keycloak-test:8080/authn/realms/default/protocol/openid-connect/userinfo
      # Role mapping: admin realm role -> Grafana Admin, otherwise Viewer
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(realm_access.roles[*], 'admin') && 'Admin' || 'Viewer'
      - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
      # Fix for "user not found" error during OAuth user sync (Grafana issue #79836)
      # This allows Grafana to look up users by email without strict verification
      - GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP=true
      # Use PKCE for enhanced OAuth2 security
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      # Auto-login redirects unauthenticated users to Keycloak
      - GF_AUTH_OAUTH_AUTO_LOGIN=true
      # Disable login form to enforce SSO for UI users
      # API access uses basic auth with admin credentials (see MCP server config)
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # ======================================================================
      # Session Token Rotation (prevents "token needs to be rotated" errors)
      # ======================================================================
      # Rotate tokens every 10 minutes to prevent stale session issues
      - GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES=10
      # Maximum inactive lifetime before forcing re-authentication
      - GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION=30m
      # Maximum lifetime for login tokens (absolute expiry)
      - GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION=8h
      # ======================================================================
      # Grafana Live Configuration (WebSocket real-time features)
      # ======================================================================
      # Enable Grafana Live for real-time dashboard updates and streaming
      # Session token rotation settings above prevent stale session 401 errors
      - GF_LIVE_MAX_CONNECTIONS=100
      # Allow all origins for WebSocket connections in test environment
      - GF_LIVE_ALLOWED_ORIGINS=*
    volumes:
      - grafana-data:/var/lib/grafana  # Named volume prevents SQLite locking issues
      - ./monitoring/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/alerting.yml:/etc/grafana/provisioning/alerting/alerting.yml:ro
    healthcheck:
      # wget is available in the official Grafana image (grafana/grafana)
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s  # CI environments need extra time for SQLite initialization + provisioning
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M
    networks:
      agent-studio-test-network:
        aliases:
          - grafana
    labels:
      - "traefik.enable=true"
      # Route: /dashboards/* -> grafana:3000 (Unified Dashboards)
      # Grafana handles subpath via GF_SERVER_SERVE_FROM_SUB_PATH
      # Authentication: Native OAuth2 with Keycloak (ADR-0068)
      # NOTE: No forward-auth middleware - Grafana handles OAuth2 natively
      - "traefik.http.routers.grafana.rule=PathPrefix(`/dashboards`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      # Priority 11 to take precedence over qdrant-dashboard (PathPrefix /dashboard)
      # since /dashboards starts with /dashboard
      - "traefik.http.routers.grafana.priority=11"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      # NO strip - Grafana configured for /dashboards subpath

  # ==============================================================================
  # LGTM INIT CONTAINERS (Volume Permission Setup)
  # ==============================================================================
  # Init containers run as root to set correct ownership on Docker volumes
  # Required because LGTM containers run as non-root (UID 10001) while
  # Docker named volumes are created with root ownership by default.
  # Pattern from: https://github.com/grafana/loki/blob/main/production/docker/docker-compose.yaml

  # Init containers use busybox (has sh) since LGTM images are distroless (no shell)
  # Pattern from: https://github.com/grafana/loki/blob/main/production/docker/docker-compose.yaml

  loki-init:
    image: busybox:1.37
    user: root
    restart: "no"  # One-shot init container - run once and exit
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/loki/chunks /tmp/loki/rules/fake /tmp/loki/ruler /tmp/loki/compactor
        chown -R 10001:10001 /tmp/loki
        echo "Loki volume permissions set (UID 10001, tenant: fake)"
    volumes:
      - loki-data:/tmp/loki
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.01'
          memory: 8M
    networks:
      - agent-studio-test-network

  tempo-init:
    image: busybox:1.37
    user: root
    restart: "no"  # One-shot init container - run once and exit
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/tempo/traces /tmp/tempo/wal /tmp/tempo/blocks
        chown -R 10001:10001 /tmp/tempo
        echo "Tempo volume permissions set (UID 10001)"
    volumes:
      - tempo-data:/tmp/tempo
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.01'
          memory: 8M
    networks:
      - agent-studio-test-network

  mimir-init:
    image: busybox:1.37
    user: root
    restart: "no"  # One-shot init container - run once and exit
    command:
      - sh
      - -c
      - |
        mkdir -p /tmp/mimir/data /tmp/mimir/tsdb /tmp/mimir/evaldata /tmp/mimir/ruleconfigs/anonymous
        chown -R 10001:10001 /tmp/mimir
        echo "Mimir volume permissions set (UID 10001)"
    volumes:
      - mimir-data:/tmp/mimir
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.01'
          memory: 8M
    networks:
      - agent-studio-test-network

  grafana-init:
    image: busybox:1.37
    user: root
    restart: "no"  # One-shot init container - run once and exit
    command:
      - sh
      - -c
      - |
        mkdir -p /var/lib/grafana/plugins /var/lib/grafana/provisioning/alerting
        chown -R 472:0 /var/lib/grafana
        echo "Grafana volume permissions set (UID 472)"
    volumes:
      - grafana-data:/var/lib/grafana
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 32M
        reservations:
          cpus: '0.01'
          memory: 8M
    networks:
      - agent-studio-test-network

  # ==============================================================================
  # LOG STORAGE (Loki)
  # ==============================================================================
  # Grafana Loki for centralized log storage and querying
  # Logs collected by Alloy and stored in Loki
  # Logs accessible at /logs or via Grafana Explore

  loki-test:
    image: grafana/loki:3.6.2
    # RESILIENCE: Auto-restart on failure for log aggregation
    restart: unless-stopped
    # Loki runs as UID 10001 in the official image (non-root for security)
    # Init container (loki-init) sets volume permissions before startup
    user: "10001"
    depends_on:
      loki-init:
        condition: service_completed_successfully
    command: -config.file=/etc/loki/local-config.yaml -target=all
    ports:
      - "13100:3100"  # Loki API (offset by 10000)
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
      # Mount alerting rules under "fake" tenant (auth_enabled: false uses "fake")
      # Reference: https://grafana.com/docs/loki/latest/alert/#ruler
      - ./docker/loki/rules:/tmp/loki/rules/fake:ro
    healthcheck:
      # NOTE: Loki 3.6.2 uses distroless image with no shell utilities (no bash, wget, curl)
      # Healthcheck disabled; service is still accessible on port 3100
      # Dependent services use condition: service_started instead of service_healthy
      # See: https://github.com/grafana/loki/issues/18890
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      agent-studio-test-network:
        aliases:
          - loki
    labels:
      - "traefik.enable=true"
      # Route: /logs/* -> loki:3100 (Log Aggregation)
      - "traefik.http.routers.loki.rule=PathPrefix(`/logs`)"
      - "traefik.http.routers.loki.entrypoints=web"
      - "traefik.http.routers.loki.priority=10"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "traefik.http.middlewares.loki-strip.stripprefix.prefixes=/logs"
      - "traefik.http.routers.loki.middlewares=loki-strip"

  # Note: Promtail removed - Alloy handles log collection from Docker containers
  # See: docker/alloy/alloy-config.alloy (loki.source.docker block)

  # ==============================================================================
  # DISTRIBUTED TRACING (Tempo)
  # ==============================================================================
  # Grafana Tempo for distributed trace storage and querying
  # Traces accessible at /traces or via Grafana Explore

  tempo-test:
    image: grafana/tempo:2.9.0
    # RESILIENCE: Auto-restart on failure for distributed tracing
    restart: unless-stopped
    # Tempo runs as UID 10001 in the official image (non-root for security)
    # Init container (tempo-init) sets volume permissions before startup
    user: "10001"
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    ports:
      - "13200:3200"  # Tempo API (offset by 10000)
      - "14317:4317"  # OTLP gRPC (offset by 10000)
      - "14318:4318"  # OTLP HTTP (offset by 10000)
    volumes:
      - ./docker/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/tmp/tempo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      agent-studio-test-network:
        aliases:
          - tempo
    labels:
      - "traefik.enable=true"
      # Route: /traces/* -> tempo:3200 (Distributed Tracing)
      - "traefik.http.routers.tempo.rule=PathPrefix(`/traces`)"
      - "traefik.http.routers.tempo.entrypoints=web"
      - "traefik.http.routers.tempo.priority=10"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
      - "traefik.http.middlewares.tempo-strip.stripprefix.prefixes=/traces"
      - "traefik.http.routers.tempo.middlewares=tempo-strip"

  # ==============================================================================
  # METRICS STORAGE (Mimir)
  # ==============================================================================
  # Grafana Mimir for long-term metrics storage
  # Metrics accessible via Grafana Explore

  mimir-test:
    image: grafana/mimir:3.0.1
    # RESILIENCE: Auto-restart on failure for metrics storage
    restart: unless-stopped
    # Mimir runs as UID 10001 in the official image (non-root for security)
    # Init container (mimir-init) sets volume permissions before startup
    user: "10001"
    depends_on:
      mimir-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/mimir/mimir-config.yaml"]
    ports:
      - "19009:9009"  # Mimir API (offset by 10000)
    volumes:
      - ./docker/mimir/mimir-config.yaml:/etc/mimir/mimir-config.yaml:ro
      - ./docker/mimir/alertmanager-fallback.yaml:/etc/mimir/alertmanager-fallback.yaml:ro
      # Named volume must be listed before bind mounts to subdirectories
      - mimir-data:/tmp/mimir
      # Alerting rules for Mimir ruler (auto-loaded on startup)
      # Mimir expects rules in tenant-specific paths: /tmp/mimir/ruleconfigs/<tenant>/
      # With multitenancy_enabled: false, the tenant is "anonymous"
      - ./docker/mimir/rules:/tmp/mimir/ruleconfigs/anonymous:ro
    # NOTE: Mimir uses distroless image with no wget/curl
    # See: https://github.com/grafana/mimir/issues/9034
    # Healthcheck disabled; service is still accessible on port 9009
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      agent-studio-test-network:
        aliases:
          - mimir
    labels:
      - "traefik.enable=true"
      # Route: /metrics/* -> mimir:9009 (Metrics Storage)
      - "traefik.http.routers.mimir.rule=PathPrefix(`/metrics`)"
      - "traefik.http.routers.mimir.entrypoints=web"
      - "traefik.http.routers.mimir.priority=10"
      - "traefik.http.services.mimir.loadbalancer.server.port=9009"
      - "traefik.http.middlewares.mimir-strip.stripprefix.prefixes=/metrics"
      - "traefik.http.routers.mimir.middlewares=mimir-strip"

  # ==============================================================================
  # UNIFIED TELEMETRY COLLECTOR (Alloy)
  # ==============================================================================
  # Grafana Alloy - unified collector replacing Prometheus, Promtail, and OTEL Collector
  # Collects metrics, logs, and traces; forwards to Mimir, Loki, and Tempo
  # Reference: https://grafana.com/docs/alloy/latest/

  alloy-test:
    image: grafana/alloy:v1.12.0
    # RESILIENCE: Auto-restart on failure for telemetry collection
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=generally-available
    depends_on:
      loki-test:
        condition: service_started  # Loki has healthcheck disabled (distroless image)
      tempo-test:
        condition: service_healthy
      mimir-test:
        condition: service_started  # Mimir has healthcheck disabled (distroless)
    ports:
      - "12345:12345"  # Alloy UI/API
      - "4317:4317"    # OTLP gRPC (applications send here)
      - "4318:4318"    # OTLP HTTP (applications send here)
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For Docker log collection
    environment:
      - ALLOY_DEPLOY_MODE=compose
    healthcheck:
      # HTTP healthcheck using bash TCP socket pattern (no wget/curl in Alloy image)
      # Uses /-/ready endpoint to verify collector is ready to receive telemetry
      # Bash TCP pattern: { printf 'request' >&0; grep 'pattern'; } 0<>/dev/tcp/host/port
      # NOTE: Must explicitly use bash (not sh) for /dev/tcp to work
      # Reference: https://grafana.com/docs/alloy/latest/reference/cli/run/#http-endpoints
      test:
        - CMD-SHELL
        - |
          bash -c '{ printf "GET /-/ready HTTP/1.0\r\nHost: localhost\r\n\r\n" >&0; grep -q "HTTP/1.. 200"; } 0<>/dev/tcp/localhost/12345'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    networks:
      agent-studio-test-network:
        aliases:
          - alloy
    labels:
      - "traefik.enable=true"
      # Route: /telemetry/* -> alloy:12345 (Telemetry Collector UI)
      - "traefik.http.routers.alloy.rule=PathPrefix(`/telemetry`)"
      - "traefik.http.routers.alloy.entrypoints=web"
      - "traefik.http.routers.alloy.priority=10"
      - "traefik.http.services.alloy.loadbalancer.server.port=12345"
      - "traefik.http.middlewares.alloy-strip.stripprefix.prefixes=/telemetry"
      # Authentication via forward-auth middleware (ADR-0054)
      - "traefik.http.routers.alloy.middlewares=forward-auth@docker,alloy-strip"

  # ==============================================================================
  # VISUAL WORKFLOW BUILDER - DEPRECATED (2025-12-13)
  # ==============================================================================
  # NOTE: Builder service has been consolidated into the unified Studio frontend.
  # The builder/frontend directory and Dockerfile.builder have been removed.
  # Workflow functionality is now available at:
  #   - /api/v1/workflows/* - Unified API endpoints
  #   - /studio/* - Studio frontend (React + Redux Toolkit)
  #
  # See: docs/guides/api-migration-guide.md for migration details
  # See: CHANGELOG.md [Unreleased] for full consolidation details

  # ==============================================================================
  # INTERACTIVE PLAYGROUND - DEPRECATED (2025-12-13)
  # ==============================================================================
  # NOTE: Playground service has been consolidated into the unified Studio frontend.
  # The playground/frontend directory and Dockerfile.playground have been removed.
  # Session/chat functionality is now available at:
  #   - /api/v1/sessions/* - Unified API endpoints
  #   - /api/v1/chat/* - Chat API with streaming
  #   - /studio/* - Studio frontend (React + Redux Toolkit)
  #
  # See: docs/guides/api-migration-guide.md for migration details
  # See: CHANGELOG.md [Unreleased] for full consolidation details

  # ==============================================================================
  # AGENT STUDIO SANDBOX (Code Execution Runtime)
  # ==============================================================================
  # Sandbox image for high-risk tools (bash, web_fetch, screenshot, computer-use)
  # Used by the code execution engine in agent-studio-test
  #
  # This is a BUILD-ONLY service - it doesn't run as a container in the compose stack.
  # The MCP server spawns sandbox containers on-demand using Docker API.
  #
  # Build with: docker compose -f docker-compose.test.yml build agent-studio-sandbox
  # Reference: docker/Dockerfile.sandbox

  agent-studio-sandbox:
    image: ghcr.io/vishnu2kmohan/agent-studio-sandbox:latest
    # LOCAL DEV: Always build locally (GHCR images not published for local dev)
    # CI: Uses pre-built images via separate workflow
    pull_policy: build
    build:
      context: .
      dockerfile: docker/Dockerfile.sandbox
      tags:
        - ghcr.io/vishnu2kmohan/agent-studio-sandbox:latest
        - ghcr.io/vishnu2kmohan/agent-studio-sandbox:local
    # This service is NOT meant to run - it's a build target only
    # The actual sandbox containers are spawned by agent-studio-test via Docker API
    profiles:
      - build-only

networks:
  agent-studio-test-network:
    driver: bridge
    name: agent-studio-test-network

# ==============================================================================
# NAMED VOLUMES FOR DATA PERSISTENCE
# ==============================================================================
# These volumes persist data across container restarts.
# Use `make test-infra-clean-volumes` to reset all data.

volumes:
  # Database persistence
  postgres-data:

  # Cache persistence
  redis-data:

  # Vector DB persistence
  qdrant-data:

  # LGTM Stack persistence
  loki-data:
  tempo-data:
  mimir-data:
  grafana-data:
