# Agent Studio Admin Theme
# Extends the default Keycloak v2 admin console
#
# Note: Admin console in Keycloak 26+ is a React SPA with limited CSS customization.
# PatternFly CSS variables are overridable, but custom stylesheets are not supported.
# The login theme CSS variables will affect shared PatternFly components.
#
# Reference: https://www.keycloak.org/ui-customization/themes

# Extend the default Keycloak v2 admin theme
parent=keycloak.v2

# Favicon - Agent Studio icon (SVG for modern browsers)
favicon=img/favicon.svg
