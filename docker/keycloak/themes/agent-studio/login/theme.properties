# Agent Studio Login Theme
# Extends the default Keycloak v2 theme with custom styling
#
# Reference: https://www.keycloak.org/ui-customization/themes

# Extend the default Keycloak v2 theme (PatternFly 5)
parent=keycloak.v2

# Import custom styles after PatternFly
styles=css/login.css

# Favicon - Agent Studio icon (SVG for modern browsers)
# NOTE: The "meta" property expects "name==content" format for HTML meta tags.
# For favicon, use the "favicon" property directly (no meta tag needed).
favicon=img/favicon.svg

# Logo image for the login page header
logo=img/logo.svg
logoDark=img/logo-dark.svg
