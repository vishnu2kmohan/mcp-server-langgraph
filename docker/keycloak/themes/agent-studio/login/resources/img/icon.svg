<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle with gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" />
  <!-- Inner ring for maskable safe zone -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  <!-- Agent/Graph icon - nodes and connections -->
  <g fill="white">
    <!-- Central node (AI brain) -->
    <circle cx="256" cy="200" r="45" fill="white" opacity="0.95"/>
    <!-- Left node -->
    <circle cx="160" cy="340" r="35" fill="white" opacity="0.85"/>
    <!-- Right node -->
    <circle cx="352" cy="340" r="35" fill="white" opacity="0.85"/>
    <!-- Connection lines -->
    <line x1="256" y1="245" x2="180" y2="310" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="256" y1="245" x2="332" y2="310" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
    <line x1="195" y1="340" x2="317" y2="340" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.7"/>
  </g>
  <!-- Small decorative dots representing data flow -->
  <g fill="white" opacity="0.6">
    <circle cx="218" cy="277" r="6"/>
    <circle cx="294" cy="277" r="6"/>
    <circle cx="256" cy="340" r="6"/>
  </g>
</svg>
