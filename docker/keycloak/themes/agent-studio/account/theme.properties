# Agent Studio Account Theme
# Extends the default Keycloak v2 account console with custom branding
#
# Note: Account console in Keycloak 26+ is a React SPA.
# Customization is done via PatternFly 5 CSS variable overrides.
#
# Reference: https://www.keycloak.org/ui-customization/themes

# Extend the default Keycloak v2 account theme
parent=keycloak.v2

# Import custom styles (PatternFly variable overrides)
styles=css/account.css

# Favicon - Agent Studio icon (SVG for modern browsers)
# NOTE: The "meta" property expects "name==content" format for HTML meta tags.
# For favicon, use the "favicon" property directly (no meta tag needed).
favicon=img/favicon.svg
