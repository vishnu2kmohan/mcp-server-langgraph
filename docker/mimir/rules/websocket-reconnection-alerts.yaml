groups:
  # WebSocket Reconnection Alert Rules
  # These alerts monitor frontend WebSocket connection stability and fire when
  # reconnection patterns indicate connectivity issues.
  # Reference: monitoring/grafana/dashboards/Application/websocket-telemetry.json

  - name: websocket_reconnection_alerts
    rules:
      # High reconnection failure rate (>20% failures over 5 minutes)
      # Indicates systematic connectivity problems
      - alert: WebSocketReconnectionFailureRateHigh
        expr: |
          (
            sum(increase(ws_reconnection_failure_total[5m]))
            / sum(increase(ws_reconnection_attempts_total[5m]))
          ) > 0.2
        for: 5m
        labels:
          severity: warning
          component: websocket
          sla_metric: reconnection_success_rate
        annotations:
          summary: "WebSocket reconnection failure rate exceeds 20%"
          description: "Frontend WebSocket connections have a {{ $value | printf \"%.1f\" }}% failure rate over the last 5 minutes (threshold: 20%)"
          runbook_url: "https://docs.internal/runbooks/websocket-reconnection-failures"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # Critical reconnection failure rate (>50% failures over 5 minutes)
      # Indicates severe connectivity issues requiring immediate attention
      - alert: WebSocketReconnectionFailureRateCritical
        expr: |
          (
            sum(increase(ws_reconnection_failure_total[5m]))
            / sum(increase(ws_reconnection_attempts_total[5m]))
          ) > 0.5
        for: 3m
        labels:
          severity: critical
          component: websocket
          sla_metric: reconnection_success_rate
        annotations:
          summary: "WebSocket reconnection failure rate exceeds 50%"
          description: "CRITICAL: Frontend WebSocket connections have a {{ $value | printf \"%.1f\" }}% failure rate. Users are likely experiencing real-time data loss."
          runbook_url: "https://docs.internal/runbooks/websocket-critical-failure"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # Excessive reconnection attempts (spike detection)
      # More than 50 reconnection attempts in 5 minutes across all endpoints
      - alert: WebSocketReconnectionSpike
        expr: |
          sum(increase(ws_reconnection_attempts_total[5m])) > 50
        for: 5m
        labels:
          severity: warning
          component: websocket
          sla_metric: reconnection_volume
        annotations:
          summary: "WebSocket reconnection spike detected"
          description: "{{ $value | printf \"%.0f\" }} reconnection attempts in the last 5 minutes (threshold: 50). This may indicate network instability or server issues."
          runbook_url: "https://docs.internal/runbooks/websocket-reconnection-spike"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # Endpoint-specific reconnection failures
      # Single endpoint with >5 failures in 5 minutes
      - alert: WebSocketEndpointReconnectionFailures
        expr: |
          increase(ws_reconnection_failure_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: websocket
          sla_metric: endpoint_failures
        annotations:
          summary: "WebSocket endpoint {{ $labels.endpoint_id }} experiencing reconnection failures"
          description: "Endpoint {{ $labels.endpoint_id }} has had {{ $value | printf \"%.0f\" }} failed reconnection attempts in the last 5 minutes."
          runbook_url: "https://docs.internal/runbooks/websocket-endpoint-failures"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # Slow reconnection (P95 > 5 seconds)
      # Reconnections taking too long indicate backend or network latency
      - alert: WebSocketReconnectionLatencyHigh
        expr: |
          histogram_quantile(0.95, sum(rate(ws_reconnection_duration_seconds_bucket[5m])) by (le)) > 5
        for: 5m
        labels:
          severity: warning
          component: websocket
          sla_metric: reconnection_latency
        annotations:
          summary: "WebSocket reconnection latency p95 exceeds 5 seconds"
          description: "P95 reconnection time is {{ $value | printf \"%.2f\" }}s (threshold: 5s). Users may experience delays when connections are restored."
          runbook_url: "https://docs.internal/runbooks/websocket-reconnection-latency"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # No active frontend connections (all endpoints disconnected)
      # This is a critical issue if we expect users to be connected
      - alert: WebSocketNoActiveConnections
        expr: |
          sum(ws_connection_active) == 0 and sum(increase(ws_reconnection_attempts_total[10m])) > 0
        for: 10m
        labels:
          severity: critical
          component: websocket
          sla_metric: connectivity
        annotations:
          summary: "No active WebSocket connections despite reconnection attempts"
          description: "All frontend WebSocket connections are disconnected, but reconnection attempts have been made. This indicates a complete connectivity failure."
          runbook_url: "https://docs.internal/runbooks/websocket-complete-outage"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # Token expiration causing failures
      # High proportion of token_expired failures
      - alert: WebSocketTokenExpirationIssues
        expr: |
          (
            sum(increase(ws_reconnection_failure_total{failure_reason="token_expired"}[15m]))
            / sum(increase(ws_reconnection_failure_total[15m]))
          ) > 0.3
        for: 10m
        labels:
          severity: warning
          component: websocket
          sla_metric: token_failures
        annotations:
          summary: "Token expiration causing >30% of WebSocket reconnection failures"
          description: "{{ $value | printf \"%.1f\" }}% of reconnection failures are due to token expiration. Check token refresh logic or consider extending token lifetime."
          runbook_url: "https://docs.internal/runbooks/websocket-token-issues"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"

      # Network errors dominating failures
      # High proportion of network_error failures
      - alert: WebSocketNetworkErrors
        expr: |
          (
            sum(increase(ws_reconnection_failure_total{failure_reason="network_error"}[15m]))
            / sum(increase(ws_reconnection_failure_total[15m]))
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          component: websocket
          sla_metric: network_failures
        annotations:
          summary: "Network errors causing >50% of WebSocket reconnection failures"
          description: "{{ $value | printf \"%.1f\" }}% of reconnection failures are due to network errors. Check user connectivity patterns, CDN health, or load balancer configuration."
          runbook_url: "https://docs.internal/runbooks/websocket-network-issues"
          dashboard_url: "{{ grafana_url }}/d/websocket-telemetry"
