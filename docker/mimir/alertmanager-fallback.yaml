# Mimir Alertmanager Fallback Configuration
# ==========================================
# Default alertmanager configuration used when no tenant config exists.
# Routes alerts to MCP Server's alertmanager webhook for real-time UI updates.
#
# Reference: ADR-0026 - Comprehensive Client Resilience Patterns

global:
  # SMTP configuration (disabled by default in test)
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@localhost'
  smtp_require_tls: false

  # Webhook timeout
  http_config:
    follow_redirects: true

route:
  # Default receiver - routes to MCP server webhook
  receiver: 'mcp-server-webhook'

  # Group alerts by alertname and service
  group_by: ['alertname', 'severity', 'service']

  # Wait time before sending first notification (faster for testing)
  group_wait: 10s

  # Interval between notifications for same group
  group_interval: 1m

  # Interval before re-sending notification
  repeat_interval: 4h

  # Child routes for different severities
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'mcp-server-webhook'
      group_wait: 5s
      group_interval: 30s
      continue: true

    # Warning alerts - normal grouping
    - match:
        severity: warning
      receiver: 'mcp-server-webhook'
      continue: true

receivers:
  # Primary receiver - MCP Server Alertmanager Webhook
  # This endpoint broadcasts alerts to connected WebSocket clients in the Admin Dashboard
  - name: 'mcp-server-webhook'
    webhook_configs:
      - url: 'http://mcp-server-test:8000/api/v1/webhooks/alertmanager'
        send_resolved: true
        max_alerts: 20
        http_config:
          follow_redirects: true

  # Legacy default receiver (for backward compatibility)
  - name: 'default-receiver'
    webhook_configs:
      - url: 'http://localhost:9999/alerts'
        send_resolved: true
        max_alerts: 10

# Inhibition rules to suppress notifications
inhibit_rules:
  # Critical alerts suppress warning alerts for same issue
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']

  # Circuit breaker open suppresses related retry/timeout alerts
  - source_match:
      alertname: 'CircuitBreakerOpen'
    target_match_re:
      alertname: 'RetryExhaustionHigh|TimeoutRateHigh'
    equal: ['service']

# Template configuration
templates: []
