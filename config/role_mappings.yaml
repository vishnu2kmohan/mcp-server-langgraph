# Role Mapping Configuration
#
# Defines how Keycloak roles, groups, and attributes map to OpenFGA tuples.
# This file enables flexible, declarative authorization without code changes.
#
# AUDIT FIX (2026-01-08):
# Removed invalid references to non-existent OpenFGA types:
# - role:* (type removed per Decision 1)
# - tool:all (removed per Decision 2)
# - resource:* (type doesn't exist)
# - team:* (type doesn't exist)
# - department:* (type doesn't exist)
# See: OpenFGA Audit Resolution Plan Phase 0 Task 0.2

version: "1.0"

# Simple 1:1 role mappings
# Maps Keycloak roles directly to OpenFGA relations/objects
simple_mappings:
  # Admin role grants system-wide admin access
  - keycloak_role: admin
    realm: true  # Realm role (vs client role)
    openfga_relation: admin
    openfga_object: system:global

  # Premium role for paid users (maps to user for now)
  # TODO: Implement premium tier via conditions in Phase 6
  - keycloak_role: premium
    realm: true
    openfga_relation: user
    openfga_object: system:global

  # Standard user role
  - keycloak_role: user
    realm: true
    openfga_relation: user
    openfga_object: system:global

  # Viewer role grants read-only access
  - keycloak_role: viewer
    realm: true
    openfga_relation: viewer
    openfga_object: system:global

  # Ops role for observability access (ADR-0093)
  - keycloak_role: ops
    realm: true
    openfga_relation: ops
    openfga_object: observability:global

# Group-based mappings with regex patterns
# Uses pattern matching to map group hierarchies to organizations
group_mappings:
  # Top-level groups → Organizations
  # Pattern: /acme → organization:acme
  - pattern: "^/([^/]+)$"
    openfga_relation: member
    openfga_object_template: "organization:{group_name}"

  # Nested groups also map to organizations
  # Pattern: /acme/engineering → organization:acme (uses parent org)
  # Note: Sub-org hierarchy deferred to future phase
  - pattern: "^/([^/]+)/([^/]+)$"
    openfga_relation: member
    openfga_object_template: "organization:{group_name}"

# Conditional mappings based on user attributes
# Maps custom attributes to permissions
conditional_mappings:
  # Finance department gets access to cost dashboards
  - condition:
      attribute: department
      operator: "=="
      value: finance
    openfga_tuples:
      - relation: viewer
        object: cost:global
      - relation: viewer
        object: dashboard:financial

  # Manager role gets observability access
  - condition:
      attribute: job_title
      operator: "in"
      value: [Manager, Director, VP, CEO]
    openfga_tuples:
      - relation: viewer
        object: observability:global
      - relation: viewer
        object: dashboard:executive

# Role hierarchies
# Define role inheritance (higher roles inherit lower role permissions)
hierarchies:
  # Admin inherits all permissions
  admin:
    - premium
    - user

  # Premium inherits user permissions
  premium:
    - user

  # Manager inherits contributor permissions
  manager:
    - contributor
    - user

  # Contributor inherits user permissions
  contributor:
    - user

# Notes:
# - Rules are applied in order: simple → group → conditional
# - Hierarchies are applied after all rules
# - Duplicate tuples are automatically deduplicated
# - Pattern matching uses Python regex syntax
# - Available operators: ==, !=, in, >=, <=
