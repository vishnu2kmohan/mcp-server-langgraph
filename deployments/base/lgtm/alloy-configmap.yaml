# Alloy ConfigMap for Kubernetes LGTM Stack
# ==========================================
# Configuration adapted from docker/alloy/config.alloy for Kubernetes

apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  labels:
    app: alloy
    component: observability
data:
  config.alloy: |
    // Grafana Alloy Configuration for Kubernetes LGTM Stack
    // ======================================================
    // Unified telemetry collector:
    //   - Logs -> Loki
    //   - Metrics -> Mimir (Prometheus-compatible)
    //   - Traces -> Tempo
    //
    // Reference: docker/alloy/config.alloy (adapted for Kubernetes)

    // =============================================================================
    // LOGGING CONFIGURATION
    // =============================================================================

    logging {
      level  = "warn"
      format = "logfmt"
    }

    // =============================================================================
    // OTLP RECEIVER (OpenTelemetry Protocol)
    // =============================================================================
    // Receives traces, metrics, and logs from applications via OTLP

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }

      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    // =============================================================================
    // OTLP BATCH PROCESSOR
    // =============================================================================

    otelcol.processor.batch "default" {
      output {
        metrics = [otelcol.exporter.prometheus.mimir.input]
        logs    = [otelcol.processor.attributes.observability_labels.input]
        traces  = [otelcol.exporter.otlp.tempo.input]
      }
    }

    // =============================================================================
    // OBSERVABILITY LABEL EXTRACTION
    // =============================================================================
    // Extract bounded labels from OTLP logs for Loki indexing
    // These labels enable efficient querying by entity filters

    otelcol.processor.attributes "observability_labels" {
      // Extract user_id as Loki label (bounded by user count)
      action {
        key    = "loki.attribute.labels"
        value  = "user_id"
        action = "insert"
      }

      // Extract session_id as Loki label (bounded by session TTL)
      action {
        key    = "loki.attribute.labels"
        value  = "session_id"
        action = "insert"
      }

      // Extract workflow_name as Loki label (bounded by workflow types)
      // Note: workflow_id is NOT indexed to avoid cardinality explosion
      action {
        key    = "loki.attribute.labels"
        value  = "workflow_name"
        action = "insert"
      }

      // Extract project_id as Loki label (bounded by project count)
      action {
        key    = "loki.attribute.labels"
        value  = "project_id"
        action = "insert"
      }

      // Extract organization_id as Loki label (bounded by org count)
      action {
        key    = "loki.attribute.labels"
        value  = "organization_id"
        action = "insert"
      }

      // Extract trace_id for trace correlation
      action {
        key    = "loki.attribute.labels"
        value  = "trace_id"
        action = "insert"
      }

      // Extract model_family for LLM metrics (bounded by get_model_family)
      action {
        key    = "loki.attribute.labels"
        value  = "model_family"
        action = "insert"
      }

      // Extract operation type (bounded by BOUNDED_OPERATIONS)
      action {
        key    = "loki.attribute.labels"
        value  = "operation"
        action = "insert"
      }

      // Extract status (bounded by BOUNDED_STATUSES)
      action {
        key    = "loki.attribute.labels"
        value  = "status"
        action = "insert"
      }

      output {
        logs = [otelcol.exporter.loki.default.input]
      }
    }

    // =============================================================================
    // OTLP EXPORTERS
    // =============================================================================

    // Export traces to Tempo
    otelcol.exporter.otlp "tempo" {
      client {
        endpoint = "tempo:4317"
        tls {
          insecure = true
        }
      }
    }

    // Export metrics to Mimir (Prometheus remote write)
    otelcol.exporter.prometheus "mimir" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    // Export OTLP logs to Loki
    otelcol.exporter.loki "default" {
      forward_to = [loki.write.loki.receiver]
    }

    // =============================================================================
    // PROMETHEUS REMOTE WRITE TO MIMIR
    // =============================================================================

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir:9009/api/v1/push"
      }
    }

    // =============================================================================
    // KUBERNETES DISCOVERY
    // =============================================================================

    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "kubernetes_pods" {
      targets = discovery.kubernetes.pods.targets

      // Keep only running pods
      rule {
        source_labels = ["__meta_kubernetes_pod_phase"]
        regex         = "Pending|Succeeded|Failed"
        action        = "drop"
      }

      // Use pod namespace as label
      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // Use pod name as label
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      // Use container name as label
      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      // Extract app label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      // Extract component label
      rule {
        source_labels = ["__meta_kubernetes_pod_label_component"]
        target_label  = "component"
      }
    }

    // =============================================================================
    // LOKI OUTPUT
    // =============================================================================

    loki.write "loki" {
      endpoint {
        url = "http://loki:3100/loki/api/v1/push"
      }
    }

    // =============================================================================
    // PROMETHEUS SCRAPE (for pod metrics)
    // =============================================================================

    prometheus.scrape "kubernetes_pods" {
      targets    = discovery.relabel.kubernetes_pods.output
      forward_to = [prometheus.remote_write.mimir.receiver]

      scrape_interval = "15s"
      scrape_timeout  = "10s"

      honor_labels = true
    }
