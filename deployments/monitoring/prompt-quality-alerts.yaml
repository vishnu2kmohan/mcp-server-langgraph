# Prompt Quality Alert Rules for MCP Server LangGraph
#
# These alerts monitor prompt usage and validation quality to catch LLM output drift
# and prompt-related issues in production.
#
# Alert Categories:
#   - Validation Failures: High rate of schema validation errors
#   - Parse Errors: JSON parsing failures in LLM responses
#   - Prompt Drift: Unusual changes in prompt usage patterns
#   - Quality Degradation: Drop in successful validation rate
#
# References:
#   - ADR-0089: Prompt Architecture Centralization
#   - Phase 7: Telemetry & Metadata
#   - Phase 7 Extension: Runtime Output Validation

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mcp-server-prompt-quality-alerts
  namespace: monitoring
  labels:
    app: mcp-server-langgraph
    prometheus: mcp-server
    role: alert-rules
    category: prompt-quality
spec:
  groups:
    # =========================================================================
    # Prompt Quality Recording Rules
    # =========================================================================
    - name: prompt.recording_rules
      interval: 30s
      rules:
        # Validation success rate by prompt (5m window)
        - record: prompt:validation:success_rate_5m
          expr: |
            sum by (prompt_name) (rate(prompt_validation_success_total{job="mcp-server-langgraph"}[5m]))
            / (
              sum by (prompt_name) (rate(prompt_validation_success_total{job="mcp-server-langgraph"}[5m]))
              + sum by (prompt_name) (rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
            )

        # Total validation failure rate (5m window)
        - record: prompt:validation:failure_rate_5m
          expr: |
            sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))

        # Parse error rate by prompt (5m window)
        - record: prompt:parse_error:rate_5m
          expr: |
            sum by (prompt_name) (rate(prompt_validation_parse_error_total{job="mcp-server-langgraph"}[5m]))

        # Prompt usage rate by name (5m window)
        - record: prompt:usage:rate_5m
          expr: |
            sum by (prompt_name) (rate(prompt_usage_total{job="mcp-server-langgraph"}[5m]))

        # Prompt version distribution (1h window)
        - record: prompt:version:distribution_1h
          expr: |
            sum by (prompt_name, prompt_version) (increase(prompt_usage_total{job="mcp-server-langgraph"}[1h]))

    # =========================================================================
    # Prompt Validation Alerts
    # =========================================================================
    - name: prompt.validation_alerts
      interval: 30s
      rules:
        # High validation failure rate
        - alert: PromptValidationFailureRateHigh
          expr: |
            (
              sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
              / (
                sum(rate(prompt_validation_success_total{job="mcp-server-langgraph"}[5m]))
                + sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
              )
            ) > 0.1
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
          annotations:
            summary: "High prompt validation failure rate (> 10%)"
            description: |
              Prompt validation failure rate is {{ printf "%.2f" $value | float64 | mul 100 }}% over the last 5 minutes.
              This may indicate LLM output drift or prompt degradation.

              Investigation steps:
              1. Check prompt_validation_failure_total by failure_type
              2. Review recent prompt changes in ADR-0089
              3. Check LLM provider status
            runbook_url: "https://docs.internal/runbooks/prompt-validation-failures"

        # Critical validation failure rate
        - alert: PromptValidationFailureRateCritical
          expr: |
            (
              sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
              / (
                sum(rate(prompt_validation_success_total{job="mcp-server-langgraph"}[5m]))
                + sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
              )
            ) > 0.25
          for: 2m
          labels:
            severity: critical
            category: prompt_quality
          annotations:
            summary: "Critical prompt validation failure rate (> 25%)"
            description: |
              Prompt validation failure rate is {{ printf "%.2f" $value | float64 | mul 100 }}% over the last 5 minutes.
              This is a critical issue affecting user experience.

              Immediate actions:
              1. Check if LLM provider is returning valid responses
              2. Consider enabling fallback responses
              3. Review recent deployments for prompt changes
            runbook_url: "https://docs.internal/runbooks/prompt-validation-failures#critical"

        # Specific prompt failing validation
        - alert: PromptSpecificValidationFailing
          expr: |
            (
              sum by (prompt_name) (rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
              / (
                sum by (prompt_name) (rate(prompt_validation_success_total{job="mcp-server-langgraph"}[5m]))
                + sum by (prompt_name) (rate(prompt_validation_failure_total{job="mcp-server-langgraph"}[5m]))
              )
            ) > 0.2
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
          annotations:
            summary: "Prompt {{ $labels.prompt_name }} has high validation failure rate"
            description: |
              Prompt '{{ $labels.prompt_name }}' has a validation failure rate of {{ printf "%.2f" $value | float64 | mul 100 }}%.

              Check the specific prompt configuration and LLM response patterns.

    # =========================================================================
    # Parse Error Alerts
    # =========================================================================
    - name: prompt.parse_error_alerts
      interval: 30s
      rules:
        # High JSON parse error rate
        - alert: PromptParseErrorRateHigh
          expr: |
            sum(rate(prompt_validation_parse_error_total{job="mcp-server-langgraph"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
          annotations:
            summary: "High JSON parse error rate in prompt responses"
            description: |
              JSON parse errors are occurring at {{ printf "%.3f" $value }} errors/second.
              LLM may be returning malformed JSON or markdown-wrapped responses.

              Check:
              1. LLM response format in logs
              2. Markdown code block stripping in validation.py
              3. LLM temperature and output format settings

        # Parse errors for specific prompt
        - alert: PromptSpecificParseErrors
          expr: |
            sum by (prompt_name) (rate(prompt_validation_parse_error_total{job="mcp-server-langgraph"}[5m])) > 0.05
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
          annotations:
            summary: "Prompt {{ $labels.prompt_name }} experiencing parse errors"
            description: |
              Prompt '{{ $labels.prompt_name }}' has parse errors at {{ printf "%.3f" $value }} errors/second.
              Review the prompt's output format instructions.

    # =========================================================================
    # Prompt Usage Anomaly Alerts
    # =========================================================================
    - name: prompt.usage_alerts
      interval: 60s
      rules:
        # No prompt usage (service may be down)
        - alert: PromptUsageAbsent
          expr: |
            absent(prompt_usage_total{job="mcp-server-langgraph"}) == 1
          for: 10m
          labels:
            severity: warning
            category: prompt_quality
          annotations:
            summary: "No prompt usage metrics - service may be down"
            description: |
              No prompt_usage_total metrics have been received for 10 minutes.
              This may indicate the service is not processing any prompts.

              Check:
              1. Service health and pod status
              2. Prometheus scrape configuration
              3. Metrics endpoint availability

        # Unusual drop in prompt usage
        - alert: PromptUsageDrop
          expr: |
            (
              sum(rate(prompt_usage_total{job="mcp-server-langgraph"}[5m]))
              / sum(rate(prompt_usage_total{job="mcp-server-langgraph"}[1h] offset 1h))
            ) < 0.5
          for: 10m
          labels:
            severity: warning
            category: prompt_quality
          annotations:
            summary: "Prompt usage dropped by more than 50%"
            description: |
              Prompt usage has dropped to {{ printf "%.2f" $value | float64 | mul 100 }}% of the hourly baseline.
              This may indicate service degradation or traffic shift.

    # =========================================================================
    # Failure Type Breakdown Alerts
    # =========================================================================
    - name: prompt.failure_type_alerts
      interval: 30s
      rules:
        # High constraint violation rate
        - alert: PromptConstraintViolationsHigh
          expr: |
            sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph",failure_type="constraint_violation"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
            failure_type: constraint_violation
          annotations:
            summary: "High rate of constraint violations in prompt outputs"
            description: |
              LLM outputs are violating schema constraints (e.g., confidence > 1.0, invalid ranges).
              Rate: {{ printf "%.3f" $value }} violations/second.

              This may indicate:
              1. Prompt instructions need clarification on value ranges
              2. LLM model change affecting output quality

        # High missing field rate
        - alert: PromptMissingFieldsHigh
          expr: |
            sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph",failure_type="missing_field"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
            failure_type: missing_field
          annotations:
            summary: "High rate of missing fields in prompt outputs"
            description: |
              LLM outputs are missing required fields.
              Rate: {{ printf "%.3f" $value }} errors/second.

              Review prompt output format instructions.

        # High invalid enum rate
        - alert: PromptInvalidEnumValuesHigh
          expr: |
            sum(rate(prompt_validation_failure_total{job="mcp-server-langgraph",failure_type="invalid_enum"}[5m])) > 0.1
          for: 5m
          labels:
            severity: warning
            category: prompt_quality
            failure_type: invalid_enum
          annotations:
            summary: "High rate of invalid enum values in prompt outputs"
            description: |
              LLM outputs contain invalid enum values (e.g., invalid category, unknown type).
              Rate: {{ printf "%.3f" $value }} errors/second.

              Ensure prompts list all valid enum values explicitly.
