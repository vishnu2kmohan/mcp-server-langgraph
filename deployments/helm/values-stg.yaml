# stg values for mcp-server-langgraph
# stg environment for testing before production deployment

# Image configuration
image:
  repository: ghcr.io/vishnu2kmohan/mcp-server-langgraph
  tag: "stg"  # stg uses 'stg' tag (schema forbids 'latest')
  pullPolicy: Always  # Required for mutable tags to ensure fresh images on every deploy
  variant: "base"

# Reduced replicas for stg
replicaCount: 2

# Resource limits for stg (lower than production)
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 384Mi

# Autoscaling for stg
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60
  targetMemoryUtilizationPercentage: 70

# External Secrets configuration for stg
externalSecrets:
  enabled: true
  refreshInterval: 15m  # More frequent refresh in stg for testing
  secretStore:
    kind: SecretStore
    provider: gcpsm
    projectID: "${GCP_PROJECT_ID}"  # TODO: Replace with actual stg project ID or use envsubst

  secrets:
    - name: mcp-server-langgraph-secrets
      remoteRefs:
        - remoteKey: stg/anthropic-api-key
          secretKey: anthropic-api-key
        - remoteKey: stg/jwt-secret-key
          secretKey: jwt-secret-key
        - remoteKey: stg/openai-api-key
          secretKey: openai-api-key

# Database configuration (stg instance)
database:
  host: "postgres-stg.c.${GCP_PROJECT_ID}.internal"  # TODO: Replace ${GCP_PROJECT_ID} with actual Cloud SQL instance
  port: 5432
  name: "mcp_server_langgraph_stg"
  existingSecret: "mcp-server-langgraph-db-secrets"

# Redis configuration (stg instance)
redis:
  host: "redis-stg.svc.cluster.local"
  port: 6379
  existingSecret: "mcp-server-langgraph-redis-secrets"
  ssl: false  # stg may use plain text for debugging

# Keycloak configuration (stg)
keycloak:
  serverUrl: "https://KEYCLOAK_STG_DOMAIN"  # TODO: Replace with actual stg Keycloak domain
  realm: "stg"
  clientId: "mcp-server-langgraph-stg"
  existingSecret: "mcp-server-langgraph-keycloak-secrets"

# OpenFGA configuration removed - app-level config should use secrets.openfgaStoreId/openfgaModelId
# Chart-level openfga configuration (if needed) should match OpenFGA chart schema
# openfga:
#   postgresql:
#     enabled: true
#   service:
#     type: ClusterIP

# Monitoring (enabled for testing)
monitoring:
  enabled: true
  prometheus:
    enabled: true
  opentelemetry:
    enabled: true
    exporters:
      - otlp
      - prometheus

# Ingress for stg
ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-stg"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: stg-api.mcp-server-langgraph.com  # Replace with actual stg domain
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-server-langgraph-stg-tls
      hosts:
        - stg-api.mcp-server-langgraph.com

# Service account
serviceAccount:
  create: true
  annotations:
    # TODO: Replace ${GCP_PROJECT_ID} with actual project ID
    iam.gke.io/gcp-service-account: mcp-server-langgraph-stg@${GCP_PROJECT_ID}.iam.gserviceaccount.com

# stg-specific configuration
env:
  ENVIRONMENT: "stg"
  LOG_LEVEL: "debug"  # More verbose logging in stg
  ENABLE_DEBUG: "true"  # Enable debug features
  GDPR_STORAGE_BACKEND: "postgres"
  CACHE_BACKEND: "redis"
  # LLM Factory Streaming - Production-ready resilient streaming via LLMFactory.astream()
  # Provides bulkhead, circuit breaker, and retry patterns for streaming responses
  FF_ENABLE_LLM_FACTORY_STREAMING: "true"

# stg-specific settings
stg:
  enableStrictValidation: false  # More permissive for testing
  requireTLS: false
  enableAuditLogging: true
  retentionDays: 30  # Shorter retention in stg
