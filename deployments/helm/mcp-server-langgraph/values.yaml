# Default values for mcp-server-langgraph
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 2  # Optimized from 3 (-33% base cost)

image:
  repository: ghcr.io/vishnu2kmohan/mcp-server-langgraph
  # pullPolicy: IfNotPresent is correct for immutable semver tags (e.g., "2.8.0")
  # Use "Always" for mutable tags (e.g., "stg", "develop") to ensure fresh images
  # See: values-stg.yaml for mutable tag example
  pullPolicy: IfNotPresent
  # NOTE: Image tag is managed by CI/CD pipeline - updated automatically on deployment
  # Do not edit manually - use --set image.tag=X.Y.Z in helm install/upgrade commands
  tag: "2.8.0"
  # Image variant selection (choose based on deployment needs)
  # Variants:
  #   base (default): 724MB - API-based embeddings, no ML (most deployments)
  #   full:           4.32GB - Includes PyTorch + sentence-transformers (local ML)
  #   test:           880MB - Dev dependencies (CI/CD only)
  variant: "base"  # Options: base, full, test

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations:
    # AWS EKS IRSA
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/mcp-server-langgraph-role
    # GKE Workload Identity
    # iam.gke.io/gcp-service-account: mcp-server-langgraph@PROJECT_ID.iam.gserviceaccount.com
    # Azure AKS Workload Identity
    # azure.workload.identity/client-id: "AZURE_CLIENT_ID"
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/metrics/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
    - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8000
  annotations: {}
    # AWS EKS Network Load Balancer
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # GKE
    # cloud.google.com/neg: '{"ingress": true}'

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # For AWS ALB
    # kubernetes.io/ingress.class: alb
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
  hosts:
    - host: mcp-server-langgraph.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mcp-server-langgraph-tls
      hosts:
        - mcp-server-langgraph.example.com

resources:
  # Optimized resource allocation (70% cost reduction)
  limits:
    cpu: 1000m       # Was: 2000m (-50%)
    memory: 1Gi      # Was: 2Gi (-50%)
  requests:
    cpu: 250m        # Was: 500m (-50%)
    memory: 384Mi    # Was: 512Mi (-25%)

autoscaling:
  enabled: true
  minReplicas: 2                         # Was: 3 (-33% base cost)
  maxReplicas: 20                        # Was: 10 (+100% burst capacity)
  targetCPUUtilizationPercentage: 60     # Was: 70 (more responsive)
  targetMemoryUtilizationPercentage: 70  # Was: 80 (safer buffer)
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 2
          periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 4
          periodSeconds: 30
      selectPolicy: Max

nodeSelector: {}

tolerations:
  - key: "workload"
    operator: "Equal"
    value: "ai-agents"
    effect: "NoSchedule"

# Topology Spread Constraints for zone distribution
# Ensures pods are evenly distributed across availability zones for HA
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mcp-server-langgraph
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: mcp-server-langgraph

affinity:
  podAntiAffinity:
    # Required: Do not schedule pods on the same zone (production-grade HA)
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - mcp-server-langgraph
        topologyKey: topology.kubernetes.io/zone
    # Preferred: Try to spread across different nodes
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - mcp-server-langgraph
          topologyKey: kubernetes.io/hostname

# Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Network Policy
networkPolicy:
  # NetworkPolicy template not yet implemented in Helm chart
  # Use Kustomize deployments (deployments/base/networkpolicy.yaml) for network policies
  enabled: false
  policyTypes:
    - Ingress
    - Egress

# Health checks (custom format for templates)
healthChecks:
  startup:
    path: /health/startup
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    path: /health/live
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /health/ready
    initialDelaySeconds: 20
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Standard Kubernetes probe definitions (for compatibility)
livenessProbe:
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 20
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health/startup
    port: http
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

# Application configuration
config:
  serviceName: "mcp-server-langgraph"
  environment: "production"
  logLevel: "INFO"

  # LLM Configuration
  llmProvider: "anthropic"  # google, anthropic, openai, azure, bedrock, ollama
  modelName: "claude-sonnet-4-5"
  modelTemperature: "0.7"
  modelMaxTokens: "4096"
  modelTimeout: "60"
  enableFallback: "true"

  # Agent Configuration
  maxIterations: "10"
  enableCheckpointing: "true"

  # Observability
  enableTracing: "true"
  enableMetrics: "true"
  enableConsoleExport: "false"
  observabilityBackend: "opentelemetry"  # opentelemetry, langsmith, both
  langsmithTracing: "false"

  # Alerting Backend Configuration (ADR-0098)
  # Fallback chain: Grafana -> Mimir -> Stub
  alertingFallbackEnabled: "false"  # Enable resilient alerting fallback chain
  alertingHealthCheckInterval: "30"  # Health check cache TTL in seconds
  alertingBackend: "grafana"  # Direct backend: grafana, mimir, stub (when fallback disabled)
  mimirUrl: "http://mimir:9009"  # Mimir server URL
  mimirOrgId: "anonymous"  # Mimir tenant ID for multi-tenancy

  # Authentication
  authProvider: "keycloak"  # inmemory, keycloak
  authMode: "token"  # token (JWT), session

  # Keycloak Configuration
  # Internal URL for backend-to-backend communication (token exchange, introspection)
  # In Kubernetes, use the internal service name (e.g., http://keycloak:8080/authn)
  keycloakServerUrl: "http://keycloak:8080"
  # Public URL for browser redirects in OAuth2/PKCE flow (externally accessible)
  # Set this to the ingress URL users access (e.g., https://auth.example.com/authn)
  # Falls back to keycloakServerUrl if empty
  keycloakPublicUrl: ""
  keycloakRealm: "mcp-server-langgraph"
  keycloakClientId: "langgraph-client"
  keycloakVerifySsl: "true"
  keycloakTimeout: "30"
  keycloakHostname: "mcp-server-langgraph.example.com"

  # Session Management
  sessionBackend: "redis"  # memory, redis
  redisUrl: "redis://redis-session:6379/0"
  redisSsl: "false"
  sessionTtlSeconds: "86400"  # 24 hours
  sessionSlidingWindow: "true"
  sessionMaxConcurrent: "5"

  # Agentic Loop Configuration (Anthropic Best Practices)
  # Context Management - Implements "Compaction" technique
  enableContextCompaction: "true"
  compactionThreshold: "8000"  # Token count that triggers compaction
  targetAfterCompaction: "4000"  # Target tokens after compaction
  recentMessageCount: "5"  # Number of recent messages to keep uncompacted

  # Work Verification - Implements "LLM-as-Judge" pattern
  enableVerification: "true"
  verificationQualityThreshold: "0.7"  # Minimum quality score (0.0-1.0)
  maxRefinementAttempts: "3"  # Maximum refinement iterations
  verificationMode: "standard"  # strict, standard, lenient

  # Dynamic Context Loading (Just-in-Time) - Requires Qdrant
  enableDynamicContextLoading: "false"  # Enable semantic search-based context
  qdrantUrl: "qdrant"  # Qdrant service name
  qdrantPort: "6333"  # Qdrant HTTP API port
  qdrantCollectionName: "mcp_context"  # Collection for context storage
  dynamicContextMaxTokens: "2000"  # Max tokens from dynamic context
  dynamicContextTopK: "3"  # Top semantic search results
  embeddingModel: "all-MiniLM-L6-v2"  # SentenceTransformer model
  contextCacheSize: "100"  # LRU cache size for contexts

  # Parallel Tool Execution - Performance Optimization
  enableParallelExecution: "false"
  maxParallelTools: "5"  # Maximum concurrent tool executions

  # Enhanced Note-Taking - Structured Information Extraction
  enableLlmExtraction: "false"  # Use LLM for note extraction

  # ===========================================================================
  # Anthropic Best Practices (ADR-0072)
  # ===========================================================================
  # Phase 1: Foundation
  enableToolExamples: "true"      # Tool input examples (72% -> 90% accuracy improvement)
  enableThinkTool: "true"         # Think tool for structured reasoning (54% improvement)
  enableDeferLoading: "false"     # Defer tool loading for token efficiency (experimental)
  # Phase 2: PII Tokenization (COMPLIANCE CRITICAL)
  enablePiiTokenization: "false"  # PII detection and tokenization (GDPR/HIPAA, experimental)
  # Phase 3: Skills System
  enableSkillsSystem: "false"     # SKILL.md-based skills system (experimental)
  enableSkillsMarketplace: "false"  # Anthropic skills marketplace integration (experimental)
  # Phase 4: Multi-Agent & Sandbox
  enableProgrammaticTools: "false"  # Programmatic tool calling from sandbox (experimental)
  enableMultiAgentOrchestration: "false"  # Orchestrator-worker pattern (experimental)
  enableAgenticMemory: "false"    # NOTES.md structured note-taking (experimental)

  # ===========================================================================
  # Multi-Agent Orchestrators (ADR-0078)
  # ===========================================================================
  # Parallel execution orchestrators for AI analysis tasks.
  # Enable for 3-4x performance improvement over sequential execution.
  # See: docs/guides/multi-agent-orchestrators.mdx for API documentation
  # See: docs-internal/runbooks/ORCHESTRATOR_OPERATIONS.md for monitoring
  # All values map to FF_* environment variables (FeatureFlags prefix)

  # UX Orchestrator - Parallel AI UX composite analysis
  # Runs persona, disclosure, and error analysis in parallel
  # API: POST /api/v1/ai/composite-analysis
  # Env: FF_ENABLE_ORCHESTRATED_AI_UX
  enableOrchestratedAiUx: "false"

  # Alert Orchestrator - Parallel alert correlation and root cause analysis
  # Runs correlation, root cause, remediation, and pattern detection in parallel
  # API: POST /api/v1/alerts/correlate
  # Env: FF_ENABLE_ORCHESTRATED_ALERT_ANALYSIS
  enableOrchestratedAlertAnalysis: "false"

  # Orchestrator Resilience - Enable circuit breaker, timeout, bulkhead patterns
  # Env: FF_ENABLE_ORCHESTRATOR_RESILIENCE
  enableOrchestratorResilience: "true"

  # Orchestrator Cost Tracking
  # Per-orchestration limit in USD (prevents runaway costs, range: 0.01-100.0)
  # Env: FF_ORCHESTRATION_COST_LIMIT
  orchestrationCostLimit: "0.50"
  # Per-session limit in USD (range: 0.10-1000.0)
  # Env: FF_SESSION_COST_LIMIT
  sessionCostLimit: "5.00"
  # Cost alert thresholds as comma-separated percentages
  # Env: FF_COST_ALERT_THRESHOLDS (parsed as JSON list)
  costAlertThresholds: "[0.5, 0.75, 0.9]"

  # Orchestrator Timeout - Maximum execution time in seconds (range: 30-600)
  # Env: FF_ORCHESTRATOR_TIMEOUT_SECONDS
  orchestratorTimeoutSeconds: "300"

  # Orchestrator Bulkhead - Maximum concurrent orchestrations (range: 1-20)
  # Env: FF_ORCHESTRATOR_MAX_CONCURRENT
  orchestratorMaxConcurrent: "5"

  # Circuit Breaker - Failures before circuit opens (range: 1-10)
  # Env: FF_ORCHESTRATOR_CIRCUIT_BREAKER_THRESHOLD
  orchestratorCircuitBreakerThreshold: "3"

  # Conversation Checkpointing (Distributed State)
  checkpointBackend: "redis"  # memory or redis (use redis for production)
  checkpointRedisUrl: "redis://redis-session:6379/1"  # Use db 1
  checkpointRedisTtl: "604800"  # 7 days TTL for conversation checkpoints

  # GDPR/HIPAA/SOC2 Compliance Storage (ADR-0041)
  # CRITICAL: Must use "postgres" in production (never use "memory")
  # Retention: Audit logs & consents = 7 years, Conversations = 90 days
  gdprStorageBackend: "postgres"  # postgres (production), memory (dev/test ONLY)
  # GDPR Postgres URL is constructed in deployment template from secrets
  # See templates/deployment.yaml for environment variable construction
  gdprPostgresUrl: ""  # Deprecated: Use secret-based env vars instead

# Secrets configuration
secrets:
  # Use existingSecret to reference an existing secret
  existingSecret: ""

  # Or provide secrets here (NOT recommended for production)
  # Use External Secrets Operator or cloud-native secret management instead

  # LLM Provider API Keys
  anthropicApiKey: ""
  googleApiKey: ""
  openaiApiKey: ""

  # Authentication & Authorization
  jwtSecretKey: ""
  openfgaStoreId: ""
  openfgaModelId: ""

  # Keycloak
  keycloakClientSecret: ""
  keycloakAdminUsername: "admin"
  keycloakAdminPassword: ""

  # PostgreSQL
  postgresUsername: "postgres"
  postgresPassword: ""

  # Redis
  redisPassword: ""

  # LangSmith Observability (optional)
  langsmithApiKey: ""

  # SSO Identity Provider Credentials (optional)
  # Enable social login via GitHub, Google, and Microsoft OAuth2
  # If not provided, the IdP will be disabled in Keycloak
  githubClientId: ""
  githubClientSecret: ""
  googleClientId: ""
  googleClientSecret: ""
  microsoftClientId: ""
  microsoftClientSecret: ""

  # Secrets Management (optional)
  infisicalClientId: ""
  infisicalClientSecret: ""
  infisicalProjectId: ""

  # Web Push Notification VAPID Keys (required for push notifications)
  # Generate with: npx web-push generate-vapid-keys
  # Reference: ADR-0026 - Comprehensive Client Resilience Patterns
  vapidPublicKey: ""
  vapidPrivateKey: ""
  vapidClaimsEmail: "admin@example.com"

# External Secrets Operator integration
externalSecrets:
  enabled: false
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager  # or azure-key-vault, gcp-secret-manager, vault
    kind: SecretStore
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: mcp-server-langgraph/anthropic-api-key
    - secretKey: jwt-secret-key
      remoteRef:
        key: mcp-server-langgraph/jwt-secret-key
    - secretKey: openfga-store-id
      remoteRef:
        key: mcp-server-langgraph/openfga-store-id
    - secretKey: openfga-model-id
      remoteRef:
        key: mcp-server-langgraph/openfga-model-id
    # SSO Identity Provider Credentials (optional)
    - secretKey: github-client-id
      remoteRef:
        key: mcp-server-langgraph/github-client-id
    - secretKey: github-client-secret
      remoteRef:
        key: mcp-server-langgraph/github-client-secret
    - secretKey: google-client-id
      remoteRef:
        key: mcp-server-langgraph/google-client-id
    - secretKey: google-client-secret
      remoteRef:
        key: mcp-server-langgraph/google-client-secret
    - secretKey: microsoft-client-id
      remoteRef:
        key: mcp-server-langgraph/microsoft-client-id
    - secretKey: microsoft-client-secret
      remoteRef:
        key: mcp-server-langgraph/microsoft-client-secret
    # Web Push VAPID Keys (ADR-0026 - Push Notifications)
    - secretKey: vapid-public-key
      remoteRef:
        key: mcp-server-langgraph/vapid-public-key
    - secretKey: vapid-private-key
      remoteRef:
        key: mcp-server-langgraph/vapid-private-key

# OpenFGA dependency
openfga:
  postgresql:
    enabled: true
  service:
    type: ClusterIP
    port: 8080

# PostgreSQL Configuration
# Choose between in-cluster PostgreSQL or external cloud-managed databases
postgresql:
  # Set to false to use external database (CloudSQL, RDS, Azure Database)
  enabled: true

  # In-cluster PostgreSQL configuration (when enabled=true)
  auth:
    username: postgres
    password: postgres
    # Multiple databases will be created via initdb scripts
    database: postgres
  primary:
    initdb:
      scripts:
        init-databases.sql: |
          -- Create separate databases for OpenFGA and Keycloak
          CREATE DATABASE openfga;
          CREATE DATABASE keycloak;
    persistence:
      enabled: true
      size: 10Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi

  # External PostgreSQL configuration (when enabled=false)
  # Use this for production with CloudSQL, RDS, or Azure Database
  external:
    # Connection details
    host: ""  # e.g., my-instance.123456789.us-central1.sql.gke.io (CloudSQL)
              #      my-db.abc123.us-east-1.rds.amazonaws.com (RDS)
              #      my-server.postgres.database.azure.com (Azure)
    port: 5432
    database: postgres
    username: postgres

    # Password can be provided via existingSecret or directly (not recommended)
    password: ""
    existingSecret: ""  # Name of existing secret with password
    existingSecretPasswordKey: "postgres-password"

    # SSL/TLS configuration
    sslMode: "require"  # disable, allow, prefer, require, verify-ca, verify-full
    sslCert: ""  # Path to client certificate (optional)
    sslKey: ""   # Path to client key (optional)
    sslRootCert: ""  # Path to root CA certificate (optional)

    # Cloud-specific configurations
    cloud:
      # GCP CloudSQL
      cloudSql:
        enabled: false
        # When enabled, adds CloudSQL proxy sidecar
        instanceConnectionName: ""  # project:region:instance
        credentialsSecret: ""  # Secret with GCP service account key
        proxyImage: "gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.11.4"
        proxyResources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi

      # AWS RDS
      rds:
        enabled: false
        # RDS uses IAM authentication via IRSA
        useIamAuth: false
        region: "us-east-1"

      # Azure Database
      azure:
        enabled: false
        # Azure uses managed identity for authentication
        useManagedIdentity: false

# Redis dependency (for session management)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    password: redis
  master:
    persistence:
      enabled: true
      size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi

# Keycloak dependency (for SSO/authentication)
keycloak:
  enabled: true
  replicas: 2
  postgresql:
    enabled: false  # Use shared PostgreSQL instance above
  externalDatabase:
    host: postgresql
    port: 5432
    database: keycloak
    user: postgres
    existingSecret: ""
    existingSecretPasswordKey: postgres-password
  auth:
    adminUser: admin
    existingSecret: ""
    passwordSecretKey: keycloak-admin-password
  service:
    type: ClusterIP
    port: 8080
  # JVM memory settings to prevent OOM (matches docker-compose.test.yml pattern)
  # Keycloak 26.x with Quarkus defaults to -XX:MaxRAMPercentage=70 which can
  # exceed container limits during startup. Explicit heap limits ensure
  # predictable memory usage. Scaled for 2Gi memory limit.
  extraEnv: |
    - name: JAVA_OPTS_APPEND
      value: "-Xms1g -Xmx1536m -XX:MaxMetaspaceSize=256m"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

# Jaeger dependency (for distributed tracing)
jaeger:
  enabled: true
  provisionDataStore:
    cassandra: false
  allInOne:
    enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  storage:
    type: none  # Use in-memory storage for simplicity
  agent:
    enabled: false  # Not needed with allInOne
  collector:
    enabled: false  # Not needed with allInOne
  query:
    enabled: false  # Not needed with allInOne
  service:
    type: ClusterIP
    # UI port
    query:
      port: 16686
    # Collector ports
    collector:
      http:
        port: 14268
      grpc:
        port: 14250
      zipkin:
        port: 9411

# Kube Prometheus Stack (Prometheus + AlertManager + Grafana)
# Note: This includes its own Grafana, but we're using Bitnami Grafana above
kube-prometheus-stack:
  enabled: true

  # Disable the built-in Grafana since we're using Bitnami Grafana
  grafana:
    enabled: false

  # Prometheus configuration
  prometheus:
    enabled: true
    prometheusSpec:
      retention: 30d
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 50Gi
      # Service monitors
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false

  # AlertManager configuration
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: 'default'
        group_by: ['alertname', 'severity', 'component']
        group_wait: 10s
        group_interval: 10s
        repeat_interval: 12h
        routes:
          # Route critical alerts to MCP Server for AI remediation + Slack
          - match:
              severity: critical
            receiver: slack-critical
            group_wait: 0s
            repeat_interval: 4h
            continue: true  # Continue to mcp-server-alerts
          - match:
              severity: critical
            receiver: mcp-server-alerts
            group_wait: 0s
            repeat_interval: 4h
          # Route warning alerts to MCP Server for AI remediation + Slack
          - match:
              severity: warning
            receiver: slack-warnings
            repeat_interval: 12h
            continue: true  # Continue to mcp-server-alerts
          - match:
              severity: warning
            receiver: mcp-server-alerts
            repeat_interval: 12h
          - match:
              severity: info
            receiver: email
            repeat_interval: 24h
      receivers:
        - name: 'default'
          webhook_configs:
            - url: 'http://localhost:5001/webhook'
        # MCP Server Alert Integration (ADR-0026)
        # Routes critical/warning alerts to mcp-server for AI-powered remediation
        - name: 'mcp-server-alerts'
          webhook_configs:
            - url: 'http://{{ .Release.Name }}-mcp-server-langgraph:80/api/v1/webhooks/alertmanager'
              send_resolved: true
              http_config:
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        - name: 'slack-critical'
          slack_configs:
            - api_url: '<YOUR_SLACK_WEBHOOK_URL>'
              channel: '#alerts-critical'
              title: 'Critical Alert: {{ .GroupLabels.alertname }}'
              text: '{{ .CommonAnnotations.summary }}'
        - name: 'slack-warnings'
          slack_configs:
            - api_url: '<YOUR_SLACK_WEBHOOK_URL>'
              channel: '#alerts-warnings'
              title: 'Warning: {{ .GroupLabels.alertname }}'
        - name: 'email'
          email_configs:
            - to: 'team@example.com'
              from: 'alerts@example.com'
    alertmanagerSpec:
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
      storage:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  # Prometheus Operator
  prometheusOperator:
    enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

# Grafana dependency (for dashboards and visualization)
grafana:
  enabled: true
  admin:
    user: admin
    password: admin
  service:
    type: ClusterIP
    port: 80
  # Dashboard provisioning via sidecar
  # Sidecar discovers ConfigMaps with grafana_dashboard: "1" label
  # and organizes dashboards into folders based on grafana_folder annotation
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      folderAnnotation: grafana_folder
      searchNamespace: null
      provider:
        foldersFromFilesStructure: false
        allowUiUpdates: true
  # Dashboard folders (8 categories, 36 dashboards total):
  #   AI/, Application/, Auth/, Compliance/,
  #   Infrastructure/, Overview/, Resilience/, WebSocket/
  # Datasource configuration
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://{{ .Release.Name }}-kube-prometheus-stack-prometheus:9090
          isDefault: true
          editable: true
        - name: Jaeger
          type: jaeger
          access: proxy
          url: http://{{ .Release.Name }}-jaeger-query:16686
          editable: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Service Mesh (Istio/Linkerd)
# Enable for production deployments with mTLS STRICT mode
serviceMesh:
  enabled: true  # Changed to true for production-grade security
  istio:
    # Sidecar injection (also set via namespace label)
    injection: enabled
    # Gateway for external traffic
    gateway:
      enabled: true
      hosts:
        - "mcp.example.com"
      tlsCredentialName: "mcp-server-tls"
    # VirtualService for traffic management
    virtualService:
      enabled: true
      retries:
        attempts: 3
        perTryTimeout: 10s
      timeout: 30s
      canaryWeight: 10  # 10% traffic to canary
    # DestinationRule with mTLS
    destinationRule:
      enabled: true
      mtlsMode: ISTIO_MUTUAL
      circuitBreaker:
        consecutive5xxErrors: 5
        interval: 30s
        baseEjectionTime: 30s
    # PeerAuthentication - STRICT mTLS
    peerAuthentication:
      enabled: true
      mode: STRICT
    # AuthorizationPolicy
    authorizationPolicy:
      enabled: true
      allowIngress: true
      allowMonitoring: true

# Monitoring
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Kong API Gateway integration
kong:
  enabled: false
  # Hosts for Kong ingress
  hosts:
    - mcp-server-langgraph.example.com
  # Path configuration
  path: /
  pathType: Prefix
  # Strip path prefix
  stripPath: "false"
  # Preserve host header
  preserveHost: "true"
  # Protocols
  protocols:
    - https
    - http
  # Timeouts (milliseconds)
  timeouts:
    connect: 60000
    read: 300000
    write: 300000
  # TLS configuration
  tls:
    enabled: true
    secretName: mcp-server-langgraph-tls
  # Kong plugins to apply
  plugins:
    - rate-limit-basic
    - request-size-limit
    - cors
    - prometheus
  # Additional annotations
  annotations: {}
  # Rate limiting tier
  rateLimitTier: basic  # basic, premium, enterprise
