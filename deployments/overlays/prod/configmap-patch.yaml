apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-server-langgraph-config
data:
  # Service Configuration
  environment: "prod"
  log_level: "INFO"

  # Authentication (Keycloak required for prod)
  auth_provider: "keycloak"
  auth_mode: "token"

  # Session Management (Redis required for prod)
  session_backend: "redis"
  session_ttl_seconds: "86400"  # 24 hours
  session_sliding_window: "true"
  session_max_concurrent: "5"

  # Observability
  enable_console_export: "false"
  enable_tracing: "true"
  enable_metrics: "true"
  observability_backend: "both"  # OpenTelemetry + LangSmith
  langsmith_tracing: "true"

  # Security
  keycloak_verify_ssl: "true"
  redis_ssl: "false"  # In-cluster Redis does not have TLS configured

  # Service URLs (override base with prod- prefix)
  keycloak_server_url: "http://prod-keycloak:8080"
  redis_url: "redis://prod-redis-session:6379/0"
  checkpoint_redis_url: "redis://prod-redis-session:6379/1"
  openfga_api_url: "http://prod-openfga:8080"
