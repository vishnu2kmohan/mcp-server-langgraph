groups:
- name: resilience.circuit_breaker
  interval: 30s
  rules:
  - alert: CircuitBreakerOpen
    expr: circuit_breaker_state{service=~"redis|keycloak|openfga|postgres"} == 1
    for: 5m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: 'Critical circuit breaker OPEN: {{ $labels.service }}'
      description: |
        Circuit breaker for {{ $labels.service }} has been open for 5+ minutes.
        This means requests are failing fast without reaching the service.

        Impact: Service functionality dependent on {{ $labels.service }} is degraded.

        Investigate:
        1. Check {{ $labels.service }} health: kubectl logs -l app={{ $labels.service }}
        2. Check network connectivity
        3. Review error logs for root cause
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#circuit-breaker-open
      dashboard_url: '{{ grafana_url }}/d/resilience-patterns?var-service={{ $labels.service
        }}'
  - alert: CircuitBreakerOpenWarning
    expr: circuit_breaker_state{service=~"prometheus|tempo|loki"} == 1
    for: 10m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'Observability circuit breaker OPEN: {{ $labels.service }}'
      description: |
        Circuit breaker for observability service {{ $labels.service }} is open.
        Application continues to function but observability is degraded.
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#circuit-breaker-open
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: CircuitBreakerRecovering
    expr: circuit_breaker_state == 0.5
    for: 2m
    labels:
      severity: info
      team: platform
    annotations:
      summary: 'Circuit breaker recovering: {{ $labels.service }}'
      description: Circuit breaker for {{ $labels.service }} is half-open, testing
        recovery.
  - alert: CircuitBreakerFlapping
    expr: rate(circuit_breaker_state_changes_total[5m]) > 0.1
    for: 10m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'Circuit breaker flapping: {{ $labels.service }}'
      description: |
        Circuit breaker for {{ $labels.service }} is changing state frequently.
        This indicates an unstable service that's intermittently failing.

        Consider:
        - Increasing fail_max threshold
        - Investigating underlying service stability
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#circuit-breaker-flapping
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
- name: resilience.retry
  interval: 30s
  rules:
  - alert: RetryExhaustionHigh
    expr: rate(retry_exhausted_total[5m]) > 0.1
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: High retry exhaustion for {{ $labels.function }}
      description: |
        Function {{ $labels.function }} is exhausting all retry attempts at {{ $value | humanize }}/s.
        All {{ $labels.exception_type }} errors are not recovering within retry limits.

        This indicates persistent failures in the underlying operation.
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#high-retry-exhaustion
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: TransientErrorsElevated
    expr: rate(retry_success_after_retry_total[5m]) > 0.5
    for: 10m
    labels:
      severity: info
      team: platform
    annotations:
      summary: Elevated transient errors for {{ $labels.function }}
      description: |
        Function {{ $labels.function }} is successfully recovering from transient errors.
        This is working as expected but indicates underlying instability.
- name: resilience.timeout
  interval: 30s
  rules:
  - alert: TimeoutRateHigh
    expr: rate(timeout_exceeded_total[5m]) > 0.1
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: High timeout rate for {{ $labels.function }} ({{ $labels.operation_type
        }})
      description: |
        {{ $labels.function }} is timing out at {{ $value | humanize }}/s.
        Timeout: {{ $labels.timeout_seconds }}s for {{ $labels.operation_type }} operations.

        Consider:
        - Increasing timeout for this operation type
        - Investigating downstream service latency
        - Adding caching to reduce calls
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#high-timeout-rate
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
- name: resilience.bulkhead
  interval: 30s
  rules:
  - alert: BulkheadRejectionsHigh
    expr: rate(bulkhead_rejections_total[5m]) > 0.05
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'Bulkhead rejecting requests: {{ $labels.resource_type }}'
      description: |
        Bulkhead for {{ $labels.resource_type }} is rejecting requests at {{ $value | humanize }}/s.
        This means concurrency limit is being reached.

        Consider:
        - Increasing bulkhead limit
        - Scaling horizontally
        - Implementing request queuing
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#bulkhead-rejections
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: BulkheadQueueDeepening
    expr: bulkhead_queue_depth > 10
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'Bulkhead queue growing: {{ $labels.resource_type }}'
      description: |
        {{ $value }} requests queued waiting for {{ $labels.resource_type }} bulkhead.
        This indicates request volume exceeds processing capacity.
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
- name: resilience.adaptive_bulkhead
  interval: 30s
  rules:
  - alert: AdaptiveBulkheadAtFloor
    expr: adaptive_bulkhead_limit <= 2
    for: 10m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'LLM adaptive bulkhead at minimum: {{ $labels.provider }}'
      description: |
        Adaptive bulkhead for {{ $labels.provider }} has decreased to floor limit ({{ $value }}).
        This indicates sustained rate limit or overload errors from the provider.

        Current error rate: {{ with query "adaptive_bulkhead_error_rate{provider=\"" $labels.provider "\"}" }}{{ . | first | value | humanizePercentage }}{{ end }}

        Actions:
        - Check provider status page
        - Review rate limit quotas
        - Consider switching to fallback provider
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#adaptive-bulkhead-at-floor
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: AdaptiveBulkheadErrorRateHigh
    expr: adaptive_bulkhead_error_rate > 0.15
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'High LLM error rate: {{ $labels.provider }} ({{ $value | humanizePercentage
        }})'
      description: |
        {{ $labels.provider }} error rate is {{ $value | humanizePercentage }}, above 10% threshold.
        Adaptive bulkhead will continue decreasing concurrency limit.
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#high-llm-error-rate
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: AdaptiveBulkheadUnstable
    expr: rate(adaptive_bulkhead_adjustments_total[5m]) > 0.1
    for: 10m
    labels:
      severity: info
      team: platform
    annotations:
      summary: 'Adaptive bulkhead unstable: {{ $labels.provider }}'
      description: |
        {{ $labels.provider }} concurrency limit is adjusting frequently.
        Direction: {{ $labels.direction }}
- name: resilience.rate_limit
  interval: 30s
  rules:
  - alert: RateLimitTokenExhaustion
    expr: rate(rate_limit_token_exhausted_total[5m]) > 0.5
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'Rate limit tokens exhausted: {{ $labels.provider }}'
      description: |
        {{ $labels.provider }} rate limit tokens being exhausted at {{ $value | humanize }}/s.
        Requests are being queued waiting for tokens.

        Current wait time p95: {{ with query "histogram_quantile(0.95, rate(rate_limit_wait_time_bucket{provider=\"" $labels.provider "\"}[5m]))" }}{{ . | first | value | humanizeDuration }}{{ end }}
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#rate-limit-token-exhaustion
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: RateLimitWaitTimeHigh
    expr: histogram_quantile(0.95, rate(rate_limit_wait_time_bucket[5m])) > 5000
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'High rate limit wait time: {{ $labels.provider }}'
      description: |
        p95 wait time for {{ $labels.provider }} rate limit tokens is {{ $value | humanizeDuration }}.
        This may impact user experience.
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
- name: resilience.fallback
  interval: 30s
  rules:
  - alert: FallbackActivated
    expr: rate(fallback_used_total[5m]) > 0
    for: 1m
    labels:
      severity: info
      team: platform
    annotations:
      summary: 'Fallback activated: {{ $labels.function }}'
      description: |
        {{ $labels.function }} is using fallback due to {{ $labels.exception_type }}.
        Fallback type: {{ $labels.fallback_type }}

        Primary service is unavailable but graceful degradation is working.
  - alert: FallbackUsageSustained
    expr: rate(fallback_used_total[5m]) > 0.1
    for: 15m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: 'Sustained fallback usage: {{ $labels.function }}'
      description: |
        {{ $labels.function }} has been using fallback for 15+ minutes.
        This indicates prolonged primary service outage.
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
- name: resilience.http_pool
  interval: 30s
  rules:
  - alert: HTTPPoolNearCapacity
    expr: http_pool_utilization > 0.8
    for: 5m
    labels:
      severity: warning
      team: platform
    annotations:
      summary: HTTP connection pool at {{ $value | humanizePercentage }}
      description: |
        HTTP connection pool utilization is {{ $value | humanizePercentage }}.
        Active: {{ with query "http_pool_active_connections" }}{{ . | first | value }}{{ end }}
        Max: {{ with query "http_pool_max_connections" }}{{ . | first | value }}{{ end }}

        Consider:
        - Increasing max_connections
        - Scaling horizontally
        - Investigating slow HTTP calls
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#http-pool-exhaustion
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: HTTPPoolExhausted
    expr: http_pool_utilization >= 0.95
    for: 2m
    labels:
      severity: critical
      team: platform
    annotations:
      summary: HTTP connection pool exhausted!
      description: |
        HTTP connection pool is at {{ $value | humanizePercentage }} capacity.
        New HTTP requests may be blocked or fail.

        Immediate action required:
        1. Scale horizontally if possible
        2. Restart pods to reset connections
        3. Investigate connection leaks
      runbook_url: https://docs/runbooks/RESILIENCE_OPERATIONS.md#http-pool-exhaustion
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
- name: resilience.meta
  interval: 5m
  rules:
  - alert: ResilienceMetricsCardinalityHigh
    expr: |-
      count({__name__=~"circuit_breaker.*|retry.*|timeout.*|bulkhead.*|rate_limit.*|adaptive_bulkhead.*|fallback.*"}) > 10000
    for: 1h
    labels:
      severity: warning
      team: platform
    annotations:
      summary: High cardinality in resilience metrics
      description: |
        Resilience metrics have {{ $value }} unique time series, exceeding 10,000 threshold.
        This may cause Prometheus memory issues and slow queries.

        Investigate:
        1. Check function label cardinality: topk(10, count by (function) ({__name__=~"retry.*"}))
        2. Check exception_type cardinality: topk(10, count by (exception_type) ({__name__=~"fallback.*"}))
        3. Review METRICS_CARDINALITY.md for normalization recommendations
      runbook_url: https://docs/monitoring/METRICS_CARDINALITY.md
      dashboard_url: '{{ grafana_url }}/d/langgraph-agent/overview'
  - alert: ResilienceMetricsCardinalityGrowth
    expr: |
      (
        count({__name__=~"circuit_breaker.*|retry.*|timeout.*|bulkhead.*|rate_limit.*|adaptive_bulkhead.*|fallback.*"})
        -
        count({__name__=~"circuit_breaker.*|retry.*|timeout.*|bulkhead.*|rate_limit.*|adaptive_bulkhead.*|fallback.*"} offset 1h)
      ) > 1000
    for: 30m
    labels:
      severity: info
      team: platform
    annotations:
      summary: Rapid cardinality growth in resilience metrics
      description: |
        Resilience metrics cardinality grew by {{ $value }} time series in the last hour.
        This may indicate label explosion from dynamic values.

        Check for dynamic function names or exception types being introduced.
