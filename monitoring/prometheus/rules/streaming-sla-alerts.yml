groups:
  # LLM Streaming SLA Alert Rules
  # These alerts monitor streaming performance metrics and fire when SLA thresholds are breached
  # Reference: ADR-0075-LLM-STREAMING-METRICS.md

  - name: streaming_sla_alerts
    rules:
      # TTFC (Time To First Chunk) p95 exceeds 2 seconds
      # SLA threshold: Users should see first token within 2 seconds
      - alert: StreamingTTFCBreached
        expr: |
          histogram_quantile(0.95, sum(rate(llm_streaming_ttfc_seconds_bucket[5m])) by (le, provider)) > 2
        for: 5m
        labels:
          severity: warning
          component: streaming
          sla_metric: ttfc
        annotations:
          summary: "LLM streaming TTFC p95 exceeds 2 seconds"
          description: "Provider {{ $labels.provider }} has p95 TTFC of {{ $value | printf \"%.2f\" }}s (threshold: 2s)"
          runbook_url: "https://docs.internal/runbooks/streaming-ttfc-breach"
          dashboard_url: "https://grafana.internal/d/llm-streaming"

      # Inter-chunk latency p95 exceeds 250ms
      # SLA threshold: Smooth streaming requires <250ms between chunks
      - alert: StreamingLatencyBreached
        expr: |
          histogram_quantile(0.95, sum(rate(llm_streaming_inter_chunk_latency_seconds_bucket[5m])) by (le, provider)) > 0.25
        for: 5m
        labels:
          severity: warning
          component: streaming
          sla_metric: inter_chunk_latency
        annotations:
          summary: "LLM streaming inter-chunk latency p95 exceeds 250ms"
          description: "Provider {{ $labels.provider }} has p95 inter-chunk latency of {{ $value | printf \"%.3f\" }}s (threshold: 0.25s)"
          runbook_url: "https://docs.internal/runbooks/streaming-latency-breach"
          dashboard_url: "https://grafana.internal/d/llm-streaming"

      # Error rate exceeds 5%
      # SLA threshold: Less than 5% of streams should fail
      - alert: StreamingErrorRateHigh
        expr: |
          (
            sum(rate(llm_streaming_duration_seconds_count{status!="success"}[5m])) by (provider)
            / sum(rate(llm_streaming_duration_seconds_count[5m])) by (provider)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
          component: streaming
          sla_metric: error_rate
        annotations:
          summary: "LLM streaming error rate exceeds 5%"
          description: "Provider {{ $labels.provider }} has error rate of {{ $value | printf \"%.1f\" }}% (threshold: 5%)"
          runbook_url: "https://docs.internal/runbooks/streaming-error-rate"
          dashboard_url: "https://grafana.internal/d/llm-streaming"

      # TTFC p95 critical threshold (5 seconds)
      # Critical: Users experiencing very poor initial latency
      - alert: StreamingTTFCCritical
        expr: |
          histogram_quantile(0.95, sum(rate(llm_streaming_ttfc_seconds_bucket[5m])) by (le, provider)) > 5
        for: 3m
        labels:
          severity: critical
          component: streaming
          sla_metric: ttfc
        annotations:
          summary: "LLM streaming TTFC p95 critically high (>5s)"
          description: "Provider {{ $labels.provider }} has critical p95 TTFC of {{ $value | printf \"%.2f\" }}s (threshold: 5s)"
          runbook_url: "https://docs.internal/runbooks/streaming-ttfc-critical"
          dashboard_url: "https://grafana.internal/d/llm-streaming"

      # Streaming success rate below 90%
      # Critical: Major degradation in streaming reliability
      - alert: StreamingSuccessRateCritical
        expr: |
          (
            sum(rate(llm_streaming_duration_seconds_count{status="success"}[5m])) by (provider)
            / sum(rate(llm_streaming_duration_seconds_count[5m])) by (provider)
          ) < 0.90
        for: 5m
        labels:
          severity: critical
          component: streaming
          sla_metric: success_rate
        annotations:
          summary: "LLM streaming success rate below 90%"
          description: "Provider {{ $labels.provider }} has success rate of {{ $value | printf \"%.1f\" }}% (threshold: 90%)"
          runbook_url: "https://docs.internal/runbooks/streaming-success-rate-critical"
          dashboard_url: "https://grafana.internal/d/llm-streaming"

      # No streaming activity (potential outage)
      # Warning: No streams in the last 15 minutes may indicate an issue
      - alert: StreamingNoActivity
        expr: |
          sum(increase(llm_streaming_chunks_total[15m])) by (provider) == 0
        for: 15m
        labels:
          severity: warning
          component: streaming
          sla_metric: activity
        annotations:
          summary: "No LLM streaming activity detected"
          description: "Provider {{ $labels.provider }} has no streaming activity in the last 15 minutes"
          runbook_url: "https://docs.internal/runbooks/streaming-no-activity"
          dashboard_url: "https://grafana.internal/d/llm-streaming"

  - name: streaming_recording_rules
    interval: 30s
    rules:
      # Pre-compute TTFC p95 for dashboard efficiency
      - record: llm_streaming:ttfc_p95:5m
        expr: histogram_quantile(0.95, sum(rate(llm_streaming_ttfc_seconds_bucket[5m])) by (le, provider))
        labels:
          quantile: "0.95"

      # Pre-compute TTFC p50 for dashboard efficiency
      - record: llm_streaming:ttfc_p50:5m
        expr: histogram_quantile(0.50, sum(rate(llm_streaming_ttfc_seconds_bucket[5m])) by (le, provider))
        labels:
          quantile: "0.50"

      # Pre-compute inter-chunk latency p95
      - record: llm_streaming:inter_chunk_latency_p95:5m
        expr: histogram_quantile(0.95, sum(rate(llm_streaming_inter_chunk_latency_seconds_bucket[5m])) by (le, provider))
        labels:
          quantile: "0.95"

      # Pre-compute success rate
      - record: llm_streaming:success_rate:5m
        expr: |
          sum(rate(llm_streaming_duration_seconds_count{status="success"}[5m])) by (provider)
          / sum(rate(llm_streaming_duration_seconds_count[5m])) by (provider)

      # Pre-compute chunks per second
      - record: llm_streaming:chunks_per_second:5m
        expr: sum(rate(llm_streaming_chunks_total[5m])) by (provider, model)
