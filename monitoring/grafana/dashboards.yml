apiVersion: 1

# Dashboard provider configuration for Grafana
# Dashboards are organized into folders matching the file system structure:
#   - Overview/       : Main overview dashboard
#   - Application/    : Builder, LLM Performance, AI UX Metrics, Skills/Agents
#   - Auth/           : Authentication, OpenFGA, Keycloak, Security
#   - Infrastructure/ : LGTM Stack, PostgreSQL, Redis, Qdrant, Traefik, Resilience Patterns
#   - Compliance/     : SLA Monitoring, SOC2 Compliance (includes GDPR)
#
# AI UX Dashboard (ai-ux-metrics.json):
#   - LLM call metrics with circuit breaker state
#   - Cache hit rates and latency histograms
#   - WebSocket connection tracking
#   - Rate limit monitoring
providers:
  - name: 'MCP Server LangGraph Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
